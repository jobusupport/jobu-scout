\n\u002F\u002F support-view tenant's data without being individually rewritten. The\n\u002F\u002F server independently re-validates the token (expiry, ownership, admin\n\u002F\u002F status) on every request \u2014 this header is a transport convenience only.\n(function installSupportSessionFetchWrapper() {\n  const originalFetch = window.fetch.bind(window);\n  window.fetch = function (input, init) {\n    const support = getSupportSession();\n    if (!support) return originalFetch(input, init);\n    const url = typeof input === 'string' ? input : (input && input.url) || '';\n    if (!url.startsWith('\u002Fapi\u002F')) return originalFetch(input, init);\n    const opts = Object.assign({}, init);\n    opts.headers = Object.assign({}, (init && init.headers) || {}, {\n      'X-Support-Session': support.token,\n    });\n    return originalFetch(input, opts);\n  };\n})();\n\n\u002F\u002F \u2500\u2500 Sidebar collapse & dropdown menus \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction toggleSidebar() {\n  const layout = document.getElementById('appLayout');\n  if (!layout) return;\n  const collapsed = layout.classList.toggle('sidebar-collapsed');\n  try { localStorage.setItem('jobuSidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}\n}\ntry {\n  if (localStorage.getItem('jobuSidebarCollapsed') === '1') {\n    document.addEventListener('DOMContentLoaded', () => {\n      document.getElementById('appLayout')?.classList.add('sidebar-collapsed');\n    });\n  }\n} catch (e) {}\n\nfunction closeAllMenus() {\n  document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));\n}\ndocument.addEventListener('click', closeAllMenus);\nfunction toggleTeamMenu(evt, id) {\n  evt.stopPropagation();\n  const menu = document.getElementById('teamMenu-' + id);\n  if (!menu) return;\n  const isOpen = menu.classList.contains('open');\n  closeAllMenus();\n  if (!isOpen) menu.classList.add('open');\n}\nfunction toggleMoreMenu(evt) {\n  evt.stopPropagation();\n  const menu = document.getElementById('pipelineMoreMenu');\n  if (!menu) return;\n  const isOpen = menu.classList.contains('open');\n  closeAllMenus();\n  if (!isOpen) menu.classList.add('open');\n}\n\n\u002F\u002F \u2500\u2500 State \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nlet selectedTeam = null;\nlet allTeams     = [];\nlet currentJobId   = null;\nlet currentJobType = null;\nlet jobStream      = null;\nlet liveTeamSummaryTimer = null;\nlet activeTab      = 'run';\n\nasync function openAuthorizedJobStream(jobId) {\n  const MAX_RECONNECTS = 2;\n  let source = null;\n  let retryTimer = null;\n  let reconnects = 0;\n  let closed = false;\n  let messageHandler = null;\n  let errorHandler = null;\n  const pendingMessages = [];\n\n  const controller = {\n    close() {\n      closed = true;\n      if (retryTimer) clearTimeout(retryTimer);\n      retryTimer = null;\n      if (source) source.close();\n      source = null;\n    },\n    get onmessage() { return messageHandler; },\n    set onmessage(handler) {\n      messageHandler = typeof handler === 'function' ? handler : null;\n      if (messageHandler) {\n        while (pendingMessages.length) messageHandler(pendingMessages.shift());\n      }\n    },\n    get onerror() { return errorHandler; },\n    set onerror(handler) { errorHandler = typeof handler === 'function' ? handler : null; },\n  };\n\n  async function connect() {\n    const response = await apiFetch(`\u002Fapi\u002Fjobs\u002F${jobId}\u002Fstream-credential`, { method: 'POST' });\n    const body = await response.json().catch(() => ({}));\n    if (!response.ok || !body.streamToken) {\n      throw new Error(body.error || 'Unable to authorize the job log stream.');\n    }\n    if (closed) return;\n\n    const current = new EventSource(\n      `\u002Fapi\u002Fjobs\u002F${jobId}\u002Fstream?stream_token=${encodeURIComponent(body.streamToken)}`\n    );\n    source = current;\n    current.onmessage = event => {\n      if (current !== source || closed) return;\n      if (messageHandler) messageHandler(event);\n      else pendingMessages.push(event);\n    };\n    current.onerror = () => {\n      if (current !== source || closed) return;\n      current.close(); \u002F\u002F prevents native EventSource from replaying the consumed URL\n      source = null;\n      if (reconnects >= MAX_RECONNECTS) {\n        closed = true;\n        if (errorHandler) errorHandler();\n        return;\n      }\n      const delay = 250 * (2 ** reconnects++);\n      retryTimer = setTimeout(() => {\n        retryTimer = null;\n        connect().catch(() => {\n          closed = true;\n          if (errorHandler) errorHandler();\n        });\n      }, delay);\n    };\n  }\n\n  await connect();\n  return controller;\n}\n\n\u002F\u002F Persisted options across team switches\nconst opts = {\n  gameLocation:     '',\n  gameDate:         new Date().toISOString().slice(0, 10), \u002F\u002F defaults to today\n  gameTime:         '',\n  humanObs:         '',\n  gameScope:        'all',\n  customPrompt:     '',\n  matchupOurTeamId: null,\n  matchupOppTeamId: null,\n  matchupProbable:  '',\n};\n\n\u002F\u002F \u2500\u2500 Load teams \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadTeams() {\n  const res   = await apiFetch('\u002Fapi\u002Fteams');\n  allTeams    = await res.json();\n  const list  = document.getElementById('teamList');\n  const opponentTeams = allTeams.filter(t => !t.is_our_team);\n\n  if (!opponentTeams.length) {\n    list.innerHTML = `<div class=\"empty\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\"\u002F><path d=\"M6.5 4.8c2.4 3.4 2.4 11 0 14.4M17.5 4.8c-2.4 3.4-2.4 11 0 14.4\"\u002F><\u002Fsvg><\u002Fdiv><p>No teams yet.<br>Run Analyze Opponent's Games first.<\u002Fp><\u002Fdiv>`;\n    renderMyTeams();\n    return;\n  }\n\n  list.innerHTML = opponentTeams.map(t => `\n    <div class=\"team-item ${String(selectedTeam?.id) === String(t.id) ? 'active' : ''}\"\n         data-team-id=\"${escHtml(t.id)}\"\n         onclick=\"selectTeamById(this.dataset.teamId)\">\n      <div class=\"team-row-main\">\n        <div class=\"team-name\">${escHtml(t.team_name)}<\u002Fdiv>\n        <div class=\"team-actions\">\n          <button class=\"team-kebab-btn\" title=\"More actions\" onclick=\"event.stopPropagation(); toggleTeamMenu(event, '${escHtml(t.id)}')\">\u22ef<\u002Fbutton>\n          <div class=\"dropdown-menu\" id=\"teamMenu-${escHtml(t.id)}\">\n            <button class=\"dropdown-item\" onclick=\"event.stopPropagation(); closeAllMenus(); showEditTeam('${escHtml(t.id)}')\">Edit<\u002Fbutton>\n            <button class=\"dropdown-item danger\" onclick=\"event.stopPropagation(); closeAllMenus(); removeOpponent('${escHtml(t.id)}')\">Remove<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"team-meta\">\n        <span class=\"badge badge-games\">${escHtml(t.game_count)} games<\u002Fspan>\n        ${t.hasGC ? `<span class=\"badge badge-gc\">Games \u2713<\u002Fspan>` : ''}\n        ${t.hasPG ? `<span class=\"badge badge-pg\">Players \u2713<\u002Fspan>` : ''}\n        ${t.stats?.wins != null ? `<span class=\"badge badge-wins\">${escHtml(t.stats.wins)}W-${escHtml(t.stats.losses)}L<\u002Fspan>` : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n  renderMyTeams();\n  if (selectedTeam) {\n    const refreshed = allTeams.find(t => String(t.id) === String(selectedTeam.id));\n    if (refreshed) selectedTeam = refreshed;\n  }\n}\n\nfunction selectTeamById(teamId) {\n  selectTeam(teamId);\n}\n\nfunction selectTeam(teamId) {\n  selectedTeam = allTeams.find(t => String(t.id) === String(teamId));\n  if (!selectedTeam) {\n    console.error('Team not found for id:', teamId);\n    return;\n  }\n  \u002F\u002F 'run' (Single Opponent Scout) only exists for opponents; 'self'\u002F'matchup'\n  \u002F\u002F only exist for My Team. Switch to a tab that actually exists for the\n  \u002F\u002F newly selected team's type, defaulting to Games\u002FReports otherwise.\n  const ourTeamTabs = ['self', 'matchup', 'games', 'reports'];\n  const opponentTabs = ['run', 'games', 'reports', 'opp-roster', 'opp-notes'];\n  const validTabs = selectedTeam.is_our_team ? ourTeamTabs : opponentTabs;\n  if (!validTabs.includes(activeTab)) {\n    activeTab = selectedTeam.is_our_team ? 'self' : 'run';\n  }\n  renderMain();\n  document.querySelectorAll('.team-item').forEach(el => {\n    el.classList.toggle('active', String(el.dataset.teamId) === String(selectedTeam.id));\n  });\n}\n\n\u002F\u002F \u2500\u2500 My Team \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Backed by the real `teams` table now (teams.is_our_team = true), not\n\u002F\u002F localStorage. allTeams is populated by loadTeams() from GET \u002Fapi\u002Fteams.\nfunction getMyTeams() {\n  return (allTeams || []).filter(t => t.is_our_team);\n}\n\nfunction showMyTeam() {\n  document.getElementById('myName').value  = '';\n  document.getElementById('myGcUrl').value = '';\n  document.getElementById('myPgUrl').value = '';\n  document.getElementById('myYear').value  = '';\n  document.querySelectorAll('.mySeason').forEach(c => c.checked = false);\n  const err = document.getElementById('myTeamError');\n  if (err) err.style.display = 'none';\n  document.getElementById('myTeamModal').style.display = 'flex';\n}\nfunction hideMyTeam() {\n  document.getElementById('myTeamModal').style.display = 'none';\n}\nasync function submitMyTeam() {\n  const name    = document.getElementById('myName').value.trim();\n  const gcUrl   = document.getElementById('myGcUrl').value.trim();\n  const pgUrl   = document.getElementById('myPgUrl').value.trim();\n  const year    = document.getElementById('myYear').value.trim();\n  const seasons = [...document.querySelectorAll('.mySeason:checked')].map(c => c.value);\n  const err     = document.getElementById('myTeamError');\n  if (!name) { err.textContent = 'Team name is required.'; err.style.display = 'block'; return; }\n  if (!year) { err.textContent = 'Team year is required.'; err.style.display = 'block'; return; }\n  if (!seasons.length) { err.textContent = 'Choose at least one season.'; err.style.display = 'block'; return; }\n\n  const res = await apiFetch('\u002Fapi\u002Fteams\u002Fadd', {\n    method: 'POST',\n    body: JSON.stringify({\n      teamName: name, gcTeamUrl: gcUrl, pgTeamUrl: pgUrl,\n      isOurTeam: true, seasonYear: year, seasonType: seasons.join(','),\n    }),\n  });\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) { err.textContent = data.error || 'Failed to save team.'; err.style.display = 'block'; return; }\n\n  hideMyTeam();\n  await loadTeams();\n}\nasync function removeMyTeam(teamId) {\n  const team = (allTeams || []).find(t => String(t.id) === String(teamId));\n  if (!team) { alert('Team not found. Refresh and try again.'); return; }\n\n  const ok = confirm(`Remove \"${team.team_name}\" from My Team?\n\nThis just hides it from the list \u2014 all games and stats stay in the database, and you can bring it back later.`);\n  if (!ok) return;\n\n  const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${teamId}\u002Farchive`, {\n    method: 'PATCH',\n    body: JSON.stringify({ archived: true }),\n  });\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) { alert(data.error || 'Failed to remove team.'); return; }\n  await loadTeams();\n}\nfunction showEditMyTeam(teamId) {\n  const t = (allTeams || []).find(x => String(x.id) === String(teamId));\n  if (!t) { alert('Team not found. Refresh and try again.'); return; }\n  document.getElementById('editMyTeamIdx').value = t.id;\n  document.getElementById('editMyName').value  = t.team_name    || '';\n  document.getElementById('editMyGcUrl').value = t.gc_team_url  || '';\n  document.getElementById('editMyPgUrl').value = t.pg_team_url  || '';\n  document.getElementById('editMyYear').value  = t.season_year  || '';\n  const seasons = (t.season_type || '').split(',').map(s => s.trim()).filter(Boolean);\n  document.querySelectorAll('.editMySeason').forEach(c => { c.checked = seasons.includes(c.value); });\n  document.getElementById('editMyTeamError').style.display = 'none';\n  document.getElementById('editMyTeamModal').style.display = 'flex';\n  document.getElementById('editMyName').focus();\n}\nfunction hideEditMyTeam() {\n  document.getElementById('editMyTeamModal').style.display = 'none';\n  document.getElementById('editMyTeamError').style.display = 'none';\n}\nasync function submitEditMyTeam() {\n  const teamId  = document.getElementById('editMyTeamIdx').value;\n  const name    = document.getElementById('editMyName').value.trim();\n  const gcUrl   = document.getElementById('editMyGcUrl').value.trim();\n  const pgUrl   = document.getElementById('editMyPgUrl').value.trim();\n  const year    = document.getElementById('editMyYear').value.trim();\n  const seasons = [...document.querySelectorAll('.editMySeason:checked')].map(c => c.value);\n  const err     = document.getElementById('editMyTeamError');\n  if (!name) { err.textContent = 'Team name is required.'; err.style.display = 'block'; return; }\n  if (!year) { err.textContent = 'Team year is required.'; err.style.display = 'block'; return; }\n  if (!seasons.length) { err.textContent = 'Choose at least one season.'; err.style.display = 'block'; return; }\n\n  const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${teamId}`, {\n    method: 'PUT',\n    body: JSON.stringify({\n      teamName: name, gcTeamUrl: gcUrl, pgTeamUrl: pgUrl,\n      seasonYear: year, seasonType: seasons.join(','),\n    }),\n  });\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) { err.textContent = data.error || 'Failed to update team.'; err.style.display = 'block'; return; }\n\n  hideEditMyTeam();\n  await loadTeams();\n}\nfunction renderMyTeams() {\n  const list = document.getElementById('myTeamList');\n  if (!list) return;\n  const myTeams = getMyTeams();\n  if (!myTeams.length) {\n    list.innerHTML = `<div class=\"empty\" style=\"padding:18px 14px\"><p style=\"font-size:12px;color:var(--muted)\">No team set yet.<br>Click <b style=\"color:var(--accent)\">+ Add<\u002Fb> to enter your team.<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n  list.innerHTML = myTeams.map((t) => `\n    <div class=\"team-item ${String(selectedTeam?.id) === String(t.id) ? 'active' : ''}\"\n         data-team-id=\"${escHtml(t.id)}\"\n         onclick=\"selectTeamById(this.dataset.teamId)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:8px\">\n        <div class=\"team-name\">${escHtml(t.team_name)}<\u002Fdiv>\n        <div class=\"team-actions\">\n          <button class=\"team-kebab-btn\" title=\"More actions\" onclick=\"event.stopPropagation(); toggleTeamMenu(event, '${escHtml(t.id)}')\">\u22ef<\u002Fbutton>\n          <div class=\"dropdown-menu\" id=\"teamMenu-${escHtml(t.id)}\">\n            <button class=\"dropdown-item\" onclick=\"event.stopPropagation(); closeAllMenus(); showEditMyTeam('${escHtml(t.id)}')\">Edit<\u002Fbutton>\n            <button class=\"dropdown-item danger\" onclick=\"event.stopPropagation(); closeAllMenus(); removeMyTeam('${escHtml(t.id)}')\">Remove<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"team-meta\">\n        ${t.season_year ? `<span class=\"badge badge-year\">${escHtml(t.season_year)}<\u002Fspan>` : ''}\n        ${(t.season_type || '').split(',').map(s => s.trim()).filter(Boolean).map(s => `<span class=\"badge badge-season\">${escHtml(s)}<\u002Fspan>`).join('')}\n        ${t.gc_team_url ? `<span class=\"badge badge-gc\">Games \u2713<\u002Fspan>` : ''}\n        ${t.pg_team_url ? `<span class=\"badge badge-pg\">Players \u2713<\u002Fspan>` : ''}\n        <span class=\"badge badge-games\">${escHtml(t.game_count ?? 0)} games<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n}\n\n\u002F\u002F \u2500\u2500 Render main panel \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction renderMain() {\n  const t = selectedTeam;\n  if (!t) return;\n\n  const s        = t.stats || {};\n  const lastGame = t.last_game ? new Date(t.last_game + 'T12:00:00').toLocaleDateString() : '\u2014';\n\n  document.getElementById('mainPanel').innerHTML = `\n    <div class=\"team-panel\">\n      <div class=\"team-title\">${escHtml(t.team_name)}<\u002Fdiv>\n      <div class=\"team-summary\">\n        <span>${s.games ?? s.game_count ?? t.game_count ?? 0} games<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span>${s.wins ?? '\u2014'}-${s.losses ?? '\u2014'}${s.ties ? '-' + s.ties : ''}<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span>${s.batters ?? '\u2014'} batters<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span>Last ${lastGame}<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span class=\"${t.hasGC ? 'ok' : 'warn'}\">${t.hasGC ? 'Opponent Game Analysis Ready' : 'Opponent Game Analysis Missing'}<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span class=\"${t.hasPG ? 'ok' : 'warn'}\">${t.hasPG ? 'Opponent Player Analysis Ready' : 'Opponent Player Analysis Missing'}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"team-urls\">\n        ${t.gc_team_url ? `<a class=\"url-link\" href=\"${t.gc_team_url}\" target=\"_blank\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M9 15a5 5 0 0 0 7 0l3-3a5 5 0 1 0-7-7l-1 1\"\u002F><path d=\"M15 9a5 5 0 0 0-7 0l-3 3a5 5 0 1 0 7 7l1-1\"\u002F><\u002Fsvg> Games<\u002Fa>` : ''}\n        ${t.pg_team_url ? `<a class=\"url-link\" href=\"${t.pg_team_url}\" target=\"_blank\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M9 15a5 5 0 0 0 7 0l3-3a5 5 0 1 0-7-7l-1 1\"\u002F><path d=\"M15 9a5 5 0 0 0-7 0l-3 3a5 5 0 1 0 7 7l1-1\"\u002F><\u002Fsvg> Players<\u002Fa>` : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    ${renderPipelineActions()}\n\n    ${!t.is_our_team ? `<div id=\"reportContextPreview\" style=\"margin:0 0 12px\"><\u002Fdiv>` : ''}\n\n    <div class=\"main-tabs\" id=\"mainTabs\">\n      ${t.is_our_team ? `\n      <div class=\"main-tab ${activeTab==='self'?'active':''}\"     onclick=\"switchTab('self')\">Self-Scout<\u002Fdiv>\n      <div class=\"main-tab ${activeTab==='matchup'?'active':''}\"  onclick=\"switchTab('matchup')\">Matchup<\u002Fdiv>\n      <div class=\"main-tab ${activeTab==='roster'?'active':''}\"   onclick=\"switchTab('roster')\">Roster<\u002Fdiv>\n      ` : `\n      <div class=\"main-tab ${activeTab==='run'?'active':''}\"      onclick=\"switchTab('run')\">Single Opponent Scout<\u002Fdiv>\n      <div class=\"main-tab ${activeTab==='opp-roster'?'active':''}\" onclick=\"switchTab('opp-roster')\">Roster<\u002Fdiv>\n      <div class=\"main-tab ${activeTab==='opp-notes'?'active':''}\"  onclick=\"switchTab('opp-notes')\">Scouting Notes<\u002Fdiv>\n      `}\n      <div class=\"main-tab ${activeTab==='games'?'active':''}\"    onclick=\"switchTab('games')\">Games<\u002Fdiv>\n      <div class=\"main-tab ${activeTab==='reports'?'active':''}\"  onclick=\"switchTab('reports')\">Reports<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"main-content\">\n      ${t.is_our_team ? `\n      <!-- SELF-SCOUT TAB -->\n      <div class=\"main-pane ${activeTab==='self'?'active':''}\" id=\"pane-self\">\n        ${renderSelfPane()}\n      <\u002Fdiv>\n\n      <!-- MATCHUP TAB -->\n      <div class=\"main-pane ${activeTab==='matchup'?'active':''}\" id=\"pane-matchup\">\n        ${renderMatchupPane()}\n      <\u002Fdiv>\n\n      <!-- ROSTER TAB -->\n      <div class=\"main-pane ${activeTab==='roster'?'active':''}\" id=\"pane-roster\">\n        <p class=\"log-empty\" style=\"color:var(--muted)\">Loading roster...<\u002Fp>\n      <\u002Fdiv>\n      ` : `\n      <!-- RUN TAB -->\n      <div class=\"main-pane ${activeTab==='run'?'active':''}\" id=\"pane-run\">\n        ${renderRunPane()}\n      <\u002Fdiv>\n\n      <!-- OPPONENT ROSTER TAB -->\n      <div class=\"main-pane ${activeTab==='opp-roster'?'active':''}\" id=\"pane-opp-roster\">\n        <p class=\"log-empty\" style=\"color:var(--muted)\">Loading roster...<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- OPPONENT SCOUTING NOTES TAB -->\n      <div class=\"main-pane ${activeTab==='opp-notes'?'active':''}\" id=\"pane-opp-notes\">\n        <p class=\"log-empty\" style=\"color:var(--muted)\">Loading notes...<\u002Fp>\n      <\u002Fdiv>\n      `}\n\n      <!-- GAMES TAB -->\n      <div class=\"main-pane ${activeTab==='games'?'active':''}\" id=\"pane-games\">\n        <p class=\"log-empty\" style=\"color:var(--muted)\">Loading games...<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- REPORTS TAB -->\n      <div class=\"main-pane ${activeTab==='reports'?'active':''}\" id=\"pane-reports\">\n        <p class=\"log-empty\" style=\"color:var(--muted)\">Loading reports...<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    ${renderJobLogBar()}\n  `;\n\n  if (activeTab === 'games')   loadGames();\n  if (activeTab === 'reports') loadReports();\n  if (activeTab === 'roster')  loadRoster();\n  if (activeTab === 'opp-roster') loadOpponentRoster();\n  if (activeTab === 'opp-notes')  loadOpponentNotes();\n  if (!t.is_our_team) loadReportContextPreview();\n}\n\n\u002F\u002F \u2500\u2500 Pane renderers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nfunction renderPipelineActions() {\n  const t = selectedTeam;\n  return `\n    <div class=\"run-section\">\n      <div class=\"actions actions-hierarchy\">\n        <button class=\"btn btn-primary\" onclick=\"runJob('full-pipeline')\" ${t.game_count<1&&!t.gc_team_url?'disabled':''}><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"currentColor\"><path d=\"M7 4v16l13-8z\"\u002F><\u002Fsvg> Full Pipeline<\u002Fbutton>\n        <button class=\"btn btn-secondary\" onclick=\"runJob('report')\" ${t.game_count<1?'disabled title=\"No games yet\"':''}><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"\u002F><path d=\"M14 3v5h5\"\u002F><path d=\"M9 13h6M9 17h4\"\u002F><\u002Fsvg> Generate Report<\u002Fbutton>\n        <span class=\"actions-divider\"><\u002Fspan>\n        <button class=\"btn btn-utility\" onclick=\"runJob('gc-scraper')\">Analyze Opponent's Games<\u002Fbutton>\n        <button class=\"btn btn-utility\" onclick=\"runJob('pg-scraper')\" ${!t.pg_team_url?'disabled title=\"No Opponent\\'s Players URL\"':''}>Analyze Opponent's Players<\u002Fbutton>\n        <div class=\"dropdown-wrap\">\n          <button class=\"btn btn-utility\" onclick=\"toggleMoreMenu(event)\">More \u25be<\u002Fbutton>\n          <div class=\"dropdown-menu\" id=\"pipelineMoreMenu\">\n            <button class=\"dropdown-item\" onclick=\"closeAllMenus(); runJob('reingest')\">Reingest<\u002Fbutton>\n            <button class=\"dropdown-item\" onclick=\"closeAllMenus(); ${t.is_our_team ? `showEditMyTeam('${escHtml(t.id)}')` : `showEditTeam('${escHtml(t.id)}')`}\">${t.is_our_team ? 'Edit Team' : 'Edit Opponent'}<\u002Fbutton>\n            <button class=\"dropdown-item danger\" onclick=\"closeAllMenus(); ${t.is_our_team ? `removeMyTeam('${escHtml(t.id)}')` : `removeOpponent('${escHtml(t.id)}')`}\">Remove Team<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <hr class=\"divider\">\n  `;\n}\n\n\u002F\u002F Single shared Job Log \u2014 used by every job type (GC\u002FPG\u002FReingest\u002FGenerate\n\u002F\u002F Report\u002FFull Pipeline\u002FSelf-Scout\u002FMatchup). Rendered once, at the bottom of\n\u002F\u002F the panel, regardless of which tab is active, so there is never more than\n\u002F\u002F one Job Log visible at a time.\nfunction renderJobLogBar() {\n  return `\n    <hr class=\"divider\">\n    <div class=\"job-log-bar\">\n      <span id=\"jobStatusPill\" class=\"status-pill status-idle\">Idle<\u002Fspan>\n      <span id=\"jobLabel\" style=\"color:var(--muted)\">No job running<\u002Fspan>\n      <button class=\"refresh-btn stop-job-btn\" onclick=\"stopCurrentJob()\">Stop Job<\u002Fbutton>\n      <button class=\"refresh-btn\" id=\"jobLogToggleBtn\" onclick=\"toggleJobLogDrawer()\" style=\"margin-left:auto\">View Logs<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"job-log-drawer\" id=\"jobLogDrawer\">\n      <div class=\"log-container\" id=\"logContainer\">\n        <p class=\"log-empty\">Run a pipeline step above to see logs here.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\nfunction toggleJobLogDrawer() {\n  const drawer = document.getElementById('jobLogDrawer');\n  const btn = document.getElementById('jobLogToggleBtn');\n  if (!drawer) return;\n  const open = drawer.classList.toggle('open');\n  if (btn) btn.textContent = open ? 'Hide Logs' : 'View Logs';\n}\n\nfunction renderRunPane() {\n  return `\n    <div class=\"section-label\">Report Options<\u002Fdiv>\n\n    <div class=\"options-grid\">\n      <div class=\"opt-group\">\n        <label>Game Location<\u002Flabel>\n        <input class=\"opt-input\" id=\"opt-location\" type=\"text\" placeholder=\"e.g. Nashville, TN\"\n          value=\"${escHtml(opts.gameLocation)}\" oninput=\"opts.gameLocation=this.value\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Game Date<\u002Flabel>\n        <input class=\"opt-input\" id=\"opt-date\" type=\"date\"\n          value=\"${opts.gameDate}\" oninput=\"opts.gameDate=this.value\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Game Time<\u002Flabel>\n        <input class=\"opt-input\" id=\"opt-time\" type=\"time\"\n          value=\"${opts.gameTime}\" oninput=\"opts.gameTime=this.value\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Game Scope<\u002Flabel>\n        <select class=\"opt-select\" id=\"opt-scope\" onchange=\"opts.gameScope=this.value\">\n          <option value=\"all\" ${opts.gameScope==='all'?'selected':''}>Entire Season<\u002Foption>\n          <option value=\"last10\" ${opts.gameScope==='last10'?'selected':''}>Last 10 Games<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"obs-group\">\n      <label>Human Observations <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">(live scouting notes \u2014 tell Jobu what you know and what you have seen)<\u002Fspan><\u002Flabel>\n      <textarea class=\"obs-textarea\" id=\"opt-obs\" placeholder=\"e.g. Their #12 has a big leg kick and struggles with inside fastballs. Catcher has a weak arm, ran on him twice. Their CF was shading right on all their lefties...\"\n        oninput=\"opts.humanObs=this.value\">${escHtml(opts.humanObs)}<\u002Ftextarea>\n    <\u002Fdiv>\n  `;\n}\n\nfunction renderSelfPane() {\n  return `\n    <div class=\"mode-notice\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"7\"\u002F><path d=\"m20 20-3.2-3.2\"\u002F><\u002Fsvg> Self-Scouting Mode \u2014 analyzes YOUR team's data for internal coaching review<\u002Fdiv>\n\n    <div class=\"section-label\">Self-Scout Options<\u002Fdiv>\n\n    <div class=\"options-grid\">\n      <div class=\"opt-group\">\n        <label>Game Location<\u002Flabel>\n        <input class=\"opt-input\" type=\"text\" placeholder=\"e.g. Nashville, TN\"\n          value=\"${escHtml(opts.gameLocation)}\" oninput=\"opts.gameLocation=this.value\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Game Date<\u002Flabel>\n        <input class=\"opt-input\" type=\"date\" value=\"${opts.gameDate}\" oninput=\"opts.gameDate=this.value\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Game Scope<\u002Flabel>\n        <select class=\"opt-select\" onchange=\"opts.gameScope=this.value\">\n          <option value=\"all\" ${opts.gameScope==='all'?'selected':''}>Entire Season<\u002Foption>\n          <option value=\"last10\" ${opts.gameScope==='last10'?'selected':''}>Last 10 Games<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"obs-group\">\n      <label>Coach Notes <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">(things you want Jobu to focus on)<\u002Fspan><\u002Flabel>\n      <textarea class=\"obs-textarea\" placeholder=\"e.g. We've been struggling with two-strike approaches. Our pitchers are throwing too many first-pitch balls. Focus on our RISP situations...\"\n        oninput=\"opts.humanObs=this.value\">${escHtml(opts.humanObs)}<\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div class=\"obs-group\">\n      <label>Custom Self-Scout Prompt <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">(optional \u2014 overrides default self-scouting instructions)<\u002Fspan><\u002Flabel>\n      <textarea class=\"obs-textarea\" style=\"min-height:90px\" placeholder=\"e.g. Focus exclusively on our lineup's performance against left-handed pitching. Identify which hitters handle LHP well and which ones struggle. Give me a recommended batting order adjustment...\"\n        oninput=\"opts.customPrompt=this.value\">${escHtml(opts.customPrompt)}<\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div class=\"actions\">\n      <button class=\"btn btn-scout\" onclick=\"runSelfScout()\" ${selectedTeam?.game_count<1?'disabled title=\"No games yet\"':''}><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"7\"\u002F><path d=\"m20 20-3.2-3.2\"\u002F><\u002Fsvg> Generate Self-Scout Report<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n}\n\nfunction renderMatchupPane() {\n  \u002F\u002F Default \"Our Team\" to whichever My Team is currently selected.\n  if (!opts.matchupOurTeamId && selectedTeam?.is_our_team) {\n    opts.matchupOurTeamId = selectedTeam.id;\n  }\n\n  const teamOptions = allTeams.map(t =>\n    `<option value=\"${t.id}\" ${String(t.id)===String(opts.matchupOurTeamId)?'selected':''}>${escHtml(t.team_name)}<\u002Foption>`\n  ).join('');\n  const oppOptions = allTeams.filter(t => !t.is_our_team).map(t =>\n    `<option value=\"${t.id}\" ${String(t.id)===String(opts.matchupOppTeamId)?'selected':''}>${escHtml(t.team_name)}<\u002Foption>`\n  ).join('');\n\n  return `\n    <div class=\"mode-notice matchup-notice\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><polyline points=\"14.5 17.5 3 6 3 3 6 3 17.5 14.5\"\u002F><line x1=\"13\" y1=\"19\" x2=\"19.5\" y2=\"12.5\"\u002F><line x1=\"16\" y1=\"16\" x2=\"20\" y2=\"20\"\u002F><polyline points=\"14.5 6.5 18 3 21 3 21 6 17.5 9.5\"\u002F><line x1=\"5.5\" y1=\"13.5\" x2=\"11\" y2=\"19\"\u002F><line x1=\"8\" y1=\"16\" x2=\"4\" y2=\"20\"\u002F><\u002Fsvg> Head-to-Head Matchup \u2014 identifies pitcher\u002Fhitter matchups and game plan vs a specific opponent<\u002Fdiv>\n\n    <div class=\"section-label\">Teams<\u002Fdiv>\n    <div class=\"matchup-grid\">\n      <div class=\"matchup-team-box\">\n        <label>Our Team<\u002Flabel>\n        <div class=\"team-select-wrap\">\n          <select id=\"matchup-our\" onchange=\"opts.matchupOurTeamId=this.value\">\n            <option value=\"\">\u2014 Select our team \u2014<\u002Foption>\n            ${teamOptions}\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"matchup-team-box\">\n        <label>Opponent<\u002Flabel>\n        <div class=\"team-select-wrap\">\n          <select id=\"matchup-opp\" onchange=\"opts.matchupOppTeamId=this.value\">\n            <option value=\"\">\u2014 Select opponent \u2014<\u002Foption>\n            ${oppOptions}\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"section-label\">Game Context<\u002Fdiv>\n    <div class=\"options-grid\">\n      <div class=\"opt-group\">\n        <label>Game Location<\u002Flabel>\n        <input class=\"opt-input\" type=\"text\" placeholder=\"e.g. Nashville, TN\"\n          value=\"${escHtml(opts.gameLocation)}\" oninput=\"opts.gameLocation=this.value\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Game Date<\u002Flabel>\n        <input class=\"opt-input\" type=\"date\" value=\"${opts.gameDate}\" oninput=\"opts.gameDate=this.value\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"obs-group\">\n      <label>Probable Pitchers (Opponent) <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">(optional \u2014 tell Jobu who you expect on the mound)<\u002Fspan><\u002Flabel>\n      <input class=\"opt-input\" style=\"width:100%\" type=\"text\" placeholder=\"e.g. #12 Johnson (ace), #7 Williams (lefty reliever likely in later innings)\"\n        value=\"${escHtml(opts.matchupProbable)}\" oninput=\"opts.matchupProbable=this.value\">\n    <\u002Fdiv>\n\n    <div class=\"obs-group\">\n      <label>Human Observations <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">(live notes from watching them)<\u002Fspan><\u002Flabel>\n      <textarea class=\"obs-textarea\" placeholder=\"e.g. Their ace is sitting 77-80 with a sharp 12-6 curve. Saw them live Tuesday \u2014 they struggle to cover the outer third with RISP...\"\n        oninput=\"opts.humanObs=this.value\">${escHtml(opts.humanObs)}<\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div class=\"obs-group\">\n      <label>Custom Matchup Focus <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">(optional \u2014 direct what the AI focuses on)<\u002Fspan><\u002Flabel>\n      <textarea class=\"obs-textarea\" style=\"min-height:72px\" placeholder=\"e.g. Focus on identifying which of our hitters have the best historical matchup profile against the type of pitching this team throws. Recommend specific lineup adjustments...\"\n        oninput=\"opts.customPrompt=this.value\">${escHtml(opts.customPrompt)}<\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div class=\"actions\">\n      <button class=\"btn btn-matchup\" onclick=\"runMatchup()\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><polyline points=\"14.5 17.5 3 6 3 3 6 3 17.5 14.5\"\u002F><line x1=\"13\" y1=\"19\" x2=\"19.5\" y2=\"12.5\"\u002F><line x1=\"16\" y1=\"16\" x2=\"20\" y2=\"20\"\u002F><polyline points=\"14.5 6.5 18 3 21 3 21 6 17.5 9.5\"\u002F><line x1=\"5.5\" y1=\"13.5\" x2=\"11\" y2=\"19\"\u002F><line x1=\"8\" y1=\"16\" x2=\"4\" y2=\"20\"\u002F><\u002Fsvg> Generate Matchup Report<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n}\n\n\u002F\u002F \u2500\u2500 Tab switching \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction switchTab(tab) {\n  activeTab = tab;\n  document.querySelectorAll('.main-tab').forEach(el => {\n    const name = el.textContent.toLowerCase().replace(\u002F[^a-z]\u002Fg,'');\n    el.classList.toggle('active',\n      name === tab || (tab==='self' && name==='selfscout') || (tab==='matchup' && name==='matchup') || (tab==='run' && name==='singleopponentscout')\n      || (tab==='opp-roster' && name==='roster') || (tab==='opp-notes' && name==='scoutingnotes')\n    );\n  });\n  document.querySelectorAll('.main-pane').forEach(el => {\n    el.classList.toggle('active', el.id === `pane-${tab}`);\n  });\n  if (tab === 'games')      loadGames();\n  if (tab === 'reports')    loadReports();\n  if (tab === 'roster')     loadRoster();\n  if (tab === 'opp-roster') loadOpponentRoster();\n  if (tab === 'opp-notes')  loadOpponentNotes();\n}\n\n\u002F\u002F \u2500\u2500 Job runner \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nfunction appendJobLogLine(logId, fallbackEl, line) {\n  const liveEl = document.getElementById(logId) || fallbackEl;\n  if (liveEl) appendLogLine(liveEl, line);\n}\n\nfunction updateSelectedTeamSummaryCounters(summary) {\n  if (!summary || typeof summary !== 'object') return;\n\n  const setText = (id, value) => {\n    const el = document.getElementById(id);\n    if (el) el.textContent = value ?? '\u2014';\n  };\n\n  setText('statGames', summary.games ?? summary.game_count ?? 0);\n  setText('statWins', summary.wins ?? '\u2014');\n  setText('statLosses', summary.losses ?? '\u2014');\n  setText('statTies', summary.ties ?? '\u2014');\n  setText('statBatters', summary.batters ?? '\u2014');\n\n  const lastGame = summary.last_game || summary.lastGame || null;\n  setText('statLastGame', lastGame ? new Date(`${lastGame}T12:00:00`).toLocaleDateString() : '\u2014');\n\n  if (selectedTeam) {\n    selectedTeam.game_count = summary.games ?? summary.game_count ?? selectedTeam.game_count;\n    selectedTeam.last_game = lastGame || selectedTeam.last_game;\n    selectedTeam.stats = {\n      ...(selectedTeam.stats || {}),\n      games: summary.games ?? summary.game_count ?? selectedTeam.stats?.games,\n      wins: summary.wins ?? selectedTeam.stats?.wins,\n      losses: summary.losses ?? selectedTeam.stats?.losses,\n      ties: summary.ties ?? selectedTeam.stats?.ties,\n      batters: summary.batters ?? selectedTeam.stats?.batters,\n      plays: summary.plays ?? selectedTeam.stats?.plays,\n    };\n  }\n}\n\nasync function refreshSelectedTeamSummary() {\n  if (!selectedTeam || !selectedTeam.id) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${encodeURIComponent(selectedTeam.id)}\u002Fsummary`);\n    const data = await res.json().catch(() => null);\n    if (!res.ok || !data || data.error) return;\n    updateSelectedTeamSummaryCounters(data);\n  } catch (err) {\n    \u002F\u002F Keep job logs alive even if the live counter refresh has a temporary issue.\n    console.warn('[dashboard] live summary refresh failed:', err.message);\n  }\n}\n\nfunction startLiveTeamSummaryRefresh() {\n  stopLiveTeamSummaryRefresh();\n  refreshSelectedTeamSummary();\n  liveTeamSummaryTimer = setInterval(refreshSelectedTeamSummary, 5000);\n}\n\nfunction stopLiveTeamSummaryRefresh() {\n  if (liveTeamSummaryTimer) {\n    clearInterval(liveTeamSummaryTimer);\n    liveTeamSummaryTimer = null;\n  }\n}\n\nasync function runJob(type) {\n  if (!selectedTeam) return;\n\n  const logId = 'logContainer';\n  const pillId = 'jobStatusPill';\n  const labelId = 'jobLabel';\n\n  if (jobStream) { jobStream.close(); jobStream = null; }\n  currentJobType = type;\n\n  const logEl = document.getElementById(logId);\n  if (!logEl) return;\n  logEl.innerHTML = '';\n  setStatus(pillId, labelId, 'running', type);\n  setStopButtonsVisible(true);\n  startLiveTeamSummaryRefresh();\n\n  const body = { teamId: selectedTeam.id };\n  if (opts.gameLocation) body.gameLocation     = opts.gameLocation;\n  if (opts.gameDate)     body.gameDate         = opts.gameDate;\n  if (opts.gameTime)     body.gameTime         = opts.gameTime;\n  if (opts.humanObs)     body.humanObservations= opts.humanObs;\n  if (opts.gameScope)    body.gameScope        = opts.gameScope;\n  if (opts.customPrompt) body.customPrompt     = opts.customPrompt;\n\n  const endpoint = `\u002Fapi\u002Frun\u002F${type}`;\n  const res  = await apiFetch(endpoint, {\n    method: 'POST',\n    body: JSON.stringify(body),\n  });\n  const { jobId } = await res.json();\n  currentJobId = jobId;\n\n  jobStream = await openAuthorizedJobStream(jobId);\n  jobStream.onmessage = e => {\n    const data = JSON.parse(e.data);\n    if (data.done) {\n      setStatus(pillId, labelId, data.status, type);\n      setStopButtonsVisible(false);\n      stopLiveTeamSummaryRefresh();\n      refreshSelectedTeamSummary();\n      currentJobId = null;\n      currentJobType = null;\n      jobStream.close();\n      if (data.status === 'done' && (type === 'report' || type === 'full-pipeline' || type === 'self-scout' || type === 'matchup')) {\n        if (activeTab === 'reports') setTimeout(loadReports, 1500);\n      }\n      return;\n    }\n    appendJobLogLine(logId, logEl, data.line);\n  };\n  jobStream.onerror = () => { appendJobLogLine(logId, logEl, '\u2717 Job log stream disconnected. Check Cloud Platform logs if the job is still running.'); setStatus(pillId, labelId, 'failed', type); setStopButtonsVisible(false); stopLiveTeamSummaryRefresh(); refreshSelectedTeamSummary(); if (jobStream) jobStream.close(); };\n}\n\nasync function runSelfScout() {\n  if (!selectedTeam) return;\n  if (jobStream) { jobStream.close(); jobStream = null; }\n  currentJobType = 'self-scout';\n\n  const logEl  = document.getElementById('logContainer');\n  if (!logEl) return;\n  logEl.innerHTML = '';\n  setStatus('jobStatusPill', 'jobLabel', 'running', 'self-scout');\n  setStopButtonsVisible(true);\n\n  const body = { teamId: selectedTeam.id };\n  if (opts.gameLocation) body.gameLocation      = opts.gameLocation;\n  if (opts.gameDate)     body.gameDate          = opts.gameDate;\n  if (opts.humanObs)     body.humanObservations = opts.humanObs;\n  if (opts.gameScope)    body.gameScope         = opts.gameScope;\n  if (opts.customPrompt) body.customPrompt      = opts.customPrompt;\n\n  const res = await apiFetch('\u002Fapi\u002Frun\u002Fself-scout', {\n    method: 'POST',\n    body: JSON.stringify(body),\n  });\n  const { jobId: selfJobId } = await res.json();\n  currentJobId = selfJobId;\n\n  jobStream = await openAuthorizedJobStream(selfJobId);\n  jobStream.onmessage = e => {\n    const data = JSON.parse(e.data);\n    if (data.done) {\n      setStatus('jobStatusPill', 'jobLabel', data.status, 'self-scout');\n      setStopButtonsVisible(false);\n      currentJobId = null;\n      currentJobType = null;\n      jobStream.close();\n      return;\n    }\n    appendJobLogLine('logContainer', logEl, data.line);\n  };\n  jobStream.onerror = () => { appendJobLogLine('logContainer', logEl, '\u2717 Job log stream disconnected. Check Cloud Platform logs if the job is still running.'); setStatus('jobStatusPill', 'jobLabel', 'failed', 'self-scout'); setStopButtonsVisible(false); if (jobStream) jobStream.close(); };\n}\n\nasync function runMatchup() {\n  const ourId = opts.matchupOurTeamId || document.getElementById('matchup-our')?.value || null;\n  const oppId = opts.matchupOppTeamId || document.getElementById('matchup-opp')?.value || null;\n\n  if (!ourId || !oppId) { alert('Please select both teams for the matchup report.'); return; }\n  if (String(ourId) === String(oppId)) { alert('Our team and opponent must be different teams.'); return; }\n\n  if (jobStream) { jobStream.close(); jobStream = null; }\n  currentJobType = 'matchup';\n\n  const logEl = document.getElementById('logContainer');\n  if (!logEl) return;\n  logEl.innerHTML = '';\n  setStatus('jobStatusPill', 'jobLabel', 'running', 'matchup');\n  setStopButtonsVisible(true);\n\n  \u002F\u002F server.js's \u002Fapi\u002Frun\u002Fmatchup expects `teamId` for the opponent (matching\n  \u002F\u002F every other \u002Fapi\u002Frun\u002F* route) plus an optional `ourTeamId` override.\n  const body = { teamId: oppId, ourTeamId: ourId };\n  if (opts.gameLocation)    body.gameLocation      = opts.gameLocation;\n  if (opts.gameDate)        body.gameDate          = opts.gameDate;\n  if (opts.humanObs)        body.humanObservations = opts.humanObs;\n  if (opts.matchupProbable) body.probablePitchers  = opts.matchupProbable;\n  if (opts.customPrompt)    body.customPrompt      = opts.customPrompt;\n\n  const res = await apiFetch('\u002Fapi\u002Frun\u002Fmatchup', {\n    method: 'POST',\n    body: JSON.stringify(body),\n  });\n  const { jobId: matchupJobId } = await res.json();\n  currentJobId = matchupJobId;\n\n  jobStream = await openAuthorizedJobStream(matchupJobId);\n  jobStream.onmessage = e => {\n    const data = JSON.parse(e.data);\n    if (data.done) {\n      setStatus('jobStatusPill', 'jobLabel', data.status, 'matchup');\n      setStopButtonsVisible(false);\n      currentJobId = null;\n      currentJobType = null;\n      jobStream.close();\n      return;\n    }\n    appendJobLogLine('logContainer', logEl, data.line);\n  };\n  jobStream.onerror = () => { appendJobLogLine('logContainer', logEl, '\u2717 Job log stream disconnected. Check Cloud Platform logs if the job is still running.'); setStatus('jobStatusPill', 'jobLabel', 'failed', 'matchup'); setStopButtonsVisible(false); if (jobStream) jobStream.close(); };\n}\n\nfunction setStopButtonsVisible(visible) {\n  document.querySelectorAll('.stop-job-btn').forEach(btn => {\n    btn.style.display = visible ? 'inline-flex' : 'none';\n    btn.disabled = false;\n    btn.textContent = 'Stop Job';\n  });\n}\n\nfunction getCurrentJobUi() {\n  return { logId: 'logContainer', pillId: 'jobStatusPill', labelId: 'jobLabel', label: currentJobType || 'gc-scraper' };\n}\n\nasync function stopCurrentJob() {\n  if (!currentJobId) { alert('No job is currently running.'); return; }\n  const jobIdToStop = currentJobId;\n  const ui = getCurrentJobUi();\n  const logEl = document.getElementById(ui.logId);\n  document.querySelectorAll('.stop-job-btn').forEach(btn => { btn.disabled = true; btn.textContent = 'Stopping...'; });\n  if (logEl) appendLogLine(logEl, `Stop requested for job ${jobIdToStop}...`);\n\n  try {\n    \u002F\u002F Do not use apiFetch() here. apiFetch() logs the user out on any 401.\n    \u002F\u002F Stop Job should remain an emergency brake even if the UI token expired.\n    const session = getSession();\n    const headers = { 'Content-Type': 'application\u002Fjson' };\n    if (session?.accessToken) headers.Authorization = `Bearer ${session.accessToken}`;\n\n    const res = await fetch(`\u002Fapi\u002Fjobs\u002F${jobIdToStop}\u002Fstop`, { method: 'POST', headers });\n    const data = await res.json().catch(() => ({}));\n    if (!res.ok) throw new Error(data.error || `Stop failed with HTTP ${res.status}`);\n    if (jobStream) { jobStream.close(); jobStream = null; }\n    if (logEl) appendLogLine(logEl, '\u2717 Job stopped by user');\n    setStatus(ui.pillId, ui.labelId, 'failed', ui.label);\n  } catch (err) {\n    if (logEl) appendLogLine(logEl, `Stop failed: ${err.message}`);\n    alert(err.message);\n  } finally {\n    currentJobId = null;\n    currentJobType = null;\n    setStopButtonsVisible(false);\n  }\n}\n\nfunction appendLogLine(container, line) {\n  const p = document.createElement('p');\n  p.className = 'log-line';\n  if (\u002F\u2713|done|success|complete\u002Fi.test(line))  p.classList.add('success');\n  else if (\u002F\u2717|error|fail|ERR\u002Fi.test(line))    p.classList.add('error');\n  else if (\u002F\u2500\u2500|step \\d\u002Fi.test(line))           p.classList.add('heading');\n  p.textContent = line;\n  container.appendChild(p);\n  container.scrollTop = container.scrollHeight;\n}\n\nfunction setStatus(pillId, labelId, status, label) {\n  const pill = document.getElementById(pillId);\n  const lbl  = document.getElementById(labelId);\n  if (!pill || !lbl) return;\n  const names = {\n    'gc-scraper': \"Analyze Opponent's Games\", 'pg-scraper': \"Analyze Opponent's Players\",\n    'reingest': 'Reingest', 'report': 'Generate Report',\n    'full-pipeline': 'Full Pipeline', 'self-scout': 'Self-Scout', 'matchup': 'Matchup',\n  };\n  lbl.textContent = names[label] || label;\n  pill.className = `status-pill status-${status}`;\n  pill.innerHTML = status === 'running'\n    ? `<span class=\"spinner\"><\u002Fspan> Running`\n    : status === 'done' ? '\u2713 Done' : status === 'failed' ? '\u2717 Failed' : 'Idle';\n  if (status === 'running') {\n    const drawer = document.getElementById('jobLogDrawer');\n    const btn = document.getElementById('jobLogToggleBtn');\n    if (drawer && !drawer.classList.contains('open')) drawer.classList.add('open');\n    if (btn) btn.textContent = 'Hide Logs';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Load games \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadGames() {\n  const el = document.getElementById('pane-games');\n  if (!el || !selectedTeam) return;\n\n  el.innerHTML = `<p class=\"log-empty\" style=\"color:var(--muted)\">Loading games...<\u002Fp>`;\n\n  let games;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${selectedTeam.id}\u002Fgames`);\n    if (!res.ok) throw new Error(`Server returned ${res.status} \u2014 restart server.js to pick up new endpoints`);\n    games = await res.json();\n  } catch (err) {\n    el.innerHTML = `<div class=\"empty\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M12 3 2 20h20z\"\u002F><path d=\"M12 10v5M12 18h.01\"\u002F><\u002Fsvg><\u002Fdiv><h3>Could not load games<\u002Fh3><p>${escHtml(err.message)}<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  if (!games.length) {\n    el.innerHTML = `<div class=\"empty\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"\u002F><path d=\"M3 10h18M8 3v4M16 3v4\"\u002F><\u002Fsvg><\u002Fdiv><h3>No games in database<\u002Fh3><p>Run Analyze Opponent's Games to pull game data.<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  el.innerHTML = `\n    <div class=\"section-label\">${games.length} game${games.length !== 1 ? 's' : ''} in database<\u002Fdiv>\n    <div class=\"games-list\">\n      ${games.map(g => {\n        const result  = g.result || '?';\n        const score   = (g.score_us != null && g.score_them != null) ? `${g.score_us}-${g.score_them}` : '\u2014';\n        const dateStr = g.game_date\n          ? new Date(g.game_date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })\n          : '\u2014';\n        return `\n          <div class=\"game-row\">\n            <span class=\"game-date\">${dateStr}<\u002Fspan>\n            <span class=\"game-opp\">vs ${escHtml(g.opponent_name || 'Unknown')}<\u002Fspan>\n            <span class=\"game-result ${['W','L','T'].includes(result) ? result : ''}\">${result}<\u002Fspan>\n            <span class=\"game-score\">${score}<\u002Fspan>\n            ${g.gc_game_url ? `<a class=\"game-link\" href=\"${escHtml(g.gc_game_url)}\" target=\"_blank\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M7 17 17 7\"\u002F><path d=\"M8 7h9v9\"\u002F><\u002Fsvg> GC<\u002Fa>` : ''}\n          <\u002Fdiv>\n        `;\n      }).join('')}\n    <\u002Fdiv>\n  `;\n}\n\n\u002F\u002F \u2500\u2500 Load reports \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadReports() {\n  const el = document.getElementById('pane-reports');\n  if (!el) return;\n\n  const res     = await apiFetch('\u002Fapi\u002Freports');\n  const reports = await res.json();\n\n  const teamSlug = (selectedTeam?.team_name || '').replace(\u002F\\s+\u002Fg, '-').toLowerCase();\n  const filtered = reports.filter(r => r.name.toLowerCase().includes(teamSlug));\n  const all      = reports.filter(r => !filtered.includes(r));\n\n  if (!filtered.length && !all.length) {\n    el.innerHTML = `<div class=\"empty\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"\u002F><path d=\"M14 3v5h5\"\u002F><path d=\"M9 13h6M9 17h4\"\u002F><\u002Fsvg><\u002Fdiv><h3>No reports yet<\u002Fh3><p>Run the pipeline to generate a scouting report.<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  const renderItem = r => {\n    const date = new Date(r.mtime).toLocaleDateString();\n    const size = (r.size \u002F 1024).toFixed(0) + ' KB';\n    return `<div class=\"report-item\">\n      <span class=\"report-icon\"><svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><rect x=\"8\" y=\"3\" width=\"8\" height=\"4\" rx=\"1\"\u002F><path d=\"M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2\"\u002F><\u002Fsvg><\u002Fspan>\n      <div>\n        <div class=\"report-name\">${escHtml(r.name)}<\u002Fdiv>\n        <div class=\"report-meta\">${date} \u00b7 ${size}<\u002Fdiv>\n      <\u002Fdiv>\n      <a class=\"report-dl\" href=\"\u002Freports\u002F${encodeURIComponent(r.name)}\" download>Download<\u002Fa>\n    <\u002Fdiv>`;\n  };\n\n  el.innerHTML =\n    (filtered.length ? `<div class=\"section-label\">This Team<\u002Fdiv><div class=\"reports-list\">${filtered.map(renderItem).join('')}<\u002Fdiv>` : '') +\n    (all.length ? `<div class=\"section-label\" style=\"margin-top:16px\">All Reports<\u002Fdiv><div class=\"reports-list\">${all.map(renderItem).join('')}<\u002Fdiv>` : '');\n}\n\n\u002F\u002F \u2500\u2500 Roster \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nlet rosterPlayers = [];\n\nfunction availabilityBadge(p) {\n  if (p.availability_status === 'injured') {\n    const back = p.injury_return_date\n      ? new Date(p.injury_return_date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })\n      : 'TBD';\n    return `<span class=\"badge roster-badge-injured\">Injured \u00b7 back ${back}<\u002Fspan>`;\n  }\n  if (p.availability_status === 'unavailable') {\n    const until = p.unavailable_until\n      ? new Date(p.unavailable_until + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })\n      : '?';\n    return `<span class=\"badge roster-badge-unavailable\">Unavailable until ${until}<\u002Fspan>`;\n  }\n  return `<span class=\"badge roster-badge-available\">Available<\u002Fspan>`;\n}\n\nasync function loadRoster() {\n  const el = document.getElementById('pane-roster');\n  if (!el || !selectedTeam) return;\n\n  const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${selectedTeam.id}\u002Fplayers`);\n  rosterPlayers = await res.json();\n\n  if (!rosterPlayers.length) {\n    el.innerHTML = `<div class=\"empty\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"9\" cy=\"7\" r=\"4\"\u002F><path d=\"M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2\"\u002F><path d=\"M17 11a4 4 0 0 0 0-8\"\u002F><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"\u002F><\u002Fsvg><\u002Fdiv><h3>No players on the roster yet<\u002Fh3><p>Add players manually, or pull in names already captured by Analyze Opponent's Games.<\u002Fp><\u002Fdiv>\n      <div class=\"actions\" style=\"justify-content:center;margin-top:14px\">\n        <button class=\"btn btn-secondary\" onclick=\"seedRosterFromGames()\">Populate From Games<\u002Fbutton>\n        <button class=\"btn btn-primary\" onclick=\"showAddPlayer()\">Add Player<\u002Fbutton>\n      <\u002Fdiv>`;\n    return;\n  }\n\n  el.innerHTML = `\n    <div class=\"section-label\" style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span>${rosterPlayers.length} player${rosterPlayers.length !== 1 ? 's' : ''} on roster<\u002Fspan>\n      <span style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-utility\" onclick=\"seedRosterFromGames()\">Populate From Games<\u002Fbutton>\n        <button class=\"btn btn-primary\" onclick=\"showAddPlayer()\">Add Player<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"roster-list\">\n      ${rosterPlayers.map(p => `\n        <div class=\"roster-row\">\n          <span class=\"roster-name\">${escHtml(p.first_name)} ${escHtml(p.last_name)}<\u002Fspan>\n          ${p.jersey_number ? `<span class=\"roster-jersey\">#${escHtml(p.jersey_number)}<\u002Fspan>` : ''}\n          ${p.handedness ? `<span class=\"roster-hand\">${escHtml(p.handedness)}<\u002Fspan>` : ''}\n          ${p.positions ? `<span class=\"roster-positions\">${escHtml(p.positions)}<\u002Fspan>` : ''}\n          ${p.is_pickup ? `<span class=\"badge roster-badge-pickup\">Pickup<\u002Fspan>` : ''}\n          ${availabilityBadge(p)}\n          <span class=\"roster-actions\">\n            <button class=\"btn btn-outline roster-btn-sm\" onclick=\"showEditPlayer(${p.id})\">Edit<\u002Fbutton>\n            <button class=\"btn btn-outline roster-btn-sm danger\" onclick=\"deletePlayerRow(${p.id})\">Remove<\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>\n  `;\n}\n\nasync function seedRosterFromGames() {\n  if (!selectedTeam) return;\n  const res  = await apiFetch(`\u002Fapi\u002Fteams\u002F${selectedTeam.id}\u002Fplayers\u002Fseed-from-games`, { method: 'POST' });\n  const data = await res.json();\n  if (!res.ok) { alert(data.error || 'Could not populate roster from games.'); return; }\n  await loadRoster();\n}\n\nfunction onPlayerAvailabilityChange() {\n  const value = document.querySelector('input[name=\"playerAvailability\"]:checked')?.value || 'available';\n  document.getElementById('playerUnavailableUntilWrap').style.display = value === 'unavailable' ? 'block' : 'none';\n  document.getElementById('playerInjuryReturnWrap').style.display     = value === 'injured'     ? 'block' : 'none';\n}\n\nfunction resetPlayerModalFields() {\n  document.getElementById('playerId').value               = '';\n  document.getElementById('playerFirstName').value        = '';\n  document.getElementById('playerLastName').value          = '';\n  document.getElementById('playerJersey').value            = '';\n  document.getElementById('playerHandedness').value        = '';\n  document.getElementById('playerPositions').value         = '';\n  document.getElementById('playerIsPickup').checked        = false;\n  document.getElementById('playerUnavailableUntil').value  = '';\n  document.getElementById('playerInjuryReturnDate').value  = '';\n  document.querySelector('input[name=\"playerAvailability\"][value=\"available\"]').checked = true;\n  onPlayerAvailabilityChange();\n  document.getElementById('playerModalError').style.display = 'none';\n}\n\nfunction showAddPlayer() {\n  resetPlayerModalFields();\n  document.getElementById('playerModalTitle').textContent = 'Add Player';\n  document.getElementById('playerModal').style.display = 'flex';\n  document.getElementById('playerFirstName').focus();\n}\n\nfunction showEditPlayer(playerId) {\n  const p = rosterPlayers.find(r => String(r.id) === String(playerId));\n  if (!p) return;\n  resetPlayerModalFields();\n  document.getElementById('playerModalTitle').textContent = 'Edit Player';\n  document.getElementById('playerId').value           = p.id;\n  document.getElementById('playerFirstName').value    = p.first_name || '';\n  document.getElementById('playerLastName').value     = p.last_name || '';\n  document.getElementById('playerJersey').value       = p.jersey_number || '';\n  document.getElementById('playerHandedness').value   = p.handedness || '';\n  document.getElementById('playerPositions').value    = p.positions || '';\n  document.getElementById('playerIsPickup').checked   = !!p.is_pickup;\n  document.querySelector(`input[name=\"playerAvailability\"][value=\"${p.availability_status || 'available'}\"]`).checked = true;\n  document.getElementById('playerUnavailableUntil').value = p.unavailable_until || '';\n  document.getElementById('playerInjuryReturnDate').value = p.injury_return_date || '';\n  onPlayerAvailabilityChange();\n  document.getElementById('playerModal').style.display = 'flex';\n}\n\nfunction hidePlayerModal() {\n  document.getElementById('playerModal').style.display = 'none';\n}\n\nasync function submitPlayer() {\n  const errEl = document.getElementById('playerModalError');\n  errEl.style.display = 'none';\n\n  const firstName = document.getElementById('playerFirstName').value.trim();\n  const lastName  = document.getElementById('playerLastName').value.trim();\n  if (!firstName || !lastName) {\n    errEl.textContent = 'First and last name are required.';\n    errEl.style.display = 'block';\n    return;\n  }\n\n  const availabilityStatus = document.querySelector('input[name=\"playerAvailability\"]:checked')?.value || 'available';\n  const body = {\n    firstName, lastName,\n    jerseyNumber: document.getElementById('playerJersey').value.trim(),\n    handedness: document.getElementById('playerHandedness').value,\n    positions: document.getElementById('playerPositions').value,\n    isPickup: document.getElementById('playerIsPickup').checked,\n    availabilityStatus,\n    unavailableUntil: document.getElementById('playerUnavailableUntil').value || null,\n    injuryReturnDate: document.getElementById('playerInjuryReturnDate').value || null,\n  };\n\n  const playerId = document.getElementById('playerId').value;\n  const url    = playerId ? `\u002Fapi\u002Fteams\u002F${selectedTeam.id}\u002Fplayers\u002F${playerId}` : `\u002Fapi\u002Fteams\u002F${selectedTeam.id}\u002Fplayers`;\n  const method = playerId ? 'PUT' : 'POST';\n\n  const res  = await apiFetch(url, { method, body: JSON.stringify(body) });\n  const data = await res.json();\n  if (!res.ok) {\n    errEl.textContent = data.error || 'Could not save player.';\n    errEl.style.display = 'block';\n    return;\n  }\n\n  hidePlayerModal();\n  await loadRoster();\n}\n\nasync function deletePlayerRow(playerId) {\n  if (!confirm('Remove this player from the roster?')) return;\n  await apiFetch(`\u002Fapi\u002Fteams\u002F${selectedTeam.id}\u002Fplayers\u002F${playerId}`, { method: 'DELETE' });\n  await loadRoster();\n}\n\n\u002F\u002F \u2500\u2500 Opponent roster \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Comparable to loadRoster()\u002FshowAddPlayer()\u002FsubmitPlayer() above, but for\n\u002F\u002F an OPPONENT's players (opponent_players \u002F opponent_roster_memberships),\n\u002F\u002F never our own roster_players. Jersey number lives on the membership, not\n\u002F\u002F the player -- see src\u002Fopponent-roster-service.js's own header comment --\n\u002F\u002F so it is never treated as identity here either.\nconst OPPONENT_STATUS_LABELS = {\n  active: 'Active',\n  graduated: 'Graduated',\n  transferred: 'Transferred',\n  not_participating: 'Not Participating',\n  other_non_returning: 'Other \u002F Non-Returning',\n};\nlet oppRosterRows = [];\nlet oppRosterConflictsByPlayer = {};\nlet oppRosterSearchTerm = '';\n\nasync function loadOpponentRoster() {\n  const el = document.getElementById('pane-opp-roster');\n  if (!el || !selectedTeam) return;\n\n  const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Froster`);\n  if (!res.ok) {\n    const data = await res.json().catch(() => ({}));\n    el.innerHTML = `<div class=\"empty\"><h3>Could not load roster<\u002Fh3><p>${escHtml(data.error || 'Something went wrong.')}<\u002Fp><button class=\"btn btn-secondary\" onclick=\"loadOpponentRoster()\">Retry<\u002Fbutton><\u002Fdiv>`;\n    return;\n  }\n  const data = await res.json();\n  oppRosterRows = data.roster || [];\n\n  \u002F\u002F Fetch unresolved import conflicts per player in the background -- never\n  \u002F\u002F blocks the initial render, and a failure here just means conflict\n  \u002F\u002F banners silently don't appear rather than breaking the roster view.\n  Promise.all(oppRosterRows.map(async (p) => {\n    try {\n      const cRes = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fplayers\u002F${p.id}\u002Fconflicts`);\n      if (!cRes.ok) return;\n      const cData = await cRes.json();\n      oppRosterConflictsByPlayer[p.id] = cData.conflicts || [];\n    } catch { \u002F* non-fatal *\u002F }\n  })).then(() => { if (document.getElementById('pane-opp-roster')?.classList.contains('active')) renderOpponentRosterList(); });\n\n  renderOpponentRosterList();\n}\n\nfunction opponentRosterSearchInput(value) {\n  oppRosterSearchTerm = value;\n  renderOpponentRosterList();\n}\n\nfunction renderOpponentRosterList() {\n  const el = document.getElementById('pane-opp-roster');\n  if (!el) return;\n\n  const term = oppRosterSearchTerm.trim().toLowerCase();\n  const filtered = !term ? oppRosterRows : oppRosterRows.filter((p) =>\n    `${p.first_name} ${p.last_name}`.toLowerCase().includes(term) ||\n    (p.membership?.jersey_number || '').toLowerCase().includes(term)\n  );\n\n  const searchBar = `\n    <div class=\"section-label\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n      <input type=\"text\" placeholder=\"Search by name or jersey number...\" value=\"${escHtml(oppRosterSearchTerm)}\"\n             oninput=\"opponentRosterSearchInput(this.value)\" style=\"flex:1;min-width:180px\" class=\"opt-input\">\n      <span style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-primary\" onclick=\"showAddOpponentPlayer()\">Add Player<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>`;\n\n  if (!oppRosterRows.length) {\n    el.innerHTML = `${searchBar}<div class=\"empty\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"9\" cy=\"7\" r=\"4\"\u002F><path d=\"M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2\"\u002F><\u002Fsvg><\u002Fdiv><h3>No opponent players yet<\u002Fh3><p>Add players manually, or they will appear here once captured by Analyze Opponent's Games.<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  if (!filtered.length) {\n    el.innerHTML = `${searchBar}<div class=\"empty\"><p>No players match \"${escHtml(oppRosterSearchTerm)}\".<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  el.innerHTML = `${searchBar}\n    <div class=\"roster-list\">\n      ${filtered.map((p) => {\n        const conflicts = oppRosterConflictsByPlayer[p.id] || [];\n        const confirmedCount = (p.confirmed_fields || []).length;\n        const sourceLabel = p.record_source === 'gamechanger' ? 'Imported (GameChanger)' : 'Manually entered';\n        return `\n        <div class=\"roster-row\" style=\"flex-wrap:wrap\">\n          <span class=\"roster-name\">${escHtml(p.first_name)} ${escHtml(p.last_name)}<\u002Fspan>\n          ${p.membership?.jersey_number ? `<span class=\"roster-jersey\">#${escHtml(p.membership.jersey_number)}<\u002Fspan>` : ''}\n          ${p.positions?.length ? `<span class=\"roster-positions\">${escHtml(p.positions.join('\u002F'))}<\u002Fspan>` : ''}\n          ${p.bats || p.throws ? `<span class=\"roster-hand\">B\u002FT: ${escHtml(p.bats || '?')}\u002F${escHtml(p.throws || '?')}<\u002Fspan>` : ''}\n          ${p.class_or_grad_year ? `<span class=\"roster-positions\">${escHtml(p.class_or_grad_year)}<\u002Fspan>` : ''}\n          <span class=\"badge ${p.status === 'active' ? 'roster-badge-available' : 'roster-badge-unavailable'}\">${escHtml(OPPONENT_STATUS_LABELS[p.status] || p.status)}<\u002Fspan>\n          <span class=\"badge\" title=\"Where this player's data came from\">${escHtml(sourceLabel)}<\u002Fspan>\n          ${confirmedCount > 0 ? `<span class=\"badge\" title=\"${confirmedCount} field(s) you've manually confirmed\">\u2713 ${confirmedCount} confirmed<\u002Fspan>` : ''}\n          ${p.last_observed_at ? `<span style=\"color:var(--muted);font-size:12px\">Last seen ${escHtml(String(p.last_observed_at).slice(0, 10))}<\u002Fspan>` : ''}\n          <span class=\"roster-actions\">\n            <button class=\"btn btn-outline roster-btn-sm\" onclick=\"showEditOpponentPlayer('${escHtml(p.id)}')\">Edit<\u002Fbutton>\n            <button class=\"btn btn-outline roster-btn-sm\" onclick=\"showMergeOpponentPlayer('${escHtml(p.id)}')\">Merge Duplicate<\u002Fbutton>\n          <\u002Fspan>\n          ${conflicts.length ? `\n          <div style=\"width:100%;margin-top:6px;padding:10px;border-radius:8px;background:var(--warn-bg,rgba(200,150,50,0.12));border:1px solid var(--warn,#c89632);font-size:13px\">\n            <strong>Imported data disagrees with your saved value<\u002Fstrong> for ${conflicts.map((c) => escHtml(c.field_name.replace(\u002F_\u002Fg, ' '))).join(', ')}.\n            Your value is kept until you decide.\n            ${conflicts.map((c) => `\n              <div style=\"margin-top:4px\">\n                <em>${escHtml(c.field_name.replace(\u002F_\u002Fg, ' '))}<\u002Fem>: your value \"${escHtml(c.coach_confirmed_value ?? '')}\" vs. imported \"${escHtml(c.imported_value ?? '')}\"\n                <button class=\"btn btn-outline roster-btn-sm\" onclick=\"resolveOpponentConflict('${escHtml(p.id)}','${escHtml(c.id)}','kept_coach_value',null,null)\">Keep my value<\u002Fbutton>\n                <button class=\"btn btn-outline roster-btn-sm\" onclick=\"resolveOpponentConflict('${escHtml(p.id)}','${escHtml(c.id)}','accepted_import_value','${escHtml(c.field_name)}','${escHtml(c.imported_value ?? '')}')\">Use imported value<\u002Fbutton>\n              <\u002Fdiv>`).join('')}\n          <\u002Fdiv>` : ''}\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>\n  `;\n}\n\nasync function resolveOpponentConflict(playerId, conflictId, resolution, fieldName, importedValue) {\n  const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fconflicts\u002F${conflictId}\u002Fresolve`, {\n    method: 'POST', body: JSON.stringify({ resolution }),\n  });\n  if (!res.ok) { const d = await res.json().catch(() => ({})); alert(d.error || 'Could not resolve conflict.'); return; }\n  if (resolution === 'accepted_import_value' && fieldName) {\n    const patch = {};\n    patch[fieldName] = fieldName === 'positions' ? (importedValue ? importedValue.split(',') : []) : importedValue;\n    const updRes = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fplayers\u002F${playerId}`, { method: 'PATCH', body: JSON.stringify(patch) });\n    if (!updRes.ok) { const d = await updRes.json().catch(() => ({})); alert(d.error || 'Could not apply the imported value.'); }\n  }\n  delete oppRosterConflictsByPlayer[playerId];\n  await loadOpponentRoster();\n}\n\nfunction resetOpponentPlayerModalFields() {\n  document.getElementById('oppPlayerId').value = '';\n  document.getElementById('oppPlayerMembershipId').value = '';\n  document.getElementById('oppPlayerFirstName').value = '';\n  document.getElementById('oppPlayerLastName').value = '';\n  document.getElementById('oppPlayerPositions').value = '';\n  document.getElementById('oppPlayerBats').value = '';\n  document.getElementById('oppPlayerThrows').value = '';\n  document.getElementById('oppPlayerClassYear').value = '';\n  document.getElementById('oppPlayerStatus').value = 'active';\n  document.getElementById('oppPlayerJersey').value = '';\n  document.getElementById('oppPlayerModalError').style.display = 'none';\n}\n\nfunction showAddOpponentPlayer() {\n  resetOpponentPlayerModalFields();\n  document.getElementById('oppPlayerModalTitle').textContent = 'Add Opponent Player';\n  document.getElementById('oppPlayerModal').style.display = 'flex';\n  document.getElementById('oppPlayerFirstName').focus();\n}\n\nfunction showEditOpponentPlayer(playerId) {\n  const p = oppRosterRows.find((r) => String(r.id) === String(playerId));\n  if (!p) return;\n  resetOpponentPlayerModalFields();\n  document.getElementById('oppPlayerModalTitle').textContent = 'Edit Opponent Player';\n  document.getElementById('oppPlayerId').value = p.id;\n  document.getElementById('oppPlayerMembershipId').value = p.membership?.id || '';\n  document.getElementById('oppPlayerFirstName').value = p.first_name || '';\n  document.getElementById('oppPlayerLastName').value = p.last_name || '';\n  document.getElementById('oppPlayerPositions').value = (p.positions || []).join(', ');\n  document.getElementById('oppPlayerBats').value = p.bats || '';\n  document.getElementById('oppPlayerThrows').value = p.throws || '';\n  document.getElementById('oppPlayerClassYear').value = p.class_or_grad_year || '';\n  document.getElementById('oppPlayerStatus').value = p.status || 'active';\n  document.getElementById('oppPlayerJersey').value = p.membership?.jersey_number || '';\n  document.getElementById('oppPlayerModal').style.display = 'flex';\n}\n\nfunction hideOpponentPlayerModal() {\n  document.getElementById('oppPlayerModal').style.display = 'none';\n}\n\nasync function submitOpponentPlayer() {\n  const errEl = document.getElementById('oppPlayerModalError');\n  errEl.style.display = 'none';\n\n  const firstName = document.getElementById('oppPlayerFirstName').value.trim();\n  const lastName = document.getElementById('oppPlayerLastName').value.trim();\n  if (!firstName || !lastName) {\n    errEl.textContent = 'First and last name are required.';\n    errEl.style.display = 'block';\n    return;\n  }\n\n  const positionsRaw = document.getElementById('oppPlayerPositions').value.trim();\n  const body = {\n    first_name: firstName,\n    last_name: lastName,\n    positions: positionsRaw ? positionsRaw.split(',').map((s) => s.trim()).filter(Boolean) : [],\n    bats: document.getElementById('oppPlayerBats').value || null,\n    throws: document.getElementById('oppPlayerThrows').value || null,\n    class_or_grad_year: document.getElementById('oppPlayerClassYear').value.trim() || null,\n    status: document.getElementById('oppPlayerStatus').value,\n  };\n\n  const playerId = document.getElementById('oppPlayerId').value;\n  const jersey = document.getElementById('oppPlayerJersey').value.trim();\n\n  let res, data;\n  if (playerId) {\n    res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fplayers\u002F${playerId}`, { method: 'PATCH', body: JSON.stringify(body) });\n  } else {\n    res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Fplayers`, { method: 'POST', body: JSON.stringify(body) });\n  }\n  data = await res.json();\n  if (!res.ok) {\n    errEl.textContent = data.error || 'Could not save player.';\n    errEl.style.display = 'block';\n    return;\n  }\n\n  const savedPlayerId = data.player.id;\n  const existingMembershipId = document.getElementById('oppPlayerMembershipId').value;\n  if (existingMembershipId) {\n    \u002F\u002F This player already has a membership for this team -- update it in\n    \u002F\u002F place. A NULL season_label is never deduplicated at the database\n    \u002F\u002F level (see the migration's own comment on\n    \u002F\u002F opponent_roster_memberships_player_team_season_key), so POSTing a\n    \u002F\u002F new membership here instead of PATCHing would silently create a\n    \u002F\u002F duplicate row on every re-save rather than update the jersey number.\n    await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fmemberships\u002F${existingMembershipId}`, {\n      method: 'PATCH', body: JSON.stringify({ jersey_number: jersey || null }),\n    }).catch(() => {});\n  } else if (jersey) {\n    await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fplayers\u002F${savedPlayerId}\u002Fmemberships`, {\n      method: 'POST', body: JSON.stringify({ teamId: selectedTeam.id, jersey_number: jersey }),\n    }).catch(() => {});\n  }\n\n  hideOpponentPlayerModal();\n  await loadOpponentRoster();\n}\n\n\u002F\u002F Set by loadMergeImpactPreview() to the last successfully loaded preview\n\u002F\u002F (survivor\u002Fduplicate names + membershipCount\u002FnoteCount) -- used only to\n\u002F\u002F enrich the confirm() dialog text with real counts. submitMergeOpponentPlayer()\n\u002F\u002F never trusts this as authorization for the merge itself; the merge\n\u002F\u002F endpoint independently re-validates and re-derives everything server-side\n\u002F\u002F (see src\u002Fopponent-roster-service.js's loadAndValidateMergePair), so a\n\u002F\u002F stale cached preview here can at wor
