st show a slightly outdated count in\n\u002F\u002F the confirmation text, never bypass a safety check.\nlet oppMergeImpactPreviewCache = null;\n\nfunction showMergeOpponentPlayer(playerId) {\n  const dup = oppRosterRows.find((r) => String(r.id) === String(playerId));\n  if (!dup) return;\n  const others = oppRosterRows.filter((r) => String(r.id) !== String(playerId));\n  if (!others.length) { alert('There is no other player on this roster to merge with.'); return; }\n  document.getElementById('oppMergeDuplicateId').value = playerId;\n  document.getElementById('oppMergeDuplicateName').value = `${dup.first_name} ${dup.last_name}`;\n  document.getElementById('oppMergeKeepSelect').innerHTML = others.map((o) => `<option value=\"${escHtml(o.id)}\">${escHtml(o.first_name)} ${escHtml(o.last_name)}<\u002Foption>`).join('');\n  document.getElementById('oppMergeModalError').style.display = 'none';\n  document.getElementById('oppMergeModal').style.display = 'flex';\n  loadMergeImpactPreview();\n}\n\nfunction hideMergeOpponentPlayerModal() {\n  document.getElementById('oppMergeModal').style.display = 'none';\n}\n\n\u002F\u002F Fetches a fresh, tenant-scoped count of what merging the currently\n\u002F\u002F selected pair would affect, and renders it in the modal. The \"Merge\n\u002F\u002F Players\" button stays disabled until this succeeds at least once for\n\u002F\u002F the CURRENT selection -- a coach can never confirm a merge whose impact\n\u002F\u002F was never actually shown. On failure, offers Retry rather than silently\n\u002F\u002F leaving stale or blank information displayed.\nasync function loadMergeImpactPreview() {\n  const previewEl = document.getElementById('oppMergeImpactPreview');\n  const confirmBtn = document.getElementById('oppMergeConfirmBtn');\n  const mergePlayerId = document.getElementById('oppMergeDuplicateId').value;\n  const keepPlayerId = document.getElementById('oppMergeKeepSelect').value;\n  confirmBtn.disabled = true;\n  oppMergeImpactPreviewCache = null;\n  if (!mergePlayerId || !keepPlayerId) { previewEl.innerHTML = ''; return; }\n\n  previewEl.innerHTML = `<p style=\"color:var(--muted);margin:0\">Loading what this merge will affect...<\u002Fp>`;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Fmerge-preview?keepPlayerId=${encodeURIComponent(keepPlayerId)}&mergePlayerId=${encodeURIComponent(mergePlayerId)}`);\n    const data = await res.json();\n    if (!res.ok) {\n      previewEl.innerHTML = `<p style=\"color:#ff8a80;margin:0 0 6px\">${escHtml(data.error || 'Could not load merge impact.')}<\u002Fp><button class=\"btn btn-outline roster-btn-sm\" onclick=\"loadMergeImpactPreview()\">Retry<\u002Fbutton>`;\n      return;\n    }\n    oppMergeImpactPreviewCache = data;\n    const survivorName = `${data.survivor.first_name} ${data.survivor.last_name}`;\n    const duplicateName = `${data.duplicate.first_name} ${data.duplicate.last_name}`;\n    const membershipLine = data.membershipCount > 0\n      ? `${data.membershipCount} roster membership${data.membershipCount !== 1 ? 's' : ''} will move to ${escHtml(survivorName)}`\n      : 'No roster memberships will be affected';\n    const noteLine = data.noteCount > 0\n      ? `${data.noteCount} scouting note${data.noteCount !== 1 ? 's' : ''} will move to ${escHtml(survivorName)}`\n      : 'No scouting notes will be affected';\n    previewEl.innerHTML = `\n      <div style=\"padding:10px;border-radius:6px;background:var(--surface-2,rgba(255,255,255,0.04));border:1px solid var(--border,rgba(255,255,255,0.08))\">\n        <div>${membershipLine}<\u002Fdiv>\n        <div>${noteLine}<\u002Fdiv>\n        <div style=\"margin-top:6px;color:#ff8a80\">${escHtml(duplicateName)} will then be permanently deleted. This cannot be undone.<\u002Fdiv>\n      <\u002Fdiv>`;\n    confirmBtn.disabled = false;\n  } catch {\n    previewEl.innerHTML = `<p style=\"color:#ff8a80;margin:0 0 6px\">Could not load merge impact. Check your connection and try again.<\u002Fp><button class=\"btn btn-outline roster-btn-sm\" onclick=\"loadMergeImpactPreview()\">Retry<\u002Fbutton>`;\n  }\n}\n\nasync function submitMergeOpponentPlayer() {\n  const errEl = document.getElementById('oppMergeModalError');\n  errEl.style.display = 'none';\n  const mergePlayerId = document.getElementById('oppMergeDuplicateId').value;\n  const keepPlayerId = document.getElementById('oppMergeKeepSelect').value;\n  const dupName = document.getElementById('oppMergeDuplicateName').value;\n  const keepName = document.getElementById('oppMergeKeepSelect').selectedOptions[0]?.textContent || '';\n\n  const preview = oppMergeImpactPreviewCache;\n  const impactLine = preview\n    ? `\\n\\n${preview.membershipCount} roster membership(s) and ${preview.noteCount} scouting note(s) will move to \"${keepName}\".`\n    : '';\n  if (!confirm(`Merge \"${dupName}\" into \"${keepName}\"?${impactLine}\\n\\n\"${dupName}\" will then be permanently deleted. This cannot be undone.`)) {\n    return;\n  }\n\n  \u002F\u002F The preview above is shown for the coach's information only -- the\n  \u002F\u002F merge itself independently re-validates org membership, opponent-team\n  \u002F\u002F membership, and player identity server-side, regardless of what the\n  \u002F\u002F preview returned or how long ago it was fetched.\n  const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Fmerge`, {\n    method: 'POST', body: JSON.stringify({ keepPlayerId, mergePlayerId }),\n  });\n  const data = await res.json();\n  if (!res.ok) {\n    errEl.textContent = data.error || 'Could not merge players.';\n    errEl.style.display = 'block';\n    return;\n  }\n  hideMergeOpponentPlayerModal();\n  await loadOpponentRoster();\n}\n\n\u002F\u002F \u2500\u2500 Opponent coach scouting notes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst NOTE_CATEGORY_LABELS = {\n  lineup: 'Lineup', hitting_approach: 'Hitting Approach', pitching: 'Pitching', defense: 'Defense',\n  baserunning: 'Baserunning', tendencies: 'Tendencies', personnel: 'Personnel',\n  injury_availability: 'Injury \u002F Availability', situational: 'Situational', general: 'General',\n};\nlet oppNoteRows = [];\n\nasync function loadOpponentNotes() {\n  const el = document.getElementById('pane-opp-notes');\n  if (!el || !selectedTeam) return;\n\n  const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Fnotes`);\n  if (!res.ok) {\n    const data = await res.json().catch(() => ({}));\n    el.innerHTML = `<div class=\"empty\"><h3>Could not load notes<\u002Fh3><p>${escHtml(data.error || 'Something went wrong.')}<\u002Fp><button class=\"btn btn-secondary\" onclick=\"loadOpponentNotes()\">Retry<\u002Fbutton><\u002Fdiv>`;\n    return;\n  }\n  const data = await res.json();\n  oppNoteRows = data.notes || [];\n  renderOpponentNotesList();\n}\n\nfunction noteScopeLabel(n) {\n  if (n.opponent_player_id) return 'Player';\n  if (n.game_id) return 'Game';\n  return 'Opponent';\n}\n\nfunction noteAuthorLabel(n) {\n  const me = getSession()?.user?.id;\n  return me && String(me) === String(n.author_user_id) ? 'You' : 'Coach';\n}\n\nfunction renderOpponentNotesList() {\n  const el = document.getElementById('pane-opp-notes');\n  if (!el) return;\n\n  const quickAdd = `\n    <div class=\"section-label\">Add a note about this opponent<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px\">\n      <textarea id=\"oppNoteQuickText\" placeholder=\"e.g. Struggles against high fastballs with two strikes...\" rows=\"2\" maxlength=\"4000\" class=\"opt-input\" style=\"width:100%;resize:vertical\"><\u002Ftextarea>\n      <div id=\"oppNoteQuickError\" style=\"display:none;color:var(--danger,#c0392b);font-size:13px\"><\u002Fdiv>\n      <details>\n        <summary style=\"cursor:pointer;color:var(--muted);font-size:13px\">More options (category, player, game date)<\u002Fsummary>\n        <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n          <select id=\"oppNoteQuickCategory\" class=\"opt-select\" style=\"flex:1;min-width:140px\">\n            <option value=\"\">No category<\u002Foption>\n            ${Object.entries(NOTE_CATEGORY_LABELS).map(([v, l]) => `<option value=\"${v}\">${escHtml(l)}<\u002Foption>`).join('')}\n          <\u002Fselect>\n          <select id=\"oppNoteQuickPlayer\" class=\"opt-select\" style=\"flex:1;min-width:160px\">\n            <option value=\"\">Not about a specific player<\u002Foption>\n            ${oppRosterRows.map((p) => `<option value=\"${escHtml(p.id)}\">${escHtml(p.first_name)} ${escHtml(p.last_name)}<\u002Foption>`).join('')}\n          <\u002Fselect>\n          <input type=\"date\" id=\"oppNoteQuickDate\" class=\"opt-input\" style=\"flex:1;min-width:140px\" title=\"Observed game date (if the exact game record isn't available)\">\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <div>\n        <button class=\"btn btn-primary\" onclick=\"submitQuickOpponentNote()\">Add Note<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"color:var(--muted);font-size:12px;margin:0\">Included coach notes are treated as authoritative scouting observations when the report is generated. They do not change recorded statistics.<\u002Fp>\n    <\u002Fdiv>\n  `;\n\n  if (!oppNoteRows.length) {\n    el.innerHTML = `${quickAdd}<div class=\"empty\"><p>No scouting notes yet for this opponent.<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  el.innerHTML = `${quickAdd}\n    <div class=\"section-label\">${oppNoteRows.length} note${oppNoteRows.length !== 1 ? 's' : ''}<\u002Fdiv>\n    <div class=\"roster-list\">\n      ${oppNoteRows.map((n) => `\n        <div class=\"roster-row\" style=\"flex-direction:column;align-items:flex-start;gap:6px\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%\">\n            <span class=\"badge\">${escHtml(noteScopeLabel(n))}<\u002Fspan>\n            ${n.category ? `<span class=\"badge\">${escHtml(NOTE_CATEGORY_LABELS[n.category] || n.category)}<\u002Fspan>` : ''}\n            <span class=\"badge ${n.include_in_report ? 'roster-badge-available' : 'roster-badge-unavailable'}\"\n                  title=\"Whether this note will be sent to Claude when a report is generated\">\n              ${n.include_in_report ? 'Included in reports' : 'Excluded from reports'}\n            <\u002Fspan>\n            <span style=\"color:var(--muted);font-size:12px;margin-left:auto\">${escHtml(noteAuthorLabel(n))} \u00b7 updated ${escHtml(String(n.updated_at).slice(0, 10))}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"white-space:pre-wrap;word-break:break-word\">${escHtml(n.note_text)}<\u002Fdiv>\n          <div class=\"roster-actions\">\n            <label style=\"display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer\">\n              <input type=\"checkbox\" ${n.include_in_report ? 'checked' : ''}\n                     aria-label=\"Include this note in future reports\"\n                     onchange=\"toggleOpponentNoteInclude('${escHtml(n.id)}', this.checked)\">\n              Include in reports\n            <\u002Flabel>\n            <button class=\"btn btn-outline roster-btn-sm\" onclick=\"showEditOpponentNote('${escHtml(n.id)}')\">Edit<\u002Fbutton>\n            <button class=\"btn btn-outline roster-btn-sm danger\" onclick=\"archiveOpponentNote('${escHtml(n.id)}')\">Archive<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>\n  `;\n}\n\nasync function submitQuickOpponentNote() {\n  const errEl = document.getElementById('oppNoteQuickError');\n  errEl.style.display = 'none';\n  const text = document.getElementById('oppNoteQuickText').value.trim();\n  if (!text) { errEl.textContent = 'Note text is required.'; errEl.style.display = 'block'; return; }\n  if (text.length > 4000) { errEl.textContent = 'Notes must be 4000 characters or fewer.'; errEl.style.display = 'block'; return; }\n\n  const body = {\n    note_text: text,\n    category: document.getElementById('oppNoteQuickCategory').value || undefined,\n    opponent_player_id: document.getElementById('oppNoteQuickPlayer').value || undefined,\n    observed_game_date: document.getElementById('oppNoteQuickDate').value || undefined,\n  };\n  const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Fnotes`, { method: 'POST', body: JSON.stringify(body) });\n  const data = await res.json();\n  if (!res.ok) { errEl.textContent = data.error || 'Could not save note.'; errEl.style.display = 'block'; return; }\n  await loadOpponentNotes();\n  await loadReportContextPreview();\n}\n\nfunction showEditOpponentNote(noteId) {\n  const n = oppNoteRows.find((r) => String(r.id) === String(noteId));\n  if (!n) return;\n  document.getElementById('oppNoteEditId').value = n.id;\n  document.getElementById('oppNoteEditText').value = n.note_text;\n  document.getElementById('oppNoteEditCategory').value = n.category || '';\n  document.getElementById('oppNoteEditModalError').style.display = 'none';\n  document.getElementById('oppNoteEditModal').style.display = 'flex';\n}\n\nfunction hideOpponentNoteEditModal() {\n  document.getElementById('oppNoteEditModal').style.display = 'none';\n}\n\nasync function submitOpponentNoteEdit() {\n  const errEl = document.getElementById('oppNoteEditModalError');\n  errEl.style.display = 'none';\n  const text = document.getElementById('oppNoteEditText').value.trim();\n  if (!text) { errEl.textContent = 'Note text is required.'; errEl.style.display = 'block'; return; }\n  if (text.length > 4000) { errEl.textContent = 'Notes must be 4000 characters or fewer.'; errEl.style.display = 'block'; return; }\n\n  const noteId = document.getElementById('oppNoteEditId').value;\n  const body = { note_text: text, category: document.getElementById('oppNoteEditCategory').value || null };\n  const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fnotes\u002F${noteId}`, { method: 'PATCH', body: JSON.stringify(body) });\n  const data = await res.json();\n  if (!res.ok) { errEl.textContent = data.error || 'Could not save note.'; errEl.style.display = 'block'; return; }\n  hideOpponentNoteEditModal();\n  await loadOpponentNotes();\n}\n\nasync function archiveOpponentNote(noteId) {\n  if (!confirm('Archive this note? Archived notes are removed from the active list and excluded from future reports, but are never permanently deleted.')) return;\n  await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fnotes\u002F${noteId}\u002Farchive`, { method: 'POST' });\n  await loadOpponentNotes();\n  await loadReportContextPreview();\n}\n\nasync function toggleOpponentNoteInclude(noteId, include) {\n  await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fnotes\u002F${noteId}\u002Finclude`, { method: 'PATCH', body: JSON.stringify({ include }) });\n  const n = oppNoteRows.find((r) => String(r.id) === String(noteId));\n  if (n) n.include_in_report = include;\n  renderOpponentNotesList();\n  await loadReportContextPreview();\n}\n\n\u002F\u002F \u2500\u2500 Report-context preview \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Shown above the tab bar for any opponent team -- summarizes what the NEXT\n\u002F\u002F Generate Report \u002F Single Opponent Scout run would include, without ever\n\u002F\u002F exposing the raw Claude prompt or system instructions.\nasync function loadReportContextPreview() {\n  const el = document.getElementById('reportContextPreview');\n  if (!el || !selectedTeam || selectedTeam.is_our_team) return;\n  el.innerHTML = `<p style=\"color:var(--muted);font-size:13px;margin:0\">Loading report context preview...<\u002Fp>`;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F${selectedTeam.id}\u002Freport-context-preview`);\n    if (!res.ok) { el.innerHTML = ''; return; }\n    const data = await res.json();\n    const t = selectedTeam;\n    const notesLine = data.counts.notesIncluded > 0\n      ? `${data.counts.notesIncluded} coach note${data.counts.notesIncluded !== 1 ? 's' : ''} will be included`\n      : 'No coach notes will be sent';\n    const omittedLine = (data.truncated.notesOmitted > 0 || data.truncated.rosterOmitted > 0)\n      ? ` <span style=\"color:var(--warn,#c89632)\">(${data.truncated.notesOmitted + data.truncated.rosterOmitted} older item(s) omitted to keep the report focused)<\u002Fspan>`\n      : '';\n    el.innerHTML = `\n      <div style=\"padding:10px 12px;border-radius:8px;background:var(--surface-2,rgba(255,255,255,0.04));border:1px solid var(--border,rgba(255,255,255,0.08));font-size:13px;display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n        <strong>Next report will include:<\u002Fstrong>\n        <span>${data.counts.rosterIncluded} opponent roster player${data.counts.rosterIncluded !== 1 ? 's' : ''}<\u002Fspan>\n        <span>\u00b7<\u002Fspan>\n        <span>${notesLine}<\u002Fspan>\n        ${omittedLine}\n        <span>\u00b7<\u002Fspan>\n        <span class=\"${t.hasGC ? 'ok' : 'warn'}\">${t.hasGC ? 'Opponent Game Analysis Ready' : 'Opponent Game Analysis Missing'}<\u002Fspan>\n        <span>\u00b7<\u002Fspan>\n        <span class=\"${t.hasPG ? 'ok' : 'warn'}\">${t.hasPG ? 'Opponent Player Analysis Ready' : 'Opponent Player Analysis Missing'}<\u002Fspan>\n      <\u002Fdiv>\n    `;\n  } catch {\n    el.innerHTML = '';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Utility \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction escHtml(s) {\n  return String(s||'').replace(\u002F&\u002Fg,'&amp;').replace(\u002F<\u002Fg,'&lt;').replace(\u002F>\u002Fg,'&gt;').replace(\u002F\"\u002Fg,'&quot;');\n}\n\n\u002F\u002F \u2500\u2500 Add Team Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction showAddTeam() {\n  document.getElementById('addTeamModal').style.display = 'flex';\n  document.getElementById('addName').focus();\n  document.getElementById('addTeamError').style.display = 'none';\n}\nfunction hideAddTeam() {\n  document.getElementById('addTeamModal').style.display    = 'none';\n  document.getElementById('addName').value                 = '';\n  document.getElementById('addGcUrl').value                = '';\n  document.getElementById('addPgUrl').value                = '';\n  document.getElementById('addSheetUrl').value             = '';\n  document.getElementById('replaceAllTeams').checked       = false;\n  document.getElementById('addTeamError').style.display    = 'none';\n  document.getElementById('sheetSyncResult').style.display = 'none';\n  switchAddTab('manual');\n}\nfunction switchAddTab(tab) {\n  document.getElementById('paneManual').style.display = tab === 'manual' ? 'block' : 'none';\n  document.getElementById('paneSheet').style.display  = tab === 'sheet'  ? 'block' : 'none';\n  const m = document.getElementById('tabManual'), s = document.getElementById('tabSheet');\n  m.style.borderBottomColor = tab === 'manual' ? 'var(--accent)' : 'transparent';\n  m.style.color             = tab === 'manual' ? 'var(--accent)' : 'var(--muted)';\n  s.style.borderBottomColor = tab === 'sheet'  ? 'var(--accent)' : 'transparent';\n  s.style.color             = tab === 'sheet'  ? 'var(--accent)' : 'var(--muted)';\n  document.getElementById('addTeamError').style.display = 'none';\n}\nasync function submitAddTeam() {\n  const teamName = document.getElementById('addName').value.trim();\n  const errEl    = document.getElementById('addTeamError');\n  if (!teamName) { errEl.textContent = 'Team name is required.'; errEl.style.display = 'block'; return; }\n  const res  = await apiFetch('\u002Fapi\u002Fteams\u002Fadd', {\n    method: 'POST',\n    body: JSON.stringify({ teamName, gcTeamUrl: document.getElementById('addGcUrl').value.trim(), pgTeamUrl: document.getElementById('addPgUrl').value.trim() }),\n  });\n  const data = await res.json();\n  if (!res.ok) { errEl.textContent = data.error || 'Failed.'; errEl.style.display = 'block'; return; }\n  hideAddTeam();\n  await loadTeams();\n}\nasync function submitSyncSheet() {\n  const csvUrl   = document.getElementById('addSheetUrl').value.trim();\n  const replace  = document.getElementById('replaceAllTeams').checked;\n  const resultEl = document.getElementById('sheetSyncResult');\n  const btn      = document.getElementById('syncSheetBtn');\n  const errEl    = document.getElementById('addTeamError');\n  errEl.style.display = resultEl.style.display = 'none';\n  if (!csvUrl) { errEl.textContent = 'Please paste a published CSV URL.'; errEl.style.display = 'block'; return; }\n  btn.disabled = true; btn.textContent = 'Syncing...';\n  try {\n    const res  = await apiFetch('\u002Fapi\u002Fsettings\u002Fsheet', {\n      method: 'POST',\n      body: JSON.stringify({ csvUrl, replace }),\n    });\n    const data = await res.json();\n    if (!res.ok) { errEl.textContent = data.error || 'Sync failed.'; errEl.style.display = 'block'; return; }\n    resultEl.style.color      = '#2ecc71';\n    resultEl.textContent      = `\u2713 ${data.message}`;\n    resultEl.style.display    = 'block';\n    setTimeout(async () => { hideAddTeam(); await loadTeams(); }, 1500);\n  } catch (err) {\n    errEl.textContent = err.message; errEl.style.display = 'block';\n  } finally {\n    btn.disabled = false; btn.textContent = 'Sync Sheet';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Edit \u002F Remove Opponent \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction showEditTeam(teamId) {\n  const team = allTeams.find(t => String(t.id) === String(teamId));\n  if (!team) { alert('Opponent not found. Refresh the list and try again.'); return; }\n  document.getElementById('editTeamId').value = team.id;\n  document.getElementById('editName').value   = team.team_name || '';\n  document.getElementById('editGcUrl').value  = team.gc_team_url || '';\n  document.getElementById('editPgUrl').value  = team.pg_team_url || '';\n  document.getElementById('editTeamError').style.display = 'none';\n  document.getElementById('editTeamModal').style.display = 'flex';\n  document.getElementById('editName').focus();\n}\n\nfunction hideEditTeam() {\n  document.getElementById('editTeamModal').style.display = 'none';\n  document.getElementById('editTeamError').style.display = 'none';\n}\n\nasync function submitEditTeam() {\n  const teamId = document.getElementById('editTeamId').value;\n  const teamName = document.getElementById('editName').value.trim();\n  const gcTeamUrl = document.getElementById('editGcUrl').value.trim();\n  const pgTeamUrl = document.getElementById('editPgUrl').value.trim();\n  const errEl = document.getElementById('editTeamError');\n\n  if (!teamName) { errEl.textContent = 'Team name is required.'; errEl.style.display = 'block'; return; }\n\n  const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${teamId}`, {\n    method: 'PUT',\n    body: JSON.stringify({ teamName, gcTeamUrl, pgTeamUrl }),\n  });\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) { errEl.textContent = data.error || 'Failed to update opponent.'; errEl.style.display = 'block'; return; }\n\n  hideEditTeam();\n  await loadTeams();\n  selectTeamById(teamId);\n}\n\nasync function removeOpponent(teamId) {\n  const team = allTeams.find(t => String(t.id) === String(teamId));\n  if (!team) { alert('Opponent not found. Refresh the list and try again.'); return; }\n\n  const ok = confirm(`Remove \"${team.team_name}\" from your opponent list?\n\nThis just hides them from the list \u2014 all games and stats stay in the database, and you can bring them back later.`);\n  if (!ok) return;\n\n  const res = await apiFetch(`\u002Fapi\u002Fteams\u002F${teamId}\u002Farchive`, {\n    method: 'PATCH',\n    body: JSON.stringify({ archived: true }),\n  });\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) { alert(data.error || 'Failed to remove opponent.'); return; }\n\n  if (selectedTeam && String(selectedTeam.id) === String(teamId)) {\n    selectedTeam = null;\n    document.getElementById('mainPanel').innerHTML = `<div class=\"empty empty-hero\"><div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\"\u002F><circle cx=\"12\" cy=\"12\" r=\"4.5\"\u002F><circle cx=\"12\" cy=\"12\" r=\"0.9\" fill=\"currentColor\"\u002F><\u002Fsvg><\u002Fdiv><h3>Select a team to get started<\u002Fh3><p>Choose a team from the list on the left<\u002Fp><\u002Fdiv>`;\n  }\n\n  await loadTeams();\n}\n\n\u002F\u002F \u2500\u2500 Billing \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst PLAN_LABELS = { free: 'Free', coach: 'Coach', organization: 'Organization' };\n\nfunction openBilling(noticeHtml = '') {\n  document.getElementById('billingModal').style.display = 'flex';\n  loadBillingStatus(noticeHtml);\n}\nfunction closeBilling() {\n  document.getElementById('billingModal').style.display = 'none';\n}\n\nasync function loadBillingStatus(noticeHtml = '') {\n  const el = document.getElementById('billingContent');\n  el.innerHTML = 'Loading\u2026';\n  try {\n    const res  = await apiFetch('\u002Fapi\u002Fbilling\u002Fstatus');\n    const data = await res.json();\n    if (!res.ok) { el.innerHTML = `<div style=\"color:#e74c3c\">${escHtml(data.error || 'Failed to load billing status.')}<\u002Fdiv>`; return; }\n\n    const expires = data.planExpiresAt ? new Date(data.planExpiresAt).toLocaleDateString() : null;\n    const statusLine = data.subscriptionStatus\n      ? `<div style=\"color:var(--muted);font-size:12px;margin-top:2px\">Status: ${escHtml(data.subscriptionStatus)}${expires ? ` \u00b7 renews ${expires}` : ''}<\u002Fdiv>`\n      : '';\n\n    let actionsHtml;\n    if (data.canManageBilling) {\n      actionsHtml = `\n        <div style=\"margin-top:18px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em\">Upgrade<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <button class=\"btn btn-outline\" onclick=\"startCheckout('coach','month')\">Coach \u2014 $49\u002Fmo<\u002Fbutton>\n            <button class=\"btn btn-outline\" onclick=\"startCheckout('coach','year')\">Coach \u2014 $490\u002Fyr<\u002Fbutton>\n            <button class=\"btn btn-outline\" onclick=\"startCheckout('organization','month')\">Organization \u2014 $199\u002Fmo<\u002Fbutton>\n            <button class=\"btn btn-outline\" onclick=\"startCheckout('organization','year')\">Organization \u2014 $1990\u002Fyr<\u002Fbutton>\n          <\u002Fdiv>\n          ${data.hasBillingAccount ? `<button class=\"btn btn-primary\" style=\"margin-top:8px\" onclick=\"openBillingPortal()\">Manage Billing \u002F Cancel<\u002Fbutton>` : ''}\n        <\u002Fdiv>`;\n    } else {\n      actionsHtml = `<div style=\"color:var(--muted);font-size:12px;margin-top:14px\">Only an organization admin can change plans or manage billing.<\u002Fdiv>`;\n    }\n\n    const fmtLimit = (max) => (max >= 999999 ? 'Unlimited' : String(max));\n    const fmtUsage = (used, max) => (max >= 999999 ? 'Unlimited' : `${used} \u002F ${max}`);\n    const usageRow = (label, used, max) => `\n      <div style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--text);padding:4px 0\">\n        <span style=\"color:var(--muted)\">${label}<\u002Fspan>\n        <span>${fmtUsage(used, max)}<\u002Fspan>\n      <\u002Fdiv>`;\n\n    const reportPeriodLabel = data.reportLimitsAreLifetime ? 'lifetime' : 'this month';\n\n    el.innerHTML = `\n      ${noticeHtml}\n      <div style=\"font-size:18px;font-weight:700\">${escHtml(PLAN_LABELS[data.plan] || data.plan)} plan<\u002Fdiv>\n      ${statusLine}\n      <div style=\"margin-top:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:2px 0\">\n        ${usageRow('Opponent teams', data.usage.opponentTeams, data.limits.maxOpponentTeams)}\n        ${usageRow(`Scouting reports (${reportPeriodLabel})`, data.usage.scoutingReportsThisMonth, data.limits.maxReportsPerMonth)}\n        ${usageRow(`Self-scout reports (${reportPeriodLabel})`, data.usage.selfScoutReportsThisMonth, data.limits.maxSelfScoutReportsPerMonth)}\n        ${usageRow(`Matchup reports (${reportPeriodLabel})`, data.usage.matchupReportsThisMonth, data.limits.maxMatchupReportsPerMonth)}\n        ${usageRow('Users', data.usage.userCount, data.limits.maxUsers)}\n      <\u002Fdiv>\n      ${actionsHtml}\n      <div id=\"billingError\" style=\"color:#e74c3c;font-size:11px;margin-top:10px;display:none\"><\u002Fdiv>\n    `;\n  } catch (err) {\n    el.innerHTML = `<div style=\"color:#e74c3c\">${escHtml(err.message)}<\u002Fdiv>`;\n  }\n}\n\nasync function startCheckout(tier, interval) {\n  const errEl = document.getElementById('billingError');\n  try {\n    const res  = await apiFetch('\u002Fapi\u002Fbilling\u002Fcreate-checkout-session', {\n      method: 'POST',\n      body: JSON.stringify({ tier, interval }),\n    });\n    const data = await res.json();\n    if (!res.ok) throw new Error(data.error || 'Failed to start checkout.');\n    window.location.href = data.url;\n  } catch (err) {\n    if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }\n  }\n}\n\nasync function openBillingPortal() {\n  const errEl = document.getElementById('billingError');\n  try {\n    const res  = await apiFetch('\u002Fapi\u002Fbilling\u002Fcreate-portal-session', { method: 'POST' });\n    const data = await res.json();\n    if (!res.ok) throw new Error(data.error || 'Failed to open billing portal.');\n    window.location.href = data.url;\n  } catch (err) {\n    if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }\n  }\n}\n\n\n\u002F\u002F \u2500\u2500 Init \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n(function init() {\n  \u002F\u002F Supabase password-recovery links land here with tokens in the URL hash\n  \u002F\u002F (e.g. #access_token=...&type=recovery). Intercept before anything else.\n  const hashParams = new URLSearchParams(window.location.hash.replace(\u002F^#\u002F, ''));\n  if (hashParams.get('type') === 'recovery' && hashParams.get('access_token')) {\n    const token = hashParams.get('access_token');\n    history.replaceState({}, '', window.location.pathname + window.location.search);\n    showResetPassword(token);\n    return;\n  }\n\n  if (DESIGN_MODE) {\n    const designUser = {\n      id: 'design-preview',\n      email: 'design-preview@jobuscout.local'\n    };\n    showDashboard(designUser);\n    loadProductAndRoute();\n    return;\n  }\n\n  const session = getSession();\n  if (session?.accessToken) {\n    \u002F\u002F Already logged in \u2014 go straight to dashboard\n    showDashboard(session.user);\n    loadProductAndRoute();\n\n    const billingParam = new URLSearchParams(window.location.search).get('billing');\n    if (billingParam) {\n      history.replaceState({}, '', window.location.pathname);\n      const notice = billingParam === 'success'\n        ? '<div style=\"background:rgba(46,204,113,0.12);border:1px solid #2ecc71;color:#2ecc71;padding:8px 10px;border-radius:4px;font-size:12px;margin-bottom:12px\">Subscription updated successfully.<\u002Fdiv>'\n        : '<div style=\"background:rgba(231,76,60,0.12);border:1px solid #e74c3c;color:#e74c3c;padding:8px 10px;border-radius:4px;font-size:12px;margin-bottom:12px\">Checkout was canceled.<\u002Fdiv>';\n      openBilling(notice);\n    }\n  } else {\n    \u002F\u002F Deep link from the marketing site, e.g. \u002F?signup=1&tier=coach&interval=year\n    const searchParams = new URLSearchParams(window.location.search);\n    if (searchParams.get('signup')) {\n      const tier = searchParams.get('tier');\n      const interval = searchParams.get('interval');\n      history.replaceState({}, '', window.location.pathname);\n      showSignup({ tier, interval });\n      setTimeout(() => document.getElementById('signupOrgName')?.focus(), 100);\n      return;\n    }\n\n    \u002F\u002F Show login screen, focus email field\n    showLogin();\n    setTimeout(() => document.getElementById('loginEmail')?.focus(), 100);\n  }\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
</script>
