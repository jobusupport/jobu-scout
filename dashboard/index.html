  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght: 700;\n  font-display: swap;\n  src: url(\"a3f8e474-95bf-4bdd-ba78-41dbb6045be0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n\u002F* latin-ext *\u002F\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dfafb666-4ed5-4efc-a1c4-f960266457a1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n\u002F* latin *\u002F\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bcaf4694-a5a5-4357-b27c-f4207242cdaf\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --navy:   #0c121c;\n    --blue:   #101a27;\n    --accent: #c79a45;\n    --accent-hover: #d6aa54;\n    --red:    #c43b32;\n    --red-hover: #d4453b;\n    --red-press: #a82f27;\n    --green:  #3ea76f;\n    --gray:   #9aa4b4;\n    --light:  #f4f0e6;\n    --white:  #f4f0e6;\n    --card:   #0e1622;\n    --panel:  #101a27;\n    --border: #1d2838;\n    --line-strong: #233044;\n    --text:   #ece7da;\n    --muted:  #7d8799;\n    --font-body: 'Inter', system-ui, sans-serif;\n    --font-display: 'Oswald', sans-serif;\n    --font-wordmark: 'Bebas Neue', sans-serif;\n    --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    background: var(--navy);\n    color: var(--text);\n    font-family: var(--font-body);\n    font-size: 14px;\n    min-height: 100vh;\n    color-scheme: dark;\n  }\n\n  \u002F* \u2500\u2500 Header \u2500\u2500 *\u002F\n  header {\n    background: var(--blue);\n    border-bottom: 2px solid var(--accent);\n    padding: 0 24px;\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    height: 56px;\n    flex-shrink: 0;\n  }\n  .sidebar-toggle-btn {\n    background: none; border: 1px solid var(--border); color: var(--muted);\n    width: 28px; height: 28px; border-radius: 5px; cursor: pointer;\n    display: flex; align-items: center; justify-content: center; flex-shrink: 0;\n    margin-left: 4px; transition: all 0.15s;\n  }\n  .sidebar-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }\n  .logo { font-family: var(--font-wordmark); font-size: 27px; font-weight: 400; letter-spacing: 0.06em; color: var(--white); text-transform: uppercase; }\n  .logo span { color: var(--accent); }\n  .header-sub {\n    font-family: var(--font-mono);\n    font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;\n    border-left: 1px solid var(--border); padding-left: 16px; margin-left: 4px;\n  }\n  .header-status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }\n  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }\n\n  \u002F* \u2500\u2500 Product switcher (Jobu Scout Travel \u002F Jobu Scout High School) \u2500\u2500 *\u002F\n  \u002F* Shown only when an organization is entitled to both products (see\n     renderProductChrome in the script below) -- single-product\n     organizations never render this element at all. *\u002F\n  .product-switcher {\n    display: none; align-items: center; gap: 2px;\n    border: 1px solid var(--border); border-radius: 5px; padding: 2px; flex-shrink: 0;\n  }\n  .product-switch-btn {\n    background: none; border: none; color: var(--muted);\n    padding: 3px 9px; border-radius: 3px; cursor: pointer; font-size: 11px;\n    transition: all 0.15s;\n  }\n  .product-switch-btn:hover { color: var(--text); }\n  .product-switch-btn.active { background: var(--red); color: var(--white); }\n  .product-switch-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\n  .product-switch-btn .psw-short { display: none; }\n  @media (max-width: 640px) {\n    .header-sub { display: none; }\n    .product-switch-btn { padding: 3px 6px; font-size: 10px; }\n    .product-switch-btn .psw-full { display: none; }\n    .product-switch-btn .psw-short { display: inline; }\n  }\n\n  \u002F* \u2500\u2500 Layout \u2500\u2500 *\u002F\n  .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 56px); overflow: hidden; transition: grid-template-columns 0.18s ease; }\n  .layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }\n\n  \u002F* \u2500\u2500 Sidebar \u2500\u2500 *\u002F\n  .sidebar { background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }\n  .layout.sidebar-collapsed .sidebar { border-right: none; opacity: 0; }\n  .sidebar-header {\n    padding: 14px 16px; border-bottom: 1px solid var(--border);\n    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;\n  }\n  .sidebar-header h2 { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; }\n  .refresh-btn {\n    background: none; border: 1px solid var(--border); color: var(--muted);\n    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.15s;\n  }\n  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }\n\n  .team-list { overflow-y: auto; flex: 1; }\n  .team-item {\n    padding: 11px 16px; border-bottom: 1px solid var(--border);\n    cursor: pointer; transition: background 0.1s; position: relative;\n  }\n  .team-item:hover { background: rgba(255,255,255,0.03); }\n  .team-item.active { background: rgba(196,59,50,0.10); border-left: 3px solid var(--red); }\n  .team-name { font-weight: 600; font-size: 14px; color: var(--text); margin-bottom: 5px; }\n  .team-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }\n\n  .badge {\n    font-family: var(--font-mono);\n    font-size: 11px; padding: 2px 6px; border-radius: 4px;\n    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\n  }\n  .badge-games { background: rgba(26,58,92,0.8); color: var(--gray); }\n  .badge-gc    { background: rgba(39,174,96,0.15); color: var(--green); }\n  .badge-pg    { background: rgba(200,168,75,0.15); color: var(--accent); }\n  .badge-wins  { background: rgba(39,174,96,0.15); color: var(--green); }\n  .badge-year   { background: rgba(26,58,92,0.8); color: var(--gray); }\n  .badge-season { background: rgba(200,168,75,0.15); color: var(--accent); }\n\n  \u002F* \u2500\u2500 Roster \u2500\u2500 *\u002F\n  .roster-list { display: flex; flex-direction: column; gap: 6px; }\n  .roster-row {\n    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\n    background: var(--card);\n    border-radius: 8px; padding: 9px 14px; font-size: 12px;\n  }\n  .roster-name      { font-weight: 600; color: var(--text); min-width: 130px; }\n  .roster-jersey    { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }\n  .roster-hand      { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }\n  .roster-positions { color: var(--gray); font-size: 11px; }\n  .roster-actions   { margin-left: auto; display: flex; gap: 6px; }\n  .roster-btn-sm    { padding: 3px 9px; font-size: 11px; }\n  .roster-btn-sm.danger { color: var(--red); border-color: rgba(196,59,50,0.4); }\n  .roster-badge-available   { background: rgba(39,174,96,0.15); color: var(--green); }\n  .roster-badge-unavailable { background: rgba(200,168,75,0.15); color: var(--accent); }\n  .roster-badge-injured     { background: rgba(196,59,50,0.15); color: var(--red); }\n  .roster-badge-pickup      { background: rgba(26,58,92,0.8); color: var(--gray); }\n\n  \u002F* \u2500\u2500 Main panel \u2500\u2500 *\u002F\n  .main { display: flex; flex-direction: column; overflow: hidden; }\n\n  \u002F* \u2500\u2500 Team header \u2500\u2500 *\u002F\n  .team-panel { padding: 24px 32px 20px; flex-shrink: 0; }\n  .team-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--white); text-transform: uppercase; letter-spacing: 0; margin-bottom: 8px; }\n  .team-summary {\n    font-family: var(--font-mono); font-size: 12px; color: var(--text);\n    display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 12px;\n  }\n  .team-summary .dot-sep { color: var(--muted); }\n  .team-summary .ok { color: var(--green); }\n  .team-summary .warn { color: var(--muted); }\n  .team-urls { display: flex; gap: 14px; flex-wrap: wrap; }\n  .url-link { font-size: 11px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 4px; }\n  .url-link:hover { color: var(--accent); }\n\n  \u002F* \u2500\u2500 Tab nav \u2500\u2500 *\u002F\n  .main-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 32px; background: var(--card); flex-shrink: 0; }\n  .main-tab {\n    font-family: var(--font-mono);\n    padding: 12px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;\n    text-transform: uppercase; color: var(--muted); cursor: pointer;\n    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;\n  }\n  .main-tab.active { color: var(--white); border-bottom-color: var(--red); }\n  .main-tab:hover:not(.active) { color: var(--text); }\n\n  \u002F* \u2500\u2500 Main content area \u2500\u2500 *\u002F\n  .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; }\n  .main-pane { display: none; padding: 24px 32px; }\n  .main-pane.active { display: block; }\n\n  \u002F* \u2500\u2500 Run Panel \u2500\u2500 *\u002F\n  .run-section { margin-bottom: 24px; }\n  .section-label {\n    font-family: var(--font-mono);\n    font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;\n    color: var(--accent); font-weight: 500; margin-bottom: 10px;\n  }\n\n  \u002F* \u2500\u2500 Options grid \u2500\u2500 *\u002F\n  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }\n  .opt-group { display: flex; flex-direction: column; gap: 4px; }\n  .opt-group label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }\n  .opt-input {\n    background: var(--navy); border: 1px solid var(--border); color: var(--text);\n    padding: 7px 10px; border-radius: 5px; font-size: 12px; font-family: inherit;\n    transition: border-color 0.15s;\n  }\n  .opt-input:focus { outline: none; border-color: var(--red); }\n  \u002F* Native date\u002Ftime inputs render their calendar\u002Fclock icon black by\n     default, which disappears against the dark field. Setting color-scheme\n     to dark tells the browser to draw its own native controls (including\n     that icon) in a light color to match \u2014 this alone is enough; do NOT\n     also add a CSS filter on ::-webkit-calendar-picker-indicator, since that\n     would invert the icon a second time and flip it back to dark. *\u002F\n  .opt-input[type=\"date\"], .opt-input[type=\"time\"] { color-scheme: dark; }\n  .opt-select {\n    background: var(--navy); border: 1px solid var(--border); color: var(--text);\n    padding: 7px 10px; border-radius: 5px; font-size: 12px; font-family: inherit;\n    cursor: pointer; transition: border-color 0.15s;\n  }\n  .opt-select:focus { outline: none; border-color: var(--red); }\n\n  .obs-group { margin-bottom: 10px; }\n  .obs-group label { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }\n  .obs-textarea {\n    width: 100%; background: var(--navy); border: 1px solid var(--border); color: var(--text);\n    padding: 8px 10px; border-radius: 5px; font-size: 12px; font-family: inherit;\n    resize: vertical; min-height: 72px; transition: border-color 0.15s;\n  }\n  .obs-textarea:focus { outline: none; border-color: var(--red); }\n  .obs-textarea::placeholder { color: var(--muted); }\n\n  \u002F* \u2500\u2500 Action buttons \u2500\u2500 *\u002F\n  .actions { display: flex; gap: 8px; padding-bottom: 12px; flex-wrap: wrap; align-items: center; }\n  .actions-hierarchy { align-items: center; }\n  .actions-divider { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }\n  .btn {\n    padding: 9px 16px; border-radius: 6px; border: none; cursor: pointer;\n    font-family: var(--font-mono);\n    font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\n    transition: all 0.15s; display: flex; align-items: center; gap: 5px;\n  }\n  .btn:disabled { opacity: 0.35; cursor: not-allowed; }\n  .btn-primary  { background: var(--red); color: #fff; }\n  .btn-primary:hover:not(:disabled)  { background: var(--red-hover); }\n  .btn-secondary { background: rgba(200,168,75,0.14); color: var(--accent); }\n  .btn-secondary:hover:not(:disabled) { background: rgba(200,168,75,0.24); }\n  .btn-utility  { background: transparent; color: var(--muted); padding: 8px 12px; font-size: 11px; }\n  .btn-utility:hover:not(:disabled)  { color: var(--text); background: rgba(255,255,255,0.05); }\n  .btn-outline  { background: transparent; border: 1px solid var(--border); color: var(--text); }\n  .btn-outline:hover:not(:disabled)  { border-color: var(--accent); color: var(--accent); }\n  .btn-danger   { background: transparent; border: 1px solid rgba(192,57,43,0.4); color: #e74c3c; }\n  .btn-danger:hover:not(:disabled)   { background: rgba(192,57,43,0.1); }\n  .btn-scout    { background: rgba(39,174,96,0.12); border: 1px solid rgba(39,174,96,0.3); color: var(--green); }\n  .btn-scout:hover:not(:disabled)    { background: rgba(39,174,96,0.2); }\n  .btn-matchup  { background: rgba(200,168,75,0.12); border: 1px solid rgba(200,168,75,0.3); color: var(--accent); }\n  .btn-matchup:hover:not(:disabled)  { background: rgba(200,168,75,0.2); }\n\n  \u002F* \u2500\u2500 Dropdown menus (team kebab + pipeline \"More\") \u2500\u2500 *\u002F\n  .dropdown-wrap { position: relative; }\n  .dropdown-menu {\n    display: none; position: absolute; top: calc(100% + 4px); right: 0; z-index: 20;\n    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px;\n    padding: 5px; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);\n  }\n  .dropdown-menu.open { display: flex; flex-direction: column; gap: 1px; }\n  .dropdown-item {\n    background: none; border: none; color: var(--text); text-align: left;\n    font-size: 12px; font-family: var(--font-body); padding: 7px 10px; border-radius: 5px; cursor: pointer;\n  }\n  .dropdown-item:hover { background: rgba(255,255,255,0.06); }\n  .dropdown-item.danger { color: #ff8a80; }\n  .dropdown-item.danger:hover { background: rgba(192,57,43,0.12); }\n\n  \u002F* \u2500\u2500 Job log \u2500\u2500 *\u002F\n  .log-container {\n    background: #0a1320; border-radius: 8px;\n    padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.6;\n    height: 260px; overflow-y: auto; color: #a8c0d8; margin-top: 10px;\n  }\n  .log-line { margin: 0; white-space: pre-wrap; word-break: break-all; }\n  .log-line.success { color: #2ecc71; }\n  .log-line.error   { color: #e74c3c; }\n  .log-line.heading { color: var(--accent); font-weight: bold; }\n  .log-empty { color: var(--muted); font-style: italic; }\n\n  .job-log-bar {\n    display: flex; align-items: center; gap: 10px; font-size: 12px;\n    background: var(--card); border-radius: 8px; padding: 10px 14px;\n  }\n  .job-log-drawer { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }\n  .job-log-drawer.open { max-height: 320px; }\n  .status-pill {\n    padding: 2px 10px; border-radius: 12px; font-size: 11px;\n    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;\n  }\n  .status-running { background: rgba(200,168,75,0.2); color: var(--accent); }\n  .status-done    { background: rgba(39,174,96,0.2);  color: var(--green); }\n  .status-failed  { background: rgba(192,57,43,0.2);  color: #e74c3c; }\n  .status-idle    { background: rgba(138,155,176,0.1); color: var(--muted); }\n  .spinner {\n    width: 11px; height: 11px; border: 2px solid rgba(200,168,75,0.3);\n    border-top-color: var(--accent); border-radius: 50%;\n    animation: spin 0.8s linear infinite; display: inline-block;\n  }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n\n  .team-row-main { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }\n  .team-actions { position: relative; }\n  .team-kebab-btn {\n    border:none; background:transparent; color:var(--muted);\n    border-radius:4px; width:22px; height:20px; font-size:14px; cursor:pointer; line-height:1;\n    opacity: .6; transition: all 0.15s;\n  }\n  .team-item:hover .team-kebab-btn { opacity: 1; }\n  .team-kebab-btn:hover { color: var(--accent); background: rgba(255,255,255,0.06); }\n  .stop-job-btn { display:none!important; margin-left:auto; border-color:var(--red)!important; color:#ff8a80!important; }\n\n  \u002F* \u2500\u2500 Reports list \u2500\u2500 *\u002F\n  .reports-list { display: flex; flex-direction: column; gap: 8px; }\n  .report-item {\n    display: flex; align-items: center; gap: 10px;\n    background: var(--card); border-radius: 8px; padding: 11px 14px;\n  }\n  .report-icon { font-size: 18px; }\n  .report-name { font-size: 12px; font-weight: 600; color: var(--text); }\n  .report-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }\n  .report-dl {\n    margin-left: auto; background: var(--red); color: #fff;\n    border: none; padding: 6px 13px; border-radius: 5px; font-size: 11px;\n    font-family: var(--font-mono);\n    font-weight: 600; cursor: pointer; text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase;\n  }\n  .report-dl:hover { background: var(--red-hover); }\n\n  \u002F* \u2500\u2500 Games list \u2500\u2500 *\u002F\n  .games-list { display: flex; flex-direction: column; gap: 6px; }\n  .game-row {\n    display: flex; align-items: center; gap: 10px;\n    background: var(--card);\n    border-radius: 8px; padding: 9px 14px; font-size: 12px;\n  }\n  .game-date { color: var(--muted); font-family: var(--font-mono); font-size: 11px; min-width: 88px; }\n  .game-opp  { flex: 1; font-weight: 600; color: var(--text); }\n  .game-result {\n    font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.04em;\n  }\n  .game-result.W { background: rgba(39,174,96,0.15); color: var(--green); }\n  .game-result.L { background: rgba(192,57,43,0.15); color: #e74c3c; }\n  .game-result.T { background: rgba(138,155,176,0.1); color: var(--muted); }\n  .game-score { color: var(--muted); font-family: var(--font-mono); font-size: 11px; min-width: 50px; text-align: right; }\n  .game-link { color: var(--muted); font-size: 11px; text-decoration: none; }\n  .game-link:hover { color: var(--accent); }\n\n  \u002F* \u2500\u2500 Matchup panel \u2500\u2500 *\u002F\n  .matchup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }\n  .matchup-team-box {\n    background: var(--card); border-radius: 8px; padding: 14px;\n  }\n  .matchup-team-box label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }\n  .team-select-wrap { position: relative; }\n  .team-select-wrap select {\n    width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);\n    padding: 8px 10px; border-radius: 5px; font-size: 12px; font-family: inherit;\n    cursor: pointer; appearance: none;\n  }\n  .team-select-wrap select:focus { outline: none; border-color: var(--accent); }\n\n  .divider { ; }\n  .login-card {\n    background: var(--card); border: 1px solid var(--border);\n    border-radius: 10px; padding: 36px 32px; width: 380px; max-width: 92vw;\n  }\n  .login-logo {\n    font-family: var(--font-wordmark); font-size: 34px; font-weight: 400; letter-spacing: 0.06em;\n    color: var(--white); text-transform: uppercase; margin-bottom: 6px;\n  }\n  .login-logo span { color: var(--accent); }\n  .login-sub {\n    font-family: var(--font-mono);\n    font-size: 11px; color: var(--muted); letter-spacing: 0.12em;\n    text-transform: uppercase; margin-bottom: 28px;\n  }\n  .login-field { margin-bottom: 14px; }\n  .login-field label {\n    display: block; font-size: 10px; color: var(--muted);\n    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 5px;\n  }\n  .login-field input {\n    width: 100%; background: var(--navy); border: 1px solid var(--border);\n    color: var(--text); padding: 9px 12px; border-radius: 5px;\n    font-size: 13px; font-family: inherit; transition: border-color 0.15s;\n  }\n  .login-field input:focus { outline: none; border-color: var(--red); }\n  .login-btn {\n    width: 100%; background: var(--red); color: #fff;\n    border: none; padding: 11px; border-radius: 6px; font-size: 12px;\n    font-family: var(--font-mono);\n    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;\n    cursor: pointer; margin-top: 8px; transition: background 0.15s;\n  }\n  .login-btn:hover { background: var(--red-hover); }\n  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n  .login-error {\n    color: #e74c3c; font-size: 12px; margin-top: 12px;\n    display: none; text-align: center;\n  }\n\n  \u002F* \u2500\u2500 User badge in header \u2500\u2500 *\u002F\n  .user-badge {\n    display: flex; align-items: center; gap: 8px;\n    font-size: 12px; color: var(--muted);\n  }\n  .logout-btn {\n    background: none; border: 1px solid var(--border); color: var(--muted);\n    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;\n    transition: all 0.15s;\n  }\n  .logout-btn:hover { border-color: #e74c3c; color: #e74c3c; }\n\n  \u002F* \u2500\u2500 Self-scout note \u2500\u2500 *\u002F\n  .mode-notice {\n    background: rgba(39,174,96,0.08); border: 1px solid rgba(39,174,96,0.2);\n    border-radius: 5px; padding: 8px 12px; font-size: 11px; color: var(--green);\n    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;\n  }\n  .mode-notice.matchup-notice {\n    background: rgba(200,168,75,0.08); border-color: rgba(200,168,75,0.2); color: var(--accent);\n  }\n\n  .login-idol { width:72px; height:72px; object-fit:contain; display:block; order:2; flex-shrink:0; }\n  .login-head { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:26px; }\n  .login-head-text { order:1; }\n  .login-head-text .login-sub { margin-bottom:0; }\n  .empty-icon { line-height:0; margin-bottom:12px; color:var(--muted); }\n  .empty-icon svg { display:inline-block; }\n  .report-icon { color:var(--accent); display:inline-flex; align-items:center; }\n  .refresh-btn { display:inline-flex; align-items:center; gap:5px; }\n  .game-link { display:inline-flex; align-items:center; gap:4px; }\n  .url-link svg, .btn svg, .mode-notice svg { flex-shrink:0; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- \u2500\u2500 Login Screen \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"loginScreen\">\n  <div class=\"login-card\">\n    <div class=\"login-head\">\n    <img class=\"login-idol\" src=\"data:image\u002Fpng;base64,iVBORw0KGgoAAAANSUhEUgAAAN0AAAEACAYAAAA3E3NfAAAQAElEQVR4Aex9BaBVRdf2s\u002Fa5xaW7Q7FFEFSw87U7sQVbGqRBSlFSQkBCQgwUAwO7sFtREFQUCenuW2fv\u002F3 ed);text-decoration:underline\">New here? Create an account<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"login-error\" id=\"loginError\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 Forgot Password \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"forgotScreen\" style=\"display:none;position:fixed;inset:0;background:var(--navy);align-items:center;justify-content:center;z-index:200\">\n  <div class=\"login-card\">\n    <div class=\"login-head\">\n      <div class=\"login-sub\">Reset your password<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:12px;color:var(--muted);margin:0 0 14px\">Enter your account email and we'll send you a link to reset your password.<\u002Fp>\n    <div class=\"login-field\">\n      <label>Email<\u002Flabel>\n      <input id=\"forgotEmail\" type=\"email\" placeholder=\"coach@yourclub.com\" autocomplete=\"username\" onkeydown=\"if(event.key==='Enter')submitForgotPassword()\">\n    <\u002Fdiv>\n    <button class=\"login-btn\" id=\"forgotBtn\" onclick=\"submitForgotPassword()\">Send Reset Link<\u002Fbutton>\n    <div style=\"text-align:center;margin-top:10px\">\n      <a href=\"#\" onclick=\"showLogin();return false\" style=\"font-size:12px;color:var(--muted);text-decoration:underline\">Back to sign in<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"login-error\" id=\"forgotError\"><\u002Fdiv>\n    <div class=\"login-error\" id=\"forgotSuccess\" style=\"color:#2ecc71;display:none\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 Set New Password (via emailed reset link) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"resetPasswordScreen\" style=\"display:none;position:fixed;inset:0;background:var(--navy);align-items:center;justify-content:center;z-index:200\">\n  <div class=\"login-card\">\n    <div class=\"login-head\">\n      <div class=\"login-sub\">Set a new password<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"login-field\">\n      <label>New Password<\u002Flabel>\n      <input id=\"resetNewPassword\" type=\"password\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" autocomplete=\"new-password\" onkeydown=\"if(event.key==='Enter')document.getElementById('resetConfirmPassword').focus()\">\n    <\u002Fdiv>\n    <div class=\"login-field\">\n      <label>Confirm Password<\u002Flabel>\n      <input id=\"resetConfirmPassword\" type=\"password\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" autocomplete=\"new-password\" onkeydown=\"if(event.key==='Enter')submitResetPassword()\">\n    <\u002Fdiv>\n    <button class=\"login-btn\" id=\"resetBtn\" onclick=\"submitResetPassword()\">Set New Password<\u002Fbutton>\n    <div class=\"login-error\" id=\"resetError\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 Sign Up (create org + admin user) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"signupScreen\" style=\"display:none;position:fixed;inset:0;background:var(--navy);align-items:center;justify-content:center;z-index:200;overflow-y:auto\">\n  <div class=\"login-card\" style=\"margin:24px 0\">\n    <div class=\"login-head\">\n      <div class=\"login-sub\">Create your account<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"login-field\">\n      <label>Organization \u002F Team Name<\u002Flabel>\n      <input id=\"signupOrgName\" type=\"text\" placeholder=\"e.g. James Clemens Baseball\" autocomplete=\"organization\">\n    <\u002Fdiv>\n    <div class=\"login-field\">\n      <label>Email<\u002Flabel>\n      <input id=\"signupEmail\" type=\"email\" placeholder=\"coach@yourclub.com\" autocomplete=\"username\">\n    <\u002Fdiv>\n    <div class=\"login-field\">\n      <label>Password<\u002Flabel>\n      <input id=\"signupPassword\" type=\"password\" placeholder=\"At least 8 characters\" autocomplete=\"new-password\">\n    <\u002Fdiv>\n    <div class=\"login-field\">\n      <label>Plan<\u002Flabel>\n      <select id=\"signupTier\" onchange=\"updateSignupIntervalVisibility()\" style=\"width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:13px;font-family:inherit\">\n        <option value=\"free\">Free \u2014 $0<\u002Foption>\n        <option value=\"coach\">Coach \u2014 $49\u002Fmo or $490\u002Fyr<\u002Foption>\n        <option value=\"organization\">Organization \u2014 $199\u002Fmo or $1990\u002Fyr<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"login-field\" id=\"signupIntervalField\" style=\"display:none\">\n      <label>Billing<\u002Flabel>\n      <select id=\"signupInterval\" style=\"width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:13px;font-family:inherit\">\n        <option value=\"month\">Monthly<\u002Foption>\n        <option value=\"year\">Yearly (2 months free)<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <button class=\"login-btn\" id=\"signupBtn\" onclick=\"submitSignup()\">Create Account<\u002Fbutton>\n    <div style=\"text-align:center;margin-top:10px\">\n      <a href=\"#\" onclick=\"showLogin();return false\" style=\"font-size:12px;color:var(--muted);text-decoration:underline\">Already have an account? Sign in<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"login-error\" id=\"signupError\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<header>\n  <div style=\"display:flex;align-items:center;gap:11px\"><img src=\"data:image\u002Fpng;base64,iVBORw0KGgo -radius:8px;padding:24px;width:500px;max-width:92vw\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\">Edit Opponent<\u002Fdiv>\n    <input id=\"editTeamId\" type=\"hidden\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div>\n        <div style=\"font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;letter-spacing:.06em\">Team Name *<\u002Fdiv>\n        <input id=\"editName\" style=\"width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:13px;font-family:inherit\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;letter-spacing:.06em\">Opponent's Games URL<\u002Fdiv>\n        <input id=\"editGcUrl\" style=\"width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;font-family:inherit\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;letter-spacing:.06em\">Opponent's Players URL<\u002Fdiv>\n        <input id=\"editPgUrl\" style=\"width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;font-family:inherit\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"editTeamError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitEditTeam()\">Save Changes<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideEditTeam()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 Add\u002FEdit Player Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\  \u002F Throws R<\u002Foption>\n            <option value=\"S\u002FL\">Bats Switch \u002F Throws L<\u002Foption>\n            <option value=\"R\u002FL\">Bats R \u002F Throws L<\u002Foption>\n            <option value=\"L\u002FR\">Bats L \u002F Throws R<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Positions<\u002Flabel>\n        <input class=\"opt-input\" id=\"playerPositions\" placeholder=\"e.g. SS, 2B\">\n      <\u002Fdiv>\n      <label style=\"display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n        <input type=\"checkbox\" id=\"playerIsPickup\" style=\"width:14px;height:14px;accent-color:var(--accent)\">\n        Pickup player\n      <\u002Flabel>\n\n      <div class=\"opt-group\">\n        <label>Availability<\u002Flabel>\n        <div style=\"display:flex;flex-direction:column;gap:8px;background:var(--navy);border:1px solid var(--border);border-radius:4px;padding:10px\">\n          <label style=\"display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n            <input type=\"radio\" name=\"playerAvailability\" value=\"available\" onchange=\"onPlayerAvailabilityChange()\" style=\"accent-color:var(--accent)\">\n            Available\n          <\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n            <input type=\"radio\" name=\"playerAvailability\" value=\"unavailable\" onchange=\"onPlayerAvailabilityChange()\" style=\"accent-color:var(--accent)\">\n            Unavailable until\n          <\u002Flabel>\n          <div id=\"playerUnavailableUntilWrap\" style=\"display:none;margin-left:22px\">\n            <input class=\"opt-input\" type=\"date\" id=\"playerUnavailableUntil\">\n          <\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n            <input type=\"radio\" name=\"playerAvailability\" value=\"injured\" onchange=\"onPlayerAvailabilityChange()\" style=\"accent-color:var(--accent)\">\n            Injured\n          <\u002Flabel>\n          <div id=\"playerInjuryReturnWrap\" style=\"display:none;margin-left:22px\">\n            <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px\">Expected return date (leave blank for TBD)<\u002Flabel>\n            <input class=\"opt-input\" type=\"date\" id=\"playerInjuryReturnDate\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"playerModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitPlayer()\">Save Player<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hidePlayerModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"oppPlayerModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\" id=\"oppPlayerModalTitle\">Add Opponent Player<\u002Fdiv>\n    <input id=\"oppPlayerId\" type=\"hidden\">\n    <input id=\"oppPlayerMembershipId\" type=\"hidden\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;gap:10px\">\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label>First Name *<\u002Flabel>\n          <input class=\"opt-input\" id=\"oppPlayerFirstName\" placeholder=\"e.g. Jake\">\n        <\u002Fdiv>\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label>Last Name *<\u002Flabel>\n          <input class=\"opt-input\" id=\"oppPlayerLastName\" placeholder=\"e.g. Thompson\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label>Jersey Number<\u002Flabel>\n          <input class=\"opt-input\" id=\"oppPlayerJersey\" placeholder=\"e.g. 12\">\n          <p style=\"color:var(--muted);font-size:11px;margin:4px 0 0\">Jersey numbers can change between games and seasons -- this player's identity never depends on it.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label>Class \u002F Grad Year<\u002Flabel>\n          <input class=\"opt-input\" id=\"oppPlayerClassYear\" placeholder=\"e.g. 2027\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label>Bats<\u002Flabel>\n          <select class=\"opt-select\" id=\"oppPlayerBats\">\n            <option value=\"\">Unknown<\u002Foption>\n            <option value=\"L\">Left<\u002Foption>\n            <option value=\"R\">Right<\u002Foption>\n            <option value=\"S\">Switch<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label>Throws<\u002Flabel>\n          <select class=\"opt-select\" id=\"oppPlayerThrows\">\n            <option value=\"\">Unknown<\u002Foption>\n            <option value=\"L\">Left<\u002Foption>\n            <option value=\"R\">Right<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Positions<\u002Flabel>\n        <input class=\"opt-input\" id=\"oppPlayerPositions\" placeholder=\"e.g. SS, 2B\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label>Status<\u002Flabel>\n        <select class=\"opt-select\" id=\"oppPlayerStatus\">\n          <option value=\"active\">Active<\u002Foption>\n          <option value=\"graduated\">Graduated<\u002Foption>\n          <option value=\"transferred\">Transferred<\u002Foption>\n          <option value=\"not_participating\">Not Participating<\u002Foption>\n          <option value=\"other_non_returning\">Other \u002F Non-Returning<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"oppPlayerModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitOpponentPlayer()\">Save Player<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideOpponentPlayerModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"oppMergeModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\">Merge Duplicate Player<\u002Fdiv>\n    <input id=\"oppMergeDuplicateId\" type=\"hidden\">\n    <p style=\"font-size:13px;margin:0 0 12px\">Merging combines two player records that are really the same person. The duplicate player's roster history and scouting notes move to the player you keep, then the duplicate is permanently deleted.<\u002Fp>\n    <div class=\"opt-group\">\n      <label>Duplicate player (will be deleted)<\u002Flabel>\n      <input class=\"opt-input\" id=\"oppMergeDuplicateName\" disabled>\n    <\u002Fdiv>\n    <div class=\"opt-group\">\n      <label>Keep this player (survives the merge)<\u002Flabel>\n      <select class=\"opt-select\" id=\"oppMergeKeepSelect\" onchange=\"loadMergeImpactPreview()\"><\u002Fselect>\n    <\u002Fdiv>\n    <div id=\"oppMergeImpactPreview\" style=\"margin-top:8px;font-size:13px\"><\u002Fdiv>\n    <div id=\"oppMergeModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" id=\"oppMergeConfirmBtn\" disabled onclick=\"submitMergeOpponentPlayer()\">Merge Players<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideMergeOpponentPlayerModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"oppNoteEditModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\">Edit Note<\u002Fdiv>\n    <input id=\"oppNoteEditId\" type=\"hidden\">\n    <div class=\"opt-group\">\n      <label>Note text *<\u002Flabel>\n      <textarea class=\"opt-input\" id=\"oppNoteEditText\" rows=\"4\" maxlength=\"4000\" style=\"width:100%;resize:vertical\"><\u002Ftextarea>\n    <\u002Fdiv>\n    <div class=\"opt-group\">\n      <label>Category<\u002Flabel>\n      <select class=\"opt-select\" id=\"oppNoteEditCategory\">\n        <option value=\"\">No category<\u002Foption>\n        <option value=\"lineup\">Lineup<\u002Foption>\n        <option value=\"hitting_approach\">Hitting Approach<\u002Foption>\n        <option value=\"pitching\">Pitching<\u002Foption>\n        <option value=\"defense\">Defense<\u002Foption>\n        <option value=\"baserunning\">Baserunning<\u002Foption>\n        <option value=\"tendencies\">Tendencies<\u002Foption>\n        <option value=\"personnel\">Personnel<\u002Foption>\n        <option value=\"injury_availability\">Injury \u002F Availability<\u002Foption>\n        <option value=\"situational\">Situational<\u002Foption>\n        <option value=\"general\">General<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div id=\"oppNoteEditModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitOpponentNoteEdit()\">Save Note<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideOpponentNoteEditModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 High School: Program Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"hsProgramModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:460px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\" id=\"hsProgramModalTitle\">Set Up Program<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"opt-group\">\n        <label for=\"hsProgramName\">Program Name *<\u002Flabel>\n        <input class=\"opt-input\" id=\"hsProgramName\" placeholder=\"e.g. Central High Baseball\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label for=\"hsProgramSchoolName\">School Name<\u002Flabel>\n        <input class=\"opt-input\" id=\"hsProgramSchoolName\" placeholder=\"e.g. Central High School\">\n      <\u002Fdiv>\n      <label id=\"hsProgramActiveWrap\" for=\"hsProgramIsActive\" style=\"display:none;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n        <input type=\"checkbox\" id=\"hsProgramIsActive\" style=\"width:14px;height:14px;accent-color:var(--accent)\">\n        Program is active\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div id=\"hsProgramModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" id=\"hsProgramModalSaveBtn\" onclick=\"submitHsProgram()\">Save Program<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideHsProgramModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 High School: Season Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"hsSeasonModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:460px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\" id=\"hsSeasonModalTitle\">Add Season<\u002Fdiv>\n    <input id=\"hsSeasonId\" type=\"hidden\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"opt-group\">\n        <label for=\"hsSeasonName\">Season Name *<\u002Flabel>\n        <input class=\"opt-input\" id=\"hsSeasonName\" placeholder=\"e.g. Spring 2027\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label for=\"hsSeasonSchoolYear\">School Year *<\u002Flabel>\n        <input class=\"opt-input\" id=\"hsSeasonSchoolYear\" placeholder=\"e.g. 2026-2027\">\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label for=\"hsSeasonStartDate\">Start Date<\u002Flabel>\n          <input class=\"opt-input\" type=\"date\" id=\"hsSeasonStartDate\">\n        <\u002Fdiv>\n        <div class=\"opt-group\" style=\"flex:1\">\n          <label for=\"hsSeasonEndDate\">End Date<\u002Flabel>\n          <input class=\"opt-input\" type=\"date\" id=\"hsSeasonEndDate\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <label for=\"hsSeasonIsCurrent\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n        <input type=\"checkbox\" id=\"hsSeasonIsCurrent\" style=\"width:14px;height:14px;accent-color:var(--accent)\">\n        This is the current season\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div id=\"hsSeasonModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitHsSeason()\">Save Season<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideHsSeasonModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 High School: Team Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<div id=\"hsTeamModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:440px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\" id=\"hsTeamModalTitle\">Add Team<\u002Fdiv>\n    <input id=\"hsTeamId\" type=\"hidden\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"opt-group\">\n        <label for=\"hsTeamName\">Team Name *<\u002Flabel>\n        <input class=\"opt-input\" id=\"hsTeamName\" placeholder=\"e.g. Varsity Baseball\">\n      <\u002Fdiv>\n      <div class=\"opt-group\">\n        <label for=\"hsTeamLevel\">Level *<\u002Flabel>\n        <select class=\"opt-select\" id=\"hsTeamLevel\">\n          <option value=\"varsity\">Varsity<\u002Foption>\n          <option value=\"junior_varsity\">Junior Varsity<\u002Foption>\n          <option value=\"freshman\">Freshman<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <label for=\"hsTeamIsActive\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text)\">\n        <input type=\"checkbox\" id=\"hsTeamIsActive\" checked style=\"width:14px;height:14px;accent-color:var(--accent)\">\n        Team is active\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div id=\"hsTeamModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitHsTeam()\">Save Team<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideHsTeamModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 High School: Player Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2 yle=\"width:14px;height:14px;accent-color:var(--accent)\">\n        Player is active\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div id=\"hsPlayerModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitHsPlayer()\">Save Player<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideHsPlayerModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- \u2500\u2500 High School: Roster Membership Modal (add existing player \u002F edit jersey) \u2500\u2500 -->\n<div id=\"hsRosterMembershipModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center\">\n  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:440px;max-width:92vw;max-height:88vh;overflow-y:auto\">\n    <div style=\"font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px\" id=\"hsRosterModalTitle\">Add Player to Roster<\u002Fdiv>\n    <input id=\"hsRosterMembershipId\" type=\"hidden\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"opt-group\" id=\"hsRosterPlayerSelectWrap\">\n        <label for=\"hsRosterPlayerSelect\">Player *<\u002Flabel>\n        <select class=\"opt-select\" id=\"hsRosterPlayerSelect\"><\u002Fselect>\n      <\u002Fdiv>\n      <div id=\"hsRosterPlayerReadonly\" style=\"display:none;font-size:13px;color:var(--text);font-weight:600\"><\u002Fdiv>\n      <div class=\"opt-group\">\n        <label for=\"hsRosterJerseyNumber\">Jersey Number<\u002Flabel>\n        <input class=\"opt-input\" id=\"hsRosterJerseyNumber\" placeholder=\"e.g. 12\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"hsRosterModalError\" style=\"display:none;color:#ff8a80;font-size:12px;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:18px\">\n      <button class=\"btn btn-primary\" style=\"flex:1\" onclick=\"submitHsRosterMembership()\">Save<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"hideHsRosterMembershipModal()\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n\u002F\u002F \u2500\u2500 Auth \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst AUTH_KEY = 'vs_auth';  \u002F\u002F localStorage key\nconst DESIGN_MODE = false; \u002F\u002F Production: login\u002Fauth enabled. Set true only in Claude Design preview.\n\n\u002F\u002F \u2500\u2500 Mock data (used only when DESIGN_MODE is true) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst MOCK_TEAMS = [\n  {\n    id: 1,\n    team_name: 'VBA National 14U',\n    gc_team_url: 'https:\u002F\u002Fgc.com\u002Fmock-team',\n    pg_team_url: 'https:\u002F\u002Fperfectgame.org\u002Fmock-team',\n    game_count: 12,\n    last_game: '2026-06-21',\n    hasGC: true,\n    hasPG: true,\n    hasGameUrls: true,\n    stats: { wins: 8, losses: 4, plays: 842, batters: 14 }\n  },\n  {\n    id: 2,\n    team_name: 'Birmingham Stars 14U',\n    gc_team_url: 'https:\u002F\u002Fgc.com\u002Fmock-team-2',\n    pg_team_url: null,\n    game_count: 9,\n    last_game: '2026-06-18',\n    hasGC: true,\n    hasPG: false,\n    hasGameUrls: false,\n    stats: { wins: 6, losses: 3, plays: 611, batters: 13 }\n  }\n];\n\nconst MOCK_GAMES = [\n  {\n    id: 101,\n    gc_game_id: 'mock-game-101',\n    gc_game_url: 'https:\u002F\u002Fgc.com\u002Fmock-game',\n    game_date: '2026-06-21',\n    game_time: '4:00 PM',\n    result: 'W',\n    score_us: 7,\n    score_them: 3,\n    opponent_name: 'Excel Blue Wave National',\n    location: 'River Run Park',\n    season_type: 'Summer 2026'\n  },\n  {\n    id: 102,\n    gc_game_id: 'mock-game-102',\n    gc_game_url: 'https:\u002F\u002Fgc.com\u002Fmock-game-2',\n    game_date: '2026-06-18',\n    game_time: '6:30 PM',\n    result: 'L',\n    score_us: 4,\n    score_them: 5,\n    opponent_name: 'USA Prime',\n    location: 'Hoover, AL',\n    season_type: 'Summer 2026'\n  }\n];\n\n\u002F\u002F Toggle this to preview each organization product configuration in\n\u002F\u002F Claude Design preview mode (DESIGN_MODE = true only, never true in\n\u002F\u002F production -- see the DESIGN_MODE declaration above). Mirrors the real\n\u002F\u002F shape GET \u002Fapi\u002Fproduct\u002Fcapabilities returns\n\u002F\u002F (src\u002Fproduct-capabilities.js's resolveOrganizationCapabilities).\nconst MOCK_CUSTOMER_TYPE = 'travel'; \u002F\u002F 'travel' | 'high_school' | 'hybrid' | 'internal'\nconst MOCK_PRODUCT_CAPABILITIES_BY_TYPE = {\n  travel:      { schemaVersion: 1, customerType: 'travel',      primaryProduct: 'travel',      enabledProducts: ['travel'] },\n  high_school: { schemaVersion: 1, customerType: 'high_school', primaryProduct: 'high_school',  enabledProducts: ['high_school'] },\n  hybrid:      { schemaVersion: 1, customerType: 'hybrid',      primaryProduct: 'travel',       enabledProducts: ['travel', 'high_school'] },\n  internal:    { schemaVersion: 1, customerType: 'internal',    primaryProduct: 'high_school',  enabledProducts: ['travel', 'high_school'] },\n};\n\n\u002F\u002F Opponent roster \u002F coach scouting-notes mock data -- used only in\n\u002F\u002F DESIGN_MODE, for team id 2 (Birmingham Stars 14U, an opponent). Shapes\n\u002F\u002F mirror src\u002Fopponent-roster-service.js \u002F src\u002Fcoach-notes-service.js\n\u002F\u002F exactly (see GET \u002Fapi\u002Fopponent-intelligence\u002Fteams\u002F:teamId\u002Froster and\n\u002F\u002F ...\u002Fnotes).\nconst MOCK_OPPONENT_PLAYER_CONFIRMED_ID = 'mock-opp-player-2';\nconst MOCK_OPPONENT_ROSTER = [\n  {\n    id: 'mock-opp-player-1', team_id: 2, first_name: 'Jaylen', last_name: 'Marsh',\n    positions: ['SS', '2B'], bats: 'R', throws: 'R', class_or_grad_year: '2027',\n    status: 'active', record_source: 'gamechanger', confirmed_fields: [],\n    last_observed_at: '2026-07-28T00:00:00Z',\n    membership: { jersey_number: '7', season_label: '2026 Summer' },\n  },\n  {\n    id: MOCK_OPPONENT_PLAYER_CONFIRMED_ID, team_id: 2, first_name: 'Cole', last_name: 'Beringer',\n    positions: ['P'], bats: 'L', throws: 'L', class_or_grad_year: '2026',\n    status: 'active', record_source: 'manual', confirmed_fields: ['first_name', 'last_name', 'bats'],\n    last_observed_at: '2026-07-30T00:00:00Z',\n    membership: { jersey_number: '21', season_label: '2026 Summer' },\n  },\n  {\n    id: 'mock-opp-player-3', team_id: 2, first_name: 'Deshawn', last_name: 'Ortiz',\n    positions: ['OF'], bats: 'S', throws: 'R', class_or_grad_year: '2028',\n    status: 'graduated', record_source: 'gamechanger', confirmed_fields: [],\n    last_observed_at: '2026-06-14T00:00:00Z',\n    membership: { jersey_number: '15', season_label: '2025 Fall' },\n  },\n];\nconst MOCK_OPPONENT_CONFLICTS_BY_PLAYER = {\n  [MOCK_OPPONENT_PLAYER_CONFIRMED_ID]: [\n    { id: 'mock-conflict-1', field_name: 'bats', coach_confirmed_value: 'L', imported_value: 'R', source: 'gamechanger', detected_at: '2026-07-30T00:00:00Z' },\n  ],\n};\nconst MOCK_OPPONENT_NOTES = [\n  {\n    id: 'mock-note-1', author_user_id: 'design-preview-user', opponent_team_id: 2,\n    opponent_player_id: MOCK_OPPONENT_PLAYER_CONFIRMED_ID, game_id: null, observed_game_date: '2026-07-30',\n    note_text: 'Beringer tips his changeup -- glove tilts down a fraction before release. Sit fastball behind in the count.',\n    category: 'pitching', include_in_report: true, is_archived: false,\n    created_at: '2026-07-30T18:00:00Z', updated_at: '2026-07-30T18:00:00Z',\n  },\n  {\n    id: 'mock-note-2', author_user_id: 'design-preview-user', opponent_team_id: 2,\n    opponent_player_id: null, game_id: null, observed_game_date: null,\n    note_text: 'This team runs aggressively on 3-1 counts with two outs. First basemen should anticipate the send.',\n    category: 'tendencies', include_in_report: true, is_archived: false,\n    created_at: '2026-07-25T12:00:00Z', updated_at: '2026-07-29T09:00:00Z',\n  },\n  {\n    id: 'mock-note-3', author_user_id: 'design-preview-user', opponent_team_id: 2,\n    opponent_player_id: 'mock-opp-player-1', game_id: null, observed_game_date: '2026-07-20',\n    note_text: 'Marsh looked banged up sliding into second last game -- worth confirming availability before the next matchup.',\n    category: 'injury_availability', include_in_report: false, is_archived: false,\n    created_at: '2026-07-20T20:00:00Z', updated_at: '2026-07-20T20:00:00Z',\n  },\n];\n\nconst MOCK_REPORTS = [\n  {\n    name: 'VBA_National_14U_Scouting_Report.docx',\n    size: 245760,\n    mtime: Date.now()\n  },\n  {\n    name: 'Birmingham_Stars_14U_Scouting_Report.pdf',\n    size: 389120,\n    mtime: Date.now() - 86400000\n  }\n];\n\nfunction mockApiResponse(url, options = {}) {\n  const path = typeof url === 'string' ? url : String(url);\n\n  if (path === '\u002Fapi\u002Fteams') {\n    return Promise.resolve(new Response(JSON.stringify(MOCK_TEAMS), {\n      status: 200,\n      headers: { 'Content-Type': 'application\u002Fjson' }\n    }));\n  }\n\n  if (\u002F^\\\u002Fapi\\\u002Fteams\\\u002F\\d+\\\u002Fgames\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify(MOCK_GAMES), {\n      status: 200,\n      headers: { 'Content-Type': 'application\u002Fjson' }\n    }));\n  }\n\n  if (\u002F^\\\u002Fapi\\\u002Fteams\\\u002F\\d+\\\u002Fgame-urls\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify([]), {\n      status: 200,\n      headers: { 'Content-Type': 'application\u002Fjson' }\n    }));\n  }\n\n  if (path === '\u002Fapi\u002Freports') {\n    return Promise.resolve(new Response(JSON.stringify(MOCK_REPORTS), {\n      status: 200,\n      headers: { 'Content-Type': 'application\u002Fjson' }\n    }));\n  }\n\n  if (path === '\u002Fapi\u002Fproduct\u002Fcapabilities') {\n    return Promise.resolve(new Response(JSON.stringify(MOCK_PRODUCT_CAPABILITIES_BY_TYPE[MOCK_CUSTOMER_TYPE]), {\n      status: 200,\n      headers: { 'Content-Type': 'application\u002Fjson' }\n    }));\n  }\n\n  \u002F\u002F \u2500\u2500 Opponent roster \u002F coach scouting notes (design-preview only) \u2500\u2500\u2500\u2500\u2500\u2500\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Froster$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({ roster: MOCK_OPPONENT_ROSTER }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Freport-context-preview$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({\n      counts: { rosterIncluded: MOCK_OPPONENT_ROSTER.length, notesIncluded: MOCK_OPPONENT_NOTES.filter(n => n.include_in_report).length },\n      truncated: { rosterOmitted: 0, notesOmitted: 0 },\n    }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fplayers\\\u002F[\\w-]+\\\u002Fconflicts$\u002F.test(path)) {\n    const playerId = path.split('\u002F')[4];\n    return Promise.resolve(new Response(JSON.stringify({ conflicts: MOCK_OPPONENT_CONFLICTS_BY_PLAYER[playerId] || [] }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fconflicts\\\u002F[\\w-]+\\\u002Fresolve$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({ conflict: { resolved_at: new Date().toISOString() } }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Fmerge-preview\\?\u002F.test(path)) {\n    const query = new URLSearchParams(path.split('?')[1] || '');\n    const keepPlayerId = query.get('keepPlayerId');\n    const mergePlayerId = query.get('mergePlayerId');\n    const survivor = MOCK_OPPONENT_ROSTER.find((p) => String(p.id) === String(keepPlayerId));\n    const duplicate = MOCK_OPPONENT_ROSTER.find((p) => String(p.id) === String(mergePlayerId));\n    if (!survivor || !duplicate) {\n      return Promise.resolve(new Response(JSON.stringify({ error: 'Player not found' }), { status: 404, headers: { 'Content-Type': 'application\u002Fjson' } }));\n    }\n    return Promise.resolve(new Response(JSON.stringify({\n      survivor: { id: survivor.id, first_name: survivor.first_name, last_name: survivor.last_name },\n      duplicate: { id: duplicate.id, first_name: duplicate.first_name, last_name: duplicate.last_name },\n      membershipCount: duplicate.membership ? 1 : 0,\n      noteCount: MOCK_OPPONENT_NOTES.filter((n) => String(n.opponent_player_id) === String(mergePlayerId)).length,\n    }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Fmerge$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({ player: MOCK_OPPONENT_ROSTER[0] }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fplayers\\\u002F[\\w-]+\\\u002Fmemberships$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({ membership: { jersey_number: '99' } }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fplayers\\\u002F[\\w-]+$\u002F.test(path) && options.method === 'PATCH') {\n    const body = JSON.parse(options.body || '{}');\n    return Promise.resolve(new Response(JSON.stringify({ player: { ...MOCK_OPPONENT_ROSTER[0], ...body, id: MOCK_OPPONENT_ROSTER[0].id } }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Fplayers$\u002F.test(path)) {\n    const body = JSON.parse(options.body || '{}');\n    return Promise.resolve(new Response(JSON.stringify({ player: { id: 'mock-opp-player-new', team_id: 2, confirmed_fields: [], record_source: 'manual', last_observed_at: null, membership: null, ...body } }), { status: 201, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Fnotes$\u002F.test(path) && options.method === 'POST') {\n    const body = JSON.parse(options.body || '{}');\n    return Promise.resolve(new Response(JSON.stringify({ note: { id: 'mock-note-new', author_user_id: 'design-preview-user', opponent_team_id: 2, include_in_report: true, is_archived: false, created_at: new Date().toISOString(), updated_at: new Date().toISOString(), ...body } }), { status: 201, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fteams\\\u002F\\d+\\\u002Fnotes$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({ notes: MOCK_OPPONENT_NOTES }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fnotes\\\u002F[\\w-]+\\\u002Farchive$\u002F.test(path)) {\n    return Promise.resolve(new Response(JSON.stringify({ note: { is_archived: true } }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fnotes\\\u002F[\\w-]+\\\u002Finclude$\u002F.test(path)) {\n    const body = JSON.parse(options.body || '{}');\n    return Promise.resolve(new Response(JSON.stringify({ note: { include_in_report: body.include } }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n  if (\u002F^\\\u002Fapi\\\u002Fopponent-intelligence\\\u002Fnotes\\\u002F[\\w-]+$\u002F.test(path)) {\n    const body = JSON.parse(options.body || '{}');\n    return Promise.resolve(new Response(JSON.stringify({ note: { ...MOCK_OPPONENT_NOTES[0], ...body } }), { status: 200, headers: { 'Content-Type': 'application\u002Fjson' } }));\n  }\n\n  if (path.includes('\u002Fapi\u002Frun\u002F') || path.includes('\u002Fapi\u002Fjobs\u002F')) {\n    return Promise.resolve(new Response(JSON.stringify({\n      ok: true,\n      jobId: 'design-preview-job',\n      status: 'done',\n      logs: [\n        { t: Date.now(), line: 'Design preview mode: mock job started.' },\n        { t: Date.now(), line: 'Design preview mode: mock job completed.' }\n      ]\n    }), {\n      status: 200,\n      headers: { 'Content-Type': 'application\u002Fjson' }\n    }));\n  }\n\n  return Promise.resolve(new Response(JSON.stringify({ ok: true }), {\n    status: 200,\n    headers: { 'Content-Type': 'application\u002Fjson' }\n  }));\n}\n\nfunction getSession() {\n  try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; }\n}\nfunction saveSession(data) {\n  localStorage.setItem(AUTH_KEY, JSON.stringify(data));\n}\nfunction clearSession() {\n  localStorage.removeItem(AUTH_KEY);\n}\n\n\u002F\u002F Wraps fetch() to automatically attach Authorization header.\n\u002F\u002F If the server returns 401, clears session and shows login.\nasync function apiFetch(url, options = {}) {\n  if (DESIGN_MODE) return mockApiResponse(url, options);\n  const session = getSession();\n  const headers = { 'Content-Type': 'application\u002Fjson', ...(options.headers || {}) };\n  if (session?.accessToken) {\n    headers['Authorization'] = `Bearer ${session.accessToken}`;\n  }\n  const res = await fetch(url, { ...options, headers });\n  if (res.status === 401) {\n    clearSession();\n    showLogin();\n    throw new Error('Session expired \u2014 please sign in again.');\n  }\n  return res;\n}\n\nasync function submitLogin() {\n  const email    = document.getElementById('loginEmail').value.trim();\n  const password = document.getElementById('loginPassword').value;\n  const errEl    = document.getElementById('loginError');\n  const btn      = document.getElementById('loginBtn');\n\n  errEl.style.display = 'none';\n  errEl.style.color = '';\n  if (!email || !password) {\n    errEl.textContent = 'Email and password are required.';\n    errEl.style.display = 'block';\n    return;\n  }\n\n  btn.disabled = true;\n  btn.textContent = 'Signing in...';\n\n  try {\n    const res  = await fetch('\u002Fapi\u002Fauth\u002Flogin', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application\u002Fjson' },\n      body: JSON.stringify({ email, password }),\n    });\n    const data = await res.json();\n    if (!res.ok) {\n      errEl.textContent = data.error || 'Sign in failed.';\n      errEl.style.display = 'block';\n      return;\n    }\n    saveSession(data);\n    showDashboard(data.user);\n    loadProductAndRoute();\n  } catch (err) {\n    errEl.textContent = err.message;\n    errEl.style.display = 'block';\n  } finally {\n    btn.disabled = false;\n    btn.textContent = 'Sign In';\n  }\n}\n\nasync function logout() {\n  if (DESIGN_MODE) {\n    showDashboard({ id: 'design-preview', email: 'design-preview@jobuscout.local' });\n    loadProductAndRoute();\n    return;\n  }\n  const session = getSession();\n  if (session?.accessToken) {\n    try {\n      await fetch('\u002Fapi\u002Fauth\u002Flogout', {\n        method: 'POST',\n        headers: { 'Authorization': `Bearer ${session.accessToken}` },\n      });\n    } catch {}\n  }\n  clearSession();\n  showLogin();\n}\n\nfunction showLogin() {\n  \u002F\u002F TEMP CLAUDE DESIGN BYPASS: never show login while DESIGN_MODE is on.\n  if (DESIGN_MODE) {\n    const loginScreen = document.getElementById('loginScreen');\n    if (loginScreen) loginScreen.classList.add('hidden');\n    showDashboard({ id: 'design-preview', email: 'design-preview@jobuscout.local' });\n    if (!window.__designModeLoadedTeams) {\n      window.__designModeLoadedTeams = true;\n      setTimeout(() => { if (typeof loadProductAndRoute === 'function') loadProductAndRoute(); }, 0);\n    }\n    return;\n  }\n  document.getElementById('loginScreen').classList.remove('hidden');\n  document.getElementById('forgotScreen').style.display = 'none';\n  document.getElementById('resetPasswordScreen').style.display = 'none';\n  document.getElementById('signupScreen').style.display = 'none';\n  document.getElementById('userBadge').style.display = 'none';\n  \u002F\u002F Reset login form\n  const errEl = document.getElementById('loginError');\n  if (errEl) { errEl.style.display = 'none'; }\n  const btn = document.getElementById('loginBtn');\n  if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }\n}\n\n\u002F\u002F \u2500\u2500 Forgot \u002F Reset Password \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction showForgotPassword() {\n  document.getElementById('loginScreen').classList.add('hidden');\n  document.getElementById('resetPasswordScreen').style.display = 'none';\n  document.getElementById('signupScreen').style.display = 'none';\n  document.getElementById('forgotScreen').style.display = 'flex';\n  const errEl = document.getElementById('forgotError');\n  const okEl  = document.getElementById('forgotSuccess');\n  if (errEl) errEl.style.display = 'none';\n
