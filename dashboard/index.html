if (okEl)  okEl.style.display = 'none';\n}\n\nasync function submitForgotPassword() {\n  const email = document.getElementById('forgotEmail').value.trim();\n  const errEl = document.getElementById('forgotError');\n  const okEl  = document.getElementById('forgotSuccess');\n  const btn   = document.getElementById('forgotBtn');\n  errEl.style.display = 'none';\n  okEl.style.display  = 'none';\n  if (!email) { errEl.textContent = 'Email is required.'; errEl.style.display = 'block'; return; }\n\n  btn.disabled = true;\n  btn.textContent = 'Sending...';\n  try {\n    const res  = await fetch('\u002Fapi\u002Fauth\u002Fforgot-password', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application\u002Fjson' },\n      body: JSON.stringify({ email }),\n    });\n    const data = await res.json();\n    if (!res.ok) throw new Error(data.error || 'Failed to send reset link.');\n    okEl.textContent = data.message || 'If an account exists for that email, a reset link has been sent.';\n    okEl.style.display = 'block';\n  } catch (err) {\n    errEl.textContent = err.message;\n    errEl.style.display = 'block';\n  } finally {\n    btn.disabled = false;\n    btn.textContent = 'Send Reset Link';\n  }\n}\n\nlet __resetAccessToken = null;\nfunction showResetPassword(accessToken) {\n  __resetAccessToken = accessToken;\n  document.getElementById('loginScreen').classList.add('hidden');\n  document.getElementById('forgotScreen').style.display = 'none';\n  document.getElementById('signupScreen').style.display = 'none';\n  document.getElementById('resetPasswordScreen').style.display = 'flex';\n}\n\n\u002F\u002F \u2500\u2500 Sign Up \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction showSignup(prefill = {}) {\n  document.getElementById('loginScreen').classList.add('hidden');\n  document.getElementById('forgotScreen').style.display = 'none';\n  document.getElementById('resetPasswordScreen').style.display = 'none';\n  document.getElementById('signupScreen').style.display = 'flex';\n  if (prefill.tier) document.getElementById('signupTier').value = prefill.tier;\n  if (prefill.interval) document.getElementById('signupInterval').value = prefill.interval;\n  updateSignupIntervalVisibility();\n  const errEl = document.getElementById('signupError');\n  if (errEl) errEl.style.display = 'none';\n}\n\nfunction updateSignupIntervalVisibility() {\n  const tier = document.getElementById('signupTier').value;\n  document.getElementById('signupIntervalField').style.display = tier === 'free' ? 'none' : 'block';\n}\n\nasync function submitSignup() {\n  const orgName  = document.getElementById('signupOrgName').value.trim();\n  const email    = document.getElementById('signupEmail').value.trim();\n  const password = document.getElementById('signupPassword').value;\n  const tier     = document.getElementById('signupTier').value;\n  const interval = document.getElementById('signupInterval').value;\n  const errEl    = document.getElementById('signupError');\n  const btn      = document.getElementById('signupBtn');\n\n  errEl.style.display = 'none';\n  if (!orgName || !email || !password) {\n    errEl.textContent = 'Organization name, email, and password are required.';\n    errEl.style.display = 'block';\n    return;\n  }\n\n  btn.disabled = true;\n  btn.textContent = 'Creating account...';\n  try {\n    const res  = await fetch('\u002Fapi\u002Fauth\u002Fsignup', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application\u002Fjson' },\n      body: JSON.stringify({ orgName, email, password, tier, interval }),\n    });\n    const data = await res.json();\n    if (!res.ok) throw new Error(data.error || 'Failed to create account.');\n\n    if (data.checkoutUrl) {\n      saveSession(data);\n      window.location.href = data.checkoutUrl;\n    } else {\n      \u002F\u002F Don't auto-sign the new account in \u2014 land back on the sign-in screen\n      \u002F\u002F with a clear confirmation so it's obvious the account was created\n      \u002F\u002F (previously this jumped straight to the dashboard with no visible\n      \u002F\u002F change, which read as \"nothing happened\" and led to duplicate signups).\n      showLogin();\n      document.getElementById('loginEmail').value = email;\n      const loginErr = document.getElementById('loginError');\n      if (loginErr) {\n        loginErr.style.color = '#2ecc71';\n        loginErr.textContent = 'Account created! Sign in with your new password.';\n        loginErr.style.display = 'block';\n      }\n    }\n  } catch (err) {\n    errEl.textContent = err.message;\n    errEl.style.display = 'block';\n  } finally {\n    btn.disabled = false;\n    btn.textContent = 'Create Account';\n  }\n}\n\nasync function submitResetPassword() {\n  const newPassword     = document.getElementById('resetNewPassword').value;\n  const confirmPassword = document.getElementById('resetConfirmPassword').value;\n  const errEl = document.getElementById('resetError');\n  const btn   = document.getElementById('resetBtn');\n  errEl.style.display = 'none';\n\n  if (!newPassword || newPassword.length < 8) {\n    errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return;\n  }\n  if (newPassword !== confirmPassword) {\n    errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return;\n  }\n\n  btn.disabled = true;\n  btn.textContent = 'Saving...';\n  try {\n    const res  = await fetch('\u002Fapi\u002Fauth\u002Freset-password', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application\u002Fjson' },\n      body: JSON.stringify({ accessToken: __resetAccessToken, newPassword }),\n    });\n    const data = await res.json();\n    if (!res.ok) throw new Error(data.error || 'Failed to reset password.');\n    __resetAccessToken = null;\n    clearSession();\n    showLogin();\n    const loginErr = document.getElementById('loginError');\n    if (loginErr) {\n      loginErr.style.color = '#2ecc71';\n      loginErr.textContent = 'Password updated. Sign in with your new password.';\n      loginErr.style.display = 'block';\n    }\n  } catch (err) {\n    errEl.textContent = err.message;\n    errEl.style.display = 'block';\n  } finally {\n    btn.disabled = false;\n    btn.textContent = 'Set New Password';\n  }\n}\n\nfunction showDashboard(user) {\n  document.getElementById('loginScreen').classList.add('hidden');\n  const badge = document.getElementById('userBadge');\n  const emailEl = document.getElementById('userEmail');\n  if (badge) badge.style.display = 'flex';\n  if (emailEl) emailEl.textContent = user?.email || '';\n  refreshAdminButton();\n  renderSupportSessionBanner();\n}\n\n\u002F\u002F \u2500\u2500 Product resolution (Jobu Scout Travel \u002F Jobu Scout High School) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Client-side mirror of src\u002Fproduct-resolution.js's canonical\n\u002F\u002F resolveActiveProduct algorithm. This file is plain browser JS with no\n\u002F\u002F build step or module loader, so it cannot `require()` that module\n\u002F\u002F directly -- kept in sync deliberately, the same way enabledProducts\n\u002F\u002F derivation already exists in three separate places in this codebase\n\u002F\u002F (see src\u002Fproduct-resolution.js's own header comment for the other two).\n\u002F\u002F\n\u002F\u002F This mirror never makes an authorization decision on its own: the\n\u002F\u002F capabilities object it resolves against always comes from the server\n\u002F\u002F (GET \u002Fapi\u002Fproduct\u002Fcapabilities, itself backed by\n\u002F\u002F src\u002Fproduct-capabilities.js's server-authoritative resolution and\n\u002F\u002F support-session-aware org scoping) -- never from localStorage, a query\n\u002F\u002F parameter, or any other client-controlled source. A URL edit can\n\u002F\u002F therefore only ever narrow what's shown here, never expand it: the real\n\u002F\u002F access boundary remains every \u002Fapi\u002F* route's own requireAuth and\n\u002F\u002F org-scoping, unchanged by anything in this file.\nconst PRODUCTS = {\n  travel:      { routeKey: 'travel',      path: '\u002Ftravel',      label: 'Jobu Scout Travel' },\n  high_school: { routeKey: 'high-school', path: '\u002Fhigh-school', label: 'Jobu Scout High School' },\n};\nconst PRODUCT_KEYS = Object.keys(PRODUCTS);\nconst DEFAULT_PRODUCT = 'travel';\n\nlet productCapabilities = null; \u002F\u002F never persisted to localStorage -- refetched on every load\nlet activeProduct = null;\n\nfunction productForPath(pathname) {\n  if (pathname.indexOf('\u002Fhigh-school') === 0) return 'high_school';\n  if (pathname.indexOf('\u002Ftravel') === 0) return 'travel';\n  return null;\n}\n\n\u002F\u002F Same fail-closed shape as src\u002Fproduct-resolution.js's\n\u002F\u002F resolveActiveProduct: malformed\u002Fmissing capabilities resolve to\n\u002F\u002F Travel-only; a requestedProduct outside the sanitized enabledProducts\n\u002F\u002F list can only fall back to primaryProduct, never expand access.\nfunction resolveActiveProductClient(capabilities, requestedProduct) {\n  const enabledProducts = Array.isArray(capabilities?.enabledProducts)\n    ? capabilities.enabledProducts.filter(p => PRODUCT_KEYS.includes(p))\n    : [];\n  const safeEnabled = enabledProducts.length ? enabledProducts : [DEFAULT_PRODUCT];\n  const safePrimary = PRODUCT_KEYS.includes(capabilities?.primaryProduct) && safeEnabled.includes(capabilities.primaryProduct)\n    ? capabilities.primaryProduct\n    : safeEnabled[0];\n  const resolvedProduct = requestedProduct && PRODUCT_KEYS.includes(requestedProduct) && safeEnabled.includes(requestedProduct)\n    ? requestedProduct\n    : safePrimary;\n  return {\n    activeProduct: resolvedProduct,\n    enabledProducts: safeEnabled,\n    primaryProduct: safePrimary,\n    showSwitcher: safeEnabled.length > 1,\n  };\n}\n\n\u002F\u002F Fetches server-authoritative capabilities, resolves the effective\n\u002F\u002F product against the current URL, normalizes the URL to that product's\n\u002F\u002F canonical path, updates the header\u002Fswitcher chrome, and renders the\n\u002F\u002F correct shell (existing Travel dashboard, or the High School\n\u002F\u002F placeholder). Called in place of a bare loadTeams() everywhere the\n\u002F\u002F dashboard is entered.\nasync function loadProductAndRoute() {\n  let capabilities = null;\n  try {\n    const res = await apiFetch('\u002Fapi\u002Fproduct\u002Fcapabilities');\n    if (res.ok) capabilities = await res.json();\n  } catch (e) {\n    \u002F\u002F apiFetch already redirected to the login screen on a 401. For any\n    \u002F\u002F other failure (network error, 5xx), fall through with capabilities\n    \u002F\u002F left null so resolution below fails safe to Travel-only rather than\n    \u002F\u002F leaving the dashboard stuck without ever rendering anything.\n    console.warn('[product] failed to load capabilities, defaulting to Travel:', e.message);\n  }\n  productCapabilities = capabilities;\n\n  const requestedProduct = productForPath(window.location.pathname);\n  const result = resolveActiveProductClient(capabilities, requestedProduct);\n  activeProduct = result.activeProduct;\n\n  const targetPath = PRODUCTS[activeProduct].path;\n  if (window.location.pathname !== targetPath) {\n    history.replaceState(null, '', targetPath);\n  }\n\n  renderProductChrome(result);\n\n  if (activeProduct === 'high_school') {\n    showHighSchool();\n  } else {\n    await loadTeams();\n  }\n}\n\nfunction renderProductChrome(result) {\n  const headerSub = document.getElementById('headerSub');\n  if (headerSub) headerSub.textContent = PRODUCTS[activeProduct].label;\n\n  \u002F\u002F The sidebar (team list, +Add buttons) is Travel-specific chrome --\n  \u002F\u002F hidden entirely outside Travel, so no Travel-only action is ever\n  \u002F\u002F exposed there.\n  const sidebar = document.getElementById('appSidebar');\n  if (sidebar) sidebar.style.display = activeProduct === 'travel' ? '' : 'none';\n\n  \u002F\u002F .layout is a fixed \"280px 1fr\" CSS grid. A display:none sidebar is\n  \u002F\u002F removed from grid placement entirely (not just visually hidden), so\n  \u002F\u002F with only one grid item left, #mainPanel auto-places into the first\n  \u002F\u002F (280px) track instead of stretching to fill -- collapsing the whole\n  \u002F\u002F High School UI into a 280px sliver. Forcing a single full-width column\n  \u002F\u002F whenever the sidebar is hidden keeps Travel's own two-column layout\n  \u002F\u002F (grid-template-columns is never touched when activeProduct==='travel')\n  \u002F\u002F untouched while fixing every non-Travel product's main panel width.\n  const layout = document.getElementById('appLayout');\n  if (layout) layout.style.gridTemplateColumns = activeProduct === 'travel' ? '' : '1fr';\n\n  const switcher = document.getElementById('productSwitcher');\n  if (!switcher) return;\n  if (!result.showSwitcher) {\n    switcher.style.display = 'none';\n    switcher.innerHTML = '';\n    return;\n  }\n  switcher.style.display = 'flex';\n  switcher.innerHTML = PRODUCT_KEYS.map(key => `\n    <button type=\"button\"\n      class=\"product-switch-btn ${key === activeProduct ? 'active' : ''}\"\n      aria-pressed=\"${key === activeProduct ? 'true' : 'false'}\"\n      aria-label=\"Switch to ${PRODUCTS[key].label}\"\n      onclick=\"switchProduct('${key}')\"><span class=\"psw-full\">${key === 'travel' ? 'Travel' : 'High School'}<\u002Fspan><span class=\"psw-short\">${key === 'travel' ? 'Travel' : 'HS'}<\u002Fspan><\u002Fbutton>\n  `).join('');\n}\n\n\u002F\u002F Client-side navigation only: updates the URL and re-renders. Never\n\u002F\u002F calls the admin product-control endpoint, never writes\n\u002F\u002F organization configuration, never touches localStorage.\nfunction switchProduct(product) {\n  if (!PRODUCT_KEYS.includes(product) || product === activeProduct) return;\n  history.pushState(null, '', PRODUCTS[product].path);\n  loadProductAndRoute();\n}\n\nwindow.addEventListener('popstate', () => {\n  if (getSession()?.accessToken || DESIGN_MODE) loadProductAndRoute();\n});\n\n\u002F\u002F \u2500\u2500 High School: roster management \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Consumes GET\u002FPOST\u002FPATCH \u002Fapi\u002Fhigh-school\u002F{program,seasons,teams,players}\n\u002F\u002F and GET\u002FPOST\u002FPATCH\u002FDELETE \u002Fapi\u002Fhigh-school\u002Fteams\u002F:teamId\u002Froster[\u002F:membershipId]\n\u002F\u002F (see src\u002Fhigh-school-api.js \u002F src\u002Fhigh-school-roster-service.js -- every\n\u002F\u002F field name and enum below is a direct copy of that contract, never\n\u002F\u002F invented). All authorization (entitlement, org scoping, read-only support\n\u002F\u002F sessions) is enforced server-side; the checks in this section (hiding\n\u002F\u002F mutation controls, disabling \"Add to Roster\" for an archived team) are\n\u002F\u002F usability affordances only, never the actual security boundary -- a\n\u002F\u002F rejected write still surfaces the server's own error message via the\n\u002F\u002F same alert()\u002Finline-error paths used for every other failure here.\nlet hsProgram          = null;\nlet hsSeasons          = [];\nlet hsTeams            = [];\nlet hsPlayers          = [];\nlet hsPlayerSearchTerm = '';\nlet hsRoster           = [];\nlet hsActiveTab        = 'program';\nlet hsRosterTeamId     = null;\nlet hsRosterSeasonId   = null;\n\nfunction isHsReadOnly() {\n  return !!getSupportSession();\n}\n\nfunction showHighSchool() {\n  const teamList = document.getElementById('teamList');\n  if (teamList) teamList.innerHTML = '';\n  \u002F\u002F Reset all HS state on every entry (product switch, org switch via a new\n  \u002F\u002F support session, or a fresh page load) so nothing from a previously\n  \u002F\u002F viewed organization can linger in memory and render under a new one.\n  hsProgram = null;\n  hsSeasons = [];\n  hsTeams = [];\n  hsPlayers = [];\n  hsPlayerSearchTerm = '';\n  hsRoster = [];\n  hsActiveTab = 'program';\n  hsRosterTeamId = null;\n  hsRosterSeasonId = null;\n  renderHsShell();\n  loadHsProgram();\n}\n\nfunction renderHsShell() {\n  const readOnlyNote = isHsReadOnly()\n    ? '<span class=\"dot-sep\">\u00b7<\u002Fspan><span style=\"color:var(--muted)\">View only (support session)<\u002Fspan>' : '';\n  document.getElementById('mainPanel').innerHTML = `\n    <div class=\"team-panel\">\n      <div class=\"team-title\">Jobu Scout High School<\u002Fdiv>\n      <div class=\"team-summary\"><span>${hsProgram ? escHtml(hsProgram.name) : 'Program not set up yet'}<\u002Fspan>${readOnlyNote}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"main-tabs\" id=\"hsMainTabs\" style=\"overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0\">\n      <div class=\"main-tab ${hsActiveTab==='program'?'active':''}\" data-hs-tab=\"program\" onclick=\"switchHsTab('program')\" style=\"flex-shrink:0\">Program<\u002Fdiv>\n      <div class=\"main-tab ${hsActiveTab==='seasons'?'active':''}\" data-hs-tab=\"seasons\" onclick=\"switchHsTab('seasons')\" style=\"flex-shrink:0\">Seasons<\u002Fdiv>\n      <div class=\"main-tab ${hsActiveTab==='teams'?'active':''}\"   data-hs-tab=\"teams\"   onclick=\"switchHsTab('teams')\" style=\"flex-shrink:0\">Teams<\u002Fdiv>\n      <div class=\"main-tab ${hsActiveTab==='players'?'active':''}\" data-hs-tab=\"players\" onclick=\"switchHsTab('players')\" style=\"flex-shrink:0\">Players<\u002Fdiv>\n      <div class=\"main-tab ${hsActiveTab==='roster'?'active':''}\"  data-hs-tab=\"roster\"  onclick=\"switchHsTab('roster')\" style=\"flex-shrink:0\">Roster<\u002Fdiv>\n      <div class=\"main-tab ${hsActiveTab==='import'?'active':''}\"  data-hs-tab=\"import\"  onclick=\"switchHsTab('import')\" style=\"flex-shrink:0\">Import &amp; Stats<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"main-content\">\n      <div class=\"main-pane ${hsActiveTab==='program'?'active':''}\" id=\"hs-pane-program\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n      <div class=\"main-pane ${hsActiveTab==='seasons'?'active':''}\" id=\"hs-pane-seasons\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n      <div class=\"main-pane ${hsActiveTab==='teams'?'active':''}\" id=\"hs-pane-teams\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n      <div class=\"main-pane ${hsActiveTab==='players'?'active':''}\" id=\"hs-pane-players\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n      <div class=\"main-pane ${hsActiveTab==='roster'?'active':''}\" id=\"hs-pane-roster\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n      <div class=\"main-pane ${hsActiveTab==='import'?'active':''}\" id=\"hs-pane-import\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\nfunction switchHsTab(tab) {\n  hsActiveTab = tab;\n  document.querySelectorAll('#hsMainTabs .main-tab').forEach(el => {\n    el.classList.toggle('active', el.dataset.hsTab === tab);\n  });\n  document.querySelectorAll('#mainPanel .main-content .main-pane').forEach(el => {\n    el.classList.toggle('active', el.id === `hs-pane-${tab}`);\n  });\n  if (tab === 'program') renderHsProgramPane();\n  if (tab === 'seasons') loadHsSeasons();\n  if (tab === 'teams')   loadHsTeams();\n  if (tab === 'players') loadHsPlayers();\n  if (tab === 'roster')  loadHsRosterTabDeps();\n  if (tab === 'import')  loadHsImportTabDeps();\n}\n\n\u002F\u002F \u2500\u2500 Shared empty\u002Ferror states \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction renderHsRequiresProgram(paneId) {\n  const el = document.getElementById(paneId);\n  if (!el) return;\n  el.innerHTML = `\n    <div class=\"empty empty-hero\">\n      <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M3 21h18\"\u002F><path d=\"M5 21V7l7-4 7 4v14\"\u002F><path d=\"M9 21v-6h6v6\"\u002F><\u002Fsvg><\u002Fdiv>\n      <h3>Set up your program first<\u002Fh3>\n      <p>Seasons, teams, and players are organized under your High School program.<\u002Fp>\n      <button type=\"button\" class=\"btn btn-primary\" style=\"margin-top:16px\" onclick=\"switchHsTab('program')\">Go to Program<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\nfunction renderHsApiError(paneId, message, retryFnName) {\n  const el = document.getElementById(paneId);\n  if (!el) return;\n  el.innerHTML = `\n    <div class=\"empty empty-hero\">\n      <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"13\"\u002F><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"\u002F><\u002Fsvg><\u002Fdiv>\n      <h3>Could not load this<\u002Fh3>\n      <p>${escHtml(message || 'Something went wrong. Please try again.')}<\u002Fp>\n      <button type=\"button\" class=\"btn btn-outline\" style=\"margin-top:16px\" onclick=\"${retryFnName}()\">Retry<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\nfunction renderHsNetworkError(paneId, retryFnName) {\n  renderHsApiError(paneId, 'Check your connection and try again.', retryFnName);\n}\n\n\u002F\u002F \u2500\u2500 Program \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadHsProgram() {\n  try {\n    const res = await apiFetch('\u002Fapi\u002Fhigh-school\u002Fprogram');\n    const data = await res.json();\n    if (!res.ok) { renderHsApiError('hs-pane-program', data.error, 'loadHsProgram'); return; }\n    hsProgram = data.program;\n  } catch (err) {\n    renderHsNetworkError('hs-pane-program', 'loadHsProgram');\n    return;\n  }\n  renderHsProgramHeader();\n  renderHsProgramPane();\n}\n\nfunction renderHsProgramHeader() {\n  const summary = document.querySelector('#mainPanel .team-summary');\n  if (!summary) return;\n  const readOnlyNote = isHsReadOnly()\n    ? '<span class=\"dot-sep\">\u00b7<\u002Fspan><span style=\"color:var(--muted)\">View only (support session)<\u002Fspan>' : '';\n  summary.innerHTML = `<span>${hsProgram ? escHtml(hsProgram.name) : 'Program not set up yet'}<\u002Fspan>${readOnlyNote}`;\n}\n\nfunction renderHsProgramPane() {\n  const el = document.getElementById('hs-pane-program');\n  if (!el) return;\n  const readOnly = isHsReadOnly();\n  if (!hsProgram) {\n    el.innerHTML = `\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M3 21h18\"\u002F><path d=\"M5 21V7l7-4 7 4v14\"\u002F><path d=\"M9 21v-6h6v6\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>No program set up yet<\u002Fh3>\n        <p>Create your High School program before adding seasons, teams, or players.<\u002Fp>\n        ${readOnly ? '' : `<button type=\"button\" class=\"btn btn-primary\" style=\"margin-top:16px\" onclick=\"showHsProgramModal('create')\">Set Up Program<\u002Fbutton>`}\n      <\u002Fdiv>`;\n    return;\n  }\n  el.innerHTML = `\n    <div class=\"section-label\">Program<\u002Fdiv>\n    <div class=\"roster-list\">\n      <div class=\"roster-row\">\n        <span class=\"roster-name\">${escHtml(hsProgram.name)}<\u002Fspan>\n        ${hsProgram.school_name ? `<span class=\"roster-positions\">${escHtml(hsProgram.school_name)}<\u002Fspan>` : ''}\n        <span class=\"badge ${hsProgram.is_active ? 'roster-badge-available' : 'roster-badge-unavailable'}\">${hsProgram.is_active ? 'Active' : 'Inactive'}<\u002Fspan>\n        ${readOnly ? '' : `<span class=\"roster-actions\"><button class=\"btn btn-outline roster-btn-sm\" onclick=\"showHsProgramModal('edit')\">Edit<\u002Fbutton><\u002Fspan>`}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\nfunction showHsProgramModal(mode) {\n  const err = document.getElementById('hsProgramModalError');\n  err.style.display = 'none';\n  document.getElementById('hsProgramName').value = mode === 'edit' && hsProgram ? hsProgram.name : '';\n  document.getElementById('hsProgramSchoolName').value = mode === 'edit' && hsProgram ? (hsProgram.school_name || '') : '';\n  const activeWrap = document.getElementById('hsProgramActiveWrap');\n  if (mode === 'edit') {\n    activeWrap.style.display = 'flex';\n    document.getElementById('hsProgramIsActive').checked = !!(hsProgram && hsProgram.is_active);\n    document.getElementById('hsProgramModalTitle').textContent = 'Edit Program';\n  } else {\n    activeWrap.style.display = 'none';\n    document.getElementById('hsProgramModalTitle').textContent = 'Set Up Program';\n  }\n  document.getElementById('hsProgramModal').dataset.mode = mode;\n  document.getElementById('hsProgramModal').style.display = 'flex';\n  document.getElementById('hsProgramName').focus();\n}\n\nfunction hideHsProgramModal() {\n  document.getElementById('hsProgramModal').style.display = 'none';\n}\n\nasync function submitHsProgram() {\n  const errEl = document.getElementById('hsProgramModalError');\n  errEl.style.display = 'none';\n  const mode = document.getElementById('hsProgramModal').dataset.mode;\n  const name = document.getElementById('hsProgramName').value.trim();\n  if (!name) {\n    errEl.textContent = 'Program name is required.';\n    errEl.style.display = 'block';\n    return;\n  }\n  const schoolName = document.getElementById('hsProgramSchoolName').value.trim();\n  const body = { name, school_name: schoolName || null };\n  if (mode === 'edit') body.is_active = document.getElementById('hsProgramIsActive').checked;\n\n  const btn = document.getElementById('hsProgramModalSaveBtn');\n  btn.disabled = true;\n  try {\n    const res = await apiFetch('\u002Fapi\u002Fhigh-school\u002Fprogram', {\n      method: mode === 'edit' ? 'PATCH' : 'POST',\n      body: JSON.stringify(body),\n    });\n    const data = await res.json();\n    if (!res.ok) {\n      errEl.textContent = data.error || 'Could not save program.';\n      errEl.style.display = 'block';\n      return;\n    }\n    hsProgram = data.program;\n    hideHsProgramModal();\n    renderHsProgramHeader();\n    renderHsProgramPane();\n  } catch (err) {\n    errEl.textContent = 'Network error. Please try again.';\n    errEl.style.display = 'block';\n  } finally {\n    btn.disabled = false;\n  }\n}\n\n\u002F\u002F \u2500\u2500 Seasons \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadHsSeasons() {\n  if (!hsProgram) { renderHsRequiresProgram('hs-pane-seasons'); return; }\n  try {\n    const res = await apiFetch('\u002Fapi\u002Fhigh-school\u002Fseasons');\n    const data = await res.json();\n    if (!res.ok) { renderHsApiError('hs-pane-seasons', data.error, 'loadHsSeasons'); return; }\n    hsSeasons = data.seasons;\n  } catch (err) {\n    renderHsNetworkError('hs-pane-seasons', 'loadHsSeasons');\n    return;\n  }\n  renderHsSeasonsPane();\n}\n\nfunction renderHsSeasonsPane() {\n  const el = document.getElementById('hs-pane-seasons');\n  if (!el) return;\n  const readOnly = isHsReadOnly();\n  const addBtn = readOnly ? '' : `<button class=\"btn btn-primary\" onclick=\"showHsSeasonModal(null)\">Add Season<\u002Fbutton>`;\n  if (!hsSeasons.length) {\n    el.innerHTML = `\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"\u002F><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"\u002F><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"\u002F><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>No seasons yet<\u002Fh3>\n        <p>Add a season to start organizing teams and rosters.<\u002Fp>\n        ${readOnly ? '' : `<div style=\"margin-top:16px\">${addBtn}<\u002Fdiv>`}\n      <\u002Fdiv>`;\n    return;\n  }\n  el.innerHTML = `\n    <div class=\"section-label\" style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span>${hsSeasons.length} season${hsSeasons.length !== 1 ? 's' : ''}<\u002Fspan>\n      ${addBtn}\n    <\u002Fdiv>\n    <div class=\"roster-list\">\n      ${hsSeasons.map(s => `\n        <div class=\"roster-row\">\n          <span class=\"roster-name\">${escHtml(s.name)}<\u002Fspan>\n          <span class=\"roster-jersey\">${escHtml(s.school_year)}<\u002Fspan>\n          ${s.start_date || s.end_date ? `<span class=\"roster-positions\">${s.start_date ? escHtml(s.start_date) : '?'} \u2013 ${s.end_date ? escHtml(s.end_date) : '?'}<\u002Fspan>` : ''}\n          ${s.is_current ? `<span class=\"badge roster-badge-available\">Current<\u002Fspan>` : ''}\n          ${readOnly ? '' : `<span class=\"roster-actions\"><button class=\"btn btn-outline roster-btn-sm\" onclick=\"showHsSeasonModal('${s.id}')\">Edit<\u002Fbutton><\u002Fspan>`}\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>`;\n}\n\nfunction showHsSeasonModal(seasonId) {\n  const err = document.getElementById('hsSeasonModalError');\n  err.style.display = 'none';\n  const season = seasonId ? hsSeasons.find(s => s.id === seasonId) : null;\n  document.getElementById('hsSeasonId').value = seasonId || '';\n  document.getElementById('hsSeasonName').value = season ? season.name : '';\n  document.getElementById('hsSeasonSchoolYear').value = season ? season.school_year : '';\n  document.getElementById('hsSeasonStartDate').value = season ? (season.start_date || '') : '';\n  document.getElementById('hsSeasonEndDate').value = season ? (season.end_date || '') : '';\n  document.getElementById('hsSeasonIsCurrent').checked = season ? !!season.is_current : false;\n  document.getElementById('hsSeasonModalTitle').textContent = season ? 'Edit Season' : 'Add Season';\n  document.getElementById('hsSeasonModal').style.display = 'flex';\n  document.getElementById('hsSeasonName').focus();\n}\n\nfunction hideHsSeasonModal() {\n  document.getElementById('hsSeasonModal').style.display = 'none';\n}\n\nasync function submitHsSeason() {\n  const errEl = document.getElementById('hsSeasonModalError');\n  errEl.style.display = 'none';\n  const name = document.getElementById('hsSeasonName').value.trim();\n  const schoolYear = document.getElementById('hsSeasonSchoolYear').value.trim();\n  if (!name || !schoolYear) {\n    errEl.textContent = 'Season name and school year are required.';\n    errEl.style.display = 'block';\n    return;\n  }\n  const startDate = document.getElementById('hsSeasonStartDate').value || null;\n  const endDate = document.getElementById('hsSeasonEndDate').value || null;\n  if (startDate && endDate && endDate < startDate) {\n    errEl.textContent = 'End date must not be before start date.';\n    errEl.style.display = 'block';\n    return;\n  }\n  const body = {\n    name, school_year: schoolYear,\n    start_date: startDate, end_date: endDate,\n    is_current: document.getElementById('hsSeasonIsCurrent').checked,\n  };\n  const seasonId = document.getElementById('hsSeasonId').value;\n  try {\n    const res = await apiFetch(seasonId ? `\u002Fapi\u002Fhigh-school\u002Fseasons\u002F${seasonId}` : '\u002Fapi\u002Fhigh-school\u002Fseasons', {\n      method: seasonId ? 'PATCH' : 'POST',\n      body: JSON.stringify(body),\n    });\n    const data = await res.json();\n    if (!res.ok) {\n      errEl.textContent = data.error || 'Could not save season.';\n      errEl.style.display = 'block';\n      return;\n    }\n    hideHsSeasonModal();\n    await loadHsSeasons();\n  } catch (err) {\n    errEl.textContent = 'Network error. Please try again.';\n    errEl.style.display = 'block';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Teams \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst HS_TEAM_LEVEL_LABELS = { varsity: 'Varsity', junior_varsity: 'Junior Varsity', freshman: 'Freshman' };\n\nasync function loadHsTeams() {\n  if (!hsProgram) { renderHsRequiresProgram('hs-pane-teams'); return; }\n  try {\n    const res = await apiFetch('\u002Fapi\u002Fhigh-school\u002Fteams');\n    const data = await res.json();\n    if (!res.ok) { renderHsApiError('hs-pane-teams', data.error, 'loadHsTeams'); return; }\n    hsTeams = data.teams;\n  } catch (err) {\n    renderHsNetworkError('hs-pane-teams', 'loadHsTeams');\n    return;\n  }\n  renderHsTeamsPane();\n}\n\nfunction renderHsTeamsPane() {\n  const el = document.getElementById('hs-pane-teams');\n  if (!el) return;\n  const readOnly = isHsReadOnly();\n  const addBtn = readOnly ? '' : `<button class=\"btn btn-primary\" onclick=\"showHsTeamModal(null)\">Add Team<\u002Fbutton>`;\n  if (!hsTeams.length) {\n    el.innerHTML = `\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"9\" cy=\"7\" r=\"4\"\u002F><path d=\"M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>No teams yet<\u002Fh3>\n        <p>Add a team to start building rosters.<\u002Fp>\n        ${readOnly ? '' : `<div style=\"margin-top:16px\">${addBtn}<\u002Fdiv>`}\n      <\u002Fdiv>`;\n    return;\n  }\n  el.innerHTML = `\n    <div class=\"section-label\" style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span>${hsTeams.length} team${hsTeams.length !== 1 ? 's' : ''}<\u002Fspan>\n      ${addBtn}\n    <\u002Fdiv>\n    <div class=\"roster-list\">\n      ${hsTeams.map(t => `\n        <div class=\"roster-row\">\n          <span class=\"roster-name\">${escHtml(t.name)}<\u002Fspan>\n          <span class=\"roster-positions\">${HS_TEAM_LEVEL_LABELS[t.level] || escHtml(t.level)}<\u002Fspan>\n          <span class=\"badge ${t.is_active ? 'roster-badge-available' : 'roster-badge-unavailable'}\">${t.is_active ? 'Active' : 'Archived'}<\u002Fspan>\n          <span class=\"roster-actions\">\n            <button class=\"btn btn-outline roster-btn-sm\" onclick=\"viewHsTeamRoster('${t.id}')\">View Roster<\u002Fbutton>\n            ${readOnly ? '' : `<button class=\"btn btn-outline roster-btn-sm\" onclick=\"showHsTeamModal('${t.id}')\">Edit<\u002Fbutton>`}\n          <\u002Fspan>\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>`;\n}\n\nfunction viewHsTeamRoster(teamId) {\n  hsRosterTeamId = teamId;\n  switchHsTab('roster');\n}\n\nfunction showHsTeamModal(teamId) {\n  const err = document.getElementById('hsTeamModalError');\n  err.style.display = 'none';\n  const team = teamId ? hsTeams.find(t => t.id === teamId) : null;\n  document.getElementById('hsTeamId').value = teamId || '';\n  document.getElementById('hsTeamName').value = team ? team.name : '';\n  document.getElementById('hsTeamLevel').value = team ? team.level : 'varsity';\n  document.getElementById('hsTeamIsActive').checked = team ? !!team.is_active : true;\n  document.getElementById('hsTeamModalTitle').textContent = team ? 'Edit Team' : 'Add Team';\n  document.getElementById('hsTeamModal').style.display = 'flex';\n  document.getElementById('hsTeamName').focus();\n}\n\nfunction hideHsTeamModal() {\n  document.getElementById('hsTeamModal').style.display = 'none';\n}\n\nasync function submitHsTeam() {\n  const errEl = document.getElementById('hsTeamModalError');\n  errEl.style.display = 'none';\n  const name = document.getElementById('hsTeamName').value.trim();\n  if (!name) {\n    errEl.textContent = 'Team name is required.';\n    errEl.style.display = 'block';\n    return;\n  }\n  const body = {\n    name,\n    level: document.getElementById('hsTeamLevel').value,\n    is_active: document.getElementById('hsTeamIsActive').checked,\n  };\n  const teamId = document.getElementById('hsTeamId').value;\n  try {\n    const res = await apiFetch(teamId ? `\u002Fapi\u002Fhigh-school\u002Fteams\u002F${teamId}` : '\u002Fapi\u002Fhigh-school\u002Fteams', {\n      method: teamId ? 'PATCH' : 'POST',\n      body: JSON.stringify(body),\n    });\n    const data = await res.json();\n    if (!res.ok) {\n      errEl.textContent = data.error || 'Could not save team.';\n      errEl.style.display = 'block';\n      return;\n    }\n    hideHsTeamModal();\n    await loadHsTeams();\n  } catch (err) {\n    errEl.textContent = 'Network error. Please try again.';\n    errEl.style.display = 'block';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Players \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadHsPlayers() {\n  if (!hsProgram) { renderHsRequiresProgram('hs-pane-players'); return; }\n  try {\n    const q = hsPlayerSearchTerm.trim();\n    const url = '\u002Fapi\u002Fhigh-school\u002Fplayers' + (q ? `?q=${encodeURIComponent(q)}` : '');\n    const res = await apiFetch(url);\n    const data = await res.json();\n    if (!res.ok) { renderHsApiError('hs-pane-players', data.error, 'loadHsPlayers'); return; }\n    hsPlayers = data.players;\n  } catch (err) {\n    renderHsNetworkError('hs-pane-players', 'loadHsPlayers');\n    return;\n  }\n  renderHsPlayersPane();\n}\n\nfunction renderHsPlayersPane() {\n  const el = document.getElementById('hs-pane-players');\n  if (!el) return;\n  const readOnly = isHsReadOnly();\n  const addBtn = readOnly ? '' : `<button class=\"btn btn-primary\" onclick=\"showHsPlayerModal(null)\">Add Player<\u002Fbutton>`;\n  const searchBar = `\n    <div class=\"actions\">\n      <input class=\"opt-input\" style=\"max-width:260px\" id=\"hsPlayerSearchInput\" placeholder=\"Search players...\" value=\"${escHtml(hsPlayerSearchTerm)}\"\n        aria-label=\"Search players\"\n        onkeydown=\"if(event.key==='Enter'){event.preventDefault();searchHsPlayers();}\">\n      <button class=\"btn btn-outline\" onclick=\"searchHsPlayers()\">Search<\u002Fbutton>\n      ${addBtn}\n    <\u002Fdiv>`;\n  if (!hsPlayers.length) {\n    el.innerHTML = `\n      ${searchBar}\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\"\u002F><path d=\"M4 21v-1a8 8 0 0 1 16 0v1\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>${hsPlayerSearchTerm ? 'No players match your search' : 'No players yet'}<\u002Fh3>\n        <p>${hsPlayerSearchTerm ? 'Try a different name.' : 'Add players to your program directory.'}<\u002Fp>\n      <\u002Fdiv>`;\n    return;\n  }\n  el.innerHTML = `\n    ${searchBar}\n    <div class=\"section-label\">${hsPlayers.length} player${hsPlayers.length !== 1 ? 's' : ''}<\u002Fdiv>\n    <div class=\"roster-list\">\n      ${hsPlayers.map(p => `\n        <div class=\"roster-row\">\n          <span class=\"roster-name\">${escHtml(p.first_name)} ${escHtml(p.last_name)}<\u002Fspan>\n          ${p.preferred_name ? `<span class=\"roster-positions\">\"${escHtml(p.preferred_name)}\"<\u002Fspan>` : ''}\n          ${p.graduation_year ? `<span class=\"roster-jersey\">Class of ${escHtml(String(p.graduation_year))}<\u002Fspan>` : ''}\n          <span class=\"badge ${p.is_active ? 'roster-badge-available' : 'roster-badge-unavailable'}\">${p.is_active ? 'Active' : 'Inactive'}<\u002Fspan>\n          ${readOnly ? '' : `<span class=\"roster-actions\"><button class=\"btn btn-outline roster-btn-sm\" onclick=\"showHsPlayerModal('${p.id}')\">Edit<\u002Fbutton><\u002Fspan>`}\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>`;\n}\n\nfunction searchHsPlayers() {\n  const input = document.getElementById('hsPlayerSearchInput');\n  hsPlayerSearchTerm = input ? input.value : '';\n  loadHsPlayers();\n}\n\nfunction showHsPlayerModal(playerId) {\n  const err = document.getElementById('hsPlayerModalError');\n  err.style.display = 'none';\n  const player = playerId ? hsPlayers.find(p => p.id === playerId) : null;\n  document.getElementById('hsPlayerId').value = playerId || '';\n  document.getElementById('hsPlayerFirstName').value = player ? player.first_name : '';\n  document.getElementById('hsPlayerLastName').value = player ? player.last_name : '';\n  document.getElementById('hsPlayerPreferredName').value = player ? (player.preferred_name || '') : '';\n  document.getElementById('hsPlayerGradYear').value = player && player.graduation_year ? player.graduation_year : '';\n  document.getElementById('hsPlayerIsActive').checked = player ? !!player.is_active : true;\n  document.getElementById('hsPlayerModalTitle').textContent = player ? 'Edit Player' : 'Add Player';\n  document.getElementById('hsPlayerModal').style.display = 'flex';\n  document.getElementById('hsPlayerFirstName').focus();\n}\n\nfunction hideHsPlayerModal() {\n  document.getElementById('hsPlayerModal').style.display = 'none';\n}\n\nasync function submitHsPlayer() {\n  const errEl = document.getElementById('hsPlayerModalError');\n  errEl.style.display = 'none';\n  const firstName = document.getElementById('hsPlayerFirstName').value.trim();\n  const lastName = document.getElementById('hsPlayerLastName').value.trim();\n  if (!firstName || !lastName) {\n    errEl.textContent = 'First and last name are required.';\n    errEl.style.display = 'block';\n    return;\n  }\n  const gradYearRaw = document.getElementById('hsPlayerGradYear').value.trim();\n  let graduationYear = null;\n  if (gradYearRaw) {\n    graduationYear = parseInt(gradYearRaw, 10);\n    if (!Number.isInteger(graduationYear) || graduationYear < 2000) {\n      errEl.textContent = 'Graduation year must be a valid year (2000 or later).';\n      errEl.style.display = 'block';\n      return;\n    }\n  }\n  const body = {\n    first_name: firstName,\n    last_name: lastName,\n    preferred_name: document.getElementById('hsPlayerPreferredName').value.trim() || null,\n    graduation_year: graduationYear,\n    is_active: document.getElementById('hsPlayerIsActive').checked,\n  };\n  const playerId = document.getElementById('hsPlayerId').value;\n  try {\n    const res = await apiFetch(playerId ? `\u002Fapi\u002Fhigh-school\u002Fplayers\u002F${playerId}` : '\u002Fapi\u002Fhigh-school\u002Fplayers', {\n      method: playerId ? 'PATCH' : 'POST',\n      body: JSON.stringify(body),\n    });\n    const data = await res.json();\n    if (!res.ok) {\n      errEl.textContent = data.error || 'Could not save player.';\n      errEl.style.display = 'block';\n      return;\n    }\n    hideHsPlayerModal();\n    await loadHsPlayers();\n  } catch (err) {\n    errEl.textContent = 'Network error. Please try again.';\n    errEl.style.display = 'block';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Roster \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F The roster tab needs the team and season lists regardless of which tab\n\u002F\u002F was visited previously, so it always re-fetches both rather than trusting\n\u002F\u002F whatever loadHsTeams()\u002FloadHsSeasons() happened to leave in memory.\nasync function loadHsRosterTabDeps() {\n  if (!hsProgram) { renderHsRequiresProgram('hs-pane-roster'); return; }\n  const el = document.getElementById('hs-pane-roster');\n  if (el) el.innerHTML = '<p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp>';\n  try {\n    const [teamsRes, seasonsRes] = await Promise.all([\n      apiFetch('\u002Fapi\u002Fhigh-school\u002Fteams'),\n      apiFetch('\u002Fapi\u002Fhigh-school\u002Fseasons'),\n    ]);\n    const teamsData = await teamsRes.json();\n    const seasonsData = await seasonsRes.json();\n    if (!teamsRes.ok) { renderHsApiError('hs-pane-roster', teamsData.error, 'loadHsRosterTabDeps'); return; }\n    if (!seasonsRes.ok) { renderHsApiError('hs-pane-roster', seasonsData.error, 'loadHsRosterTabDeps'); return; }\n    hsTeams = teamsData.teams;\n    hsSeasons = seasonsData.seasons;\n  } catch (err) {\n    renderHsNetworkError('hs-pane-roster', 'loadHsRosterTabDeps');\n    return;\n  }\n  renderHsRosterPane();\n}\n\nfunction renderHsRosterPane() {\n  const el = document.getElementById('hs-pane-roster');\n  if (!el) return;\n  if (!hsTeams.length || !hsSeasons.length) {\n    el.innerHTML = `\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"9\" cy=\"7\" r=\"4\"\u002F><path d=\"M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>Add a team and a season first<\u002Fh3>\n        <p>Rosters are managed per team, per season.<\u002Fp>\n        <div style=\"display:flex;gap:8px;margin-top:16px\">\n          <button class=\"btn btn-outline\" onclick=\"switchHsTab('teams')\">Go to Teams<\u002Fbutton>\n          <button class=\"btn btn-outline\" onclick=\"switchHsTab('seasons')\">Go to Seasons<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    return;\n  }\n  \u002F\u002F Re-validate the current selection every render -- if the previously\n  \u002F\u002F selected team\u002Fseason was archived or deleted elsewhere, fall back\n  \u002F\u002F rather than querying a stale id.\n  if (!hsRosterTeamId || !hsTeams.some(t => t.id === hsRosterTeamId)) {\n    hsRosterTeamId = hsTeams[0].id;\n  }\n  if (!hsRosterSeasonId || !hsSeasons.some(s => s.id === hsRosterSeasonId)) {\n    const current = hsSeasons.find(s => s.is_current);\n    hsRosterSeasonId = current ? current.id : hsSeasons[0].id;\n  }\n  el.innerHTML = `\n    <div class=\"actions\">\n      <div class=\"opt-group\" style=\"min-width:220px\">\n        <label for=\"hsRosterTeamSelect\">Team<\u002Flabel>\n        <select class=\"opt-select\" id=\"hsRosterTeamSelect\" onchange=\"onHsRosterTeamChange()\">\n          ${hsTeams.map(t => `<option value=\"${t.id}\" ${t.id === hsRosterTeamId ? 'selected' : ''}>${escHtml(t.name)}${t.is_active ? '' : ' (Archived)'}<\u002Foption>`).join('')}\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"opt-group\" style=\"min-width:220px\">\n        <label for=\"hsRosterSeasonSelect\">Season<\u002Flabel>\n        <select class=\"opt-select\" id=\"hsRosterSeasonSelect\" onchange=\"onHsRosterSeasonChange()\">\n          ${hsSeasons.map(s => `<option value=\"${s.id}\" ${s.id === hsRosterSeasonId ? 'selected' : ''}>${escHtml(s.name)}${s.is_current ? ' (Current)' : ''}<\u002Foption>`).join('')}\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"hsRosterListWrap\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading roster...<\u002Fp><\u002Fdiv>\n  `;\n  loadHsRoster();\n}\n\nfunction onHsRosterTeamChange() {\n  hsRosterTeamId = document.getElementById('hsRosterTeamSelect').value;\n  loadHsRoster();\n}\nfunction onHsRosterSeasonChange() {\n  hsRosterSeasonId = document.getElementById('hsRosterSeasonSelect').value;\n  loadHsRoster();\n}\n\nasync function loadHsRoster() {\n  const wrap = document.getElementById('hsRosterListWrap');\n  if (!wrap || !hsRosterTeamId) return;\n  wrap.innerHTML = '<p class=\"log-empty\" style=\"color:var(--muted)\">Loading roster...<\u002Fp>';\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsRosterTeamId}\u002Froster?seasonId=${encodeURIComponent(hsRosterSeasonId)}`);\n    const data = await res.json();\n    if (!res.ok) {\n      wrap.innerHTML = `<div class=\"empty\"><p>${escHtml(data.error || 'Could not load roster.')}<\u002Fp><button class=\"btn btn-outline\" style=\"margin-top:10px\" onclick=\"loadHsRoster()\">Retry<\u002Fbutton><\u002Fdiv>`;\n      return;\n    }\n    hsRoster = data.roster;\n  } catch (err) {\n    wrap.innerHTML = `<div class=\"empty\"><p>Could not load roster. Check your connection and try again.<\u002Fp><button class=\"btn btn-outline\" style=\"margin-top:10px\" onclick=\"loadHsRoster()\">Retry<\u002Fbutton><\u002Fdiv>`;\n    return;\n  }\n  renderHsRosterList();\n}\n\nfunction renderHsRosterList() {\n  const wrap = document.getElementById('hsRosterListWrap');\n  if (!wrap) return;\n  const readOnly = isHsReadOnly();\n  const team = hsTeams.find(t => t.id === hsRosterTeamId);\n  const canAdd = !readOnly && team && team.is_active;\n  const addBtn = canAdd ? `<button class=\"btn btn-primary\" onclick=\"showHsRosterAddModal()\">Add Player to Roster<\u002Fbutton>` : '';\n  const inactiveNote = (!readOnly && team && !team.is_active)\n    ? `<p style=\"color:var(--muted);font-size:12px;margin-top:6px\">This team is archived \u2014 reactivate it under Teams to add roster members.<\u002Fp>` : '';\n\n  if (!hsRoster.length) {\n    wrap.innerHTML = `\n      <div class=\"actions\" style=\"justify-content:flex-end\">${addBtn}<\u002Fdiv>\n      ${inactiveNote}\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><circle cx=\"9\" cy=\"7\" r=\"4\"\u002F><path d=\"M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>No players on this roster yet<\u002Fh3>\n        <p>Add existing players from your directory to this team's roster.<\u002Fp>\n      <\u002Fdiv>`;\n    return;\n  }\n\n  wrap.innerHTML = `\n    <div class=\"section-label\" style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span>${hsRoster.length} roster entr${hsRoster.length !== 1 ? 'ies' : 'y'}<\u002Fspan>\n      ${addBtn}\n    <\u002Fdiv>\n    ${inactiveNote}\n    <div class=\"roster-list\">\n      ${hsRoster.map(m => `\n        <div class=\"roster-row\">\n          <span class=\"roster-name\">${m.player ? escHtml(m.player.first_name) + ' ' + escHtml(m.player.last_name) : 'Unknown player'}<\u002Fspan>\n          ${m.jerseyNumber ? `<span class=\"roster-jersey\">#${escHtml(m.jerseyNumber)}<\u002Fspan>` : ''}\n          ${m.player && m.player.graduation_year ? `<span class=\"roster-positions\">Class of ${escHtml(String(m.player.graduation_year))}<\u002Fspan>` : ''}\n          <span class=\"badge ${m.status === 'active' ? 'roster-badge-available' : 'roster-badge-unavailable'}\">${m.status === 'active' ? 'Active' : 'Removed'}<\u002Fspan>\n          ${readOnly ? '' : `\n          <span class=\"roster-actions\">\n            ${m.status === 'active' ? `\n              <button class=\"btn btn-outline roster-btn-sm\" onclick=\"showHsRosterEditModal('${m.membershipId}')\">Edit<\u002Fbutton>\n              <button class=\"btn btn-outline roster-btn-sm danger\" onclick=\"removeHsRosterMembership('${m.membershipId}')\">Remove<\u002Fbutton>\n            ` : `\n              <button class=\"btn btn-outline roster-btn-sm\" onclick=\"restoreHsRosterMembership('${m.membershipId}')\">Restore<\u002Fbutton>\n            `}\n          <\u002Fspan>`}\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>`;\n}\n\n\u002F\u002F Always re-fetches the player directory when opening, rather than trusting\n\u002F\u002F whatever the Players tab last loaded, so the eligible list is current and\n\u002F\u002F works even if the user never visited the Players tab this session.\nasync function showHsRosterAddModal() {\n  const err = document.getElementById('hsRosterModalError');\n  err.style.display = 'none';\n  document.getElementById('hsRosterMembershipId').value = '';\n  document.getElementById('hsRosterModalTitle').textContent = 'Add Player to Roster';\n  document.getElementById('hsRosterPlayerSelectWrap').style.display = 'flex';\n  document.getElementById('hsRosterPlayerReadonly').style.display = 'none';\n  document.getElementById('hsRosterJerseyNumber').value = '';\n  const select = document.getElementById('hsRosterPlayerSelect');\n  select.innerHTML = '<option value=\"\">Loading players...<\u002Foption>';\n  document.getElementById('hsRosterMembershipModal').style.display = 'flex';\n  select.focus();\n\n  try {\n    const res = await apiFetch('\u002Fapi\u002Fhigh-school\u002Fplayers');\n    const data = await res.json();\n    if (!res.ok) {\n      select.innerHTML = '<option value=\"\">Could not load players<\u002Foption>';\n      err.textContent = data.error || 'Could not load players.';\n      err.style.display = 'block';\n      return;\n    }\n    hsPlayers = data.players;\n  } catch (e) {\n    select.innerHTML = '<option value=\"\">Could not load players<\u002Foption>';\n    err.textContent = 'Network error loading players.';\n    err.style.display = 'block';\n    return;\n  }\n\n  \u002F\u002F Only active players not already on this team+season roster (in any\n  \u002F\u002F status) are offered here -- a player with an inactive membership must\n  \u002F\u002F be restored from the roster list instead of re-added, matching the\n  \u002F\u002F API's own \"restore is PATCH, not a second POST\" contract.\n  const onRosterIds = new Set(hsRoster.map(m => m.player && m.player.id).filter(Boolean));\n  const eligible = hsPlayers.filter(p => p.is_active && !onRosterIds.has(p.id));\n  if (!eligible.length) {\n    select.innerHTML = '<option value=\"\">No eligible players \u2014 add or activate one first<\u002Foption>';\n  } else {\n    select.innerHTML = eligible.map(p => `<option value=\"${p.id}\">${escHtml(p.first_name)} ${escHtml(p.last_name)}<\u002Foption>`).join('');\n  }\n}\n\nfunction showHsRosterEditModal(membershipId) {\n  const membership = hsRoster.find(m => m.membershipId === membershipId);\n  if (!membership) return;\n  const err = document.getElementById('hsRosterModalError');\n  err.style.display = 'none';\n  document.getElementById('hsRosterMembershipId').value = membershipId;\n  document.getElementById('hsRosterModalTitle').textContent = 'Edit Roster Membership';\n  document.getElementById('hsRosterPlayerSelectWrap').style.display = 'none';\n  const readonlyEl = document.getElementById('hsRosterPlayerReadonly');\n  readonlyEl.style.display = 'block';\n  readonlyEl.textContent = membership.player ? `${membership.player.first_name} ${membership.player.last_name}` : 'Player';\n  document.getElementById('hsRosterJerseyNumber').value = membership.jerseyNumber || '';\n  document.getElementById('hsRosterMembershipModal').style.display = 'flex';\n  document.getElementById('hsRosterJerseyNumber').focus();\n}\n\nfunction hideHsRosterMembershipModal() {\n  document.getElementById('hsRosterMembershipModal').style.display = 'none';\n}\n\nasync function submitHsRosterMembership() {\n  const errEl = document.getElementById('hsRosterModalError');\n  errEl.style.display = 'none';\n  const membershipId = document.getElementById('hsRosterMembershipId').value;\n  const jerseyNumber = document.getElementById('hsRosterJerseyNumber').value.trim() || null;\n\n  let url, method, body;\n  if (membershipId) {\n    url = `\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsRosterTeamId}\u002Froster\u002F${membershipId}`;\n    method = 'PATCH';\n    body = { jerseyNumber };\n  } else {\n    const playerId = document.getElementById('hsRosterPlayerSelect').value;\n    if (!playerId) {\n      errEl.textContent = 'Select a player to add.';\n      errEl.style.display = 'block';\n      return;\n    }\n    url = `\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsRosterTeamId}\u002Froster`;\n    method = 'POST';\n    body = { playerId, seasonId: hsRosterSeasonId, jerseyNumber };\n  }\n\n  try {\n    const res = await apiFetch(url, { method, body: JSON.stringify(body) });\n    const data = await res.json();\n    if (!res.ok) {\n      errEl.textContent = data.error || 'Could not save roster membership.';\n      errEl.style.display = 'block';\n      return;\n    }\n    hideHsRosterMembershipModal();\n    await loadHsRoster();\n  } catch (err) {\n    errEl.textContent = 'Network error. Please try again.';\n    errEl.style.display = 'block';\n  }\n}\n\nasync function removeHsRosterMembership(membershipId) {\n  const membership = hsRoster.find(m => m.membershipId === membershipId);\n  const name = membership && membership.player ? `${membership.player.first_name} ${membership.player.last_name}` : 'this player';\n  if (!confirm(`Remove ${name} from the roster?\\n\\nThis hides them from the active roster. You can restore them later.`)) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsRosterTeamId}\u002Froster\u002F${membershipId}`, { method: 'DELETE' });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not remove player from roster.'); return; }\n    await loadHsRoster();\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\nasync function restoreHsRosterMembership(membershipId) {\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsRosterTeamId}\u002Froster\u002F${membershipId}`, {\n      method: 'PATCH', body: JSON.stringify({ status: 'active' }),\n    });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not restore roster membership.'); return; }\n    await loadHsRoster();\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\n\u002F\u002F \u2500\u2500 GameChanger Import & Stats \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Consumes \u002Fapi\u002Fhigh-school\u002Fteams\u002F:teamId\u002Fgc-source,\n\u002F\u002F \u002Fapi\u002Fhigh-school\u002Fteams\u002F:teamId\u002Fseasons\u002F:seasonId\u002Fimport-runs[\u002F:runId\n\u002F\u002F [\u002Fcancel|\u002Fretry|\u002Fpublish]], and ...\u002Fstats (see\n\u002F\u002F src\u002Fhigh-school-import-routes.js). All authorization (entitlement, org\n\u002F\u002F scoping, read-only support sessions, kill-switch\u002Fconcurrency limits) is\n\u002F\u002F enforced server-side; every check in this section is a usability\n\u002F\u002F affordance only, never the actual security boundary -- a rejected\n\u002F\u002F request still surfaces the server's own error via the same\n\u002F\u002F alert()\u002Finline-error paths used elsewhere in this file. Starting an\n\u002F\u002F import never implies publication -- publish is always a distinct,\n\u002F\u002F explicit, reviewed action.\nlet hsImportTeamId = null;\nlet hsImportSeasonId = null;\nlet hsImportRuns = [];\nlet hsImportCurrentRun = null;\nlet hsImportPollTimer = null;\nlet hsImportStats = null;\n\nasync function loadHsImportTabDeps() {\n  if (!hsProgram) { renderHsRequiresProgram('hs-pane-import'); return; }\n  const el = document.getElementById('hs-pane-import');\n  if (el) el.innerHTML = '<p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp>';\n  try {\n    const [teamsRes, seasonsRes] = await Promise.all([\n      apiFetch('\u002Fapi\u002Fhigh-school\u002Fteams'),\n      apiFetch('\u002Fapi\u002Fhigh-school\u002Fseasons'),\n    ]);\n    const teamsData = await teamsRes.json();\n    const seasonsData = await seasonsRes.json();\n    if (!teamsRes.ok) { renderHsApiError('hs-pane-import', teamsData.error, 'loadHsImportTabDeps'); return; }\n    if (!seasonsRes.ok) { renderHsApiError('hs-pane-import', seasonsData.error, 'loadHsImportTabDeps'); return; }\n    hsTeams = teamsData.teams;\n    hsSeasons = seasonsData.seasons;\n  } catch (err) {\n    renderHsNetworkError('hs-pane-import', 'loadHsImportTabDeps');\n    return;\n  }\n  renderHsImportPane();\n}\n\nfunction renderHsImportPane() {\n  const el = document.getElementById('hs-pane-import');\n  if (!el) return;\n  if (hsImportPollTimer) { clearInterval(hsImportPollTimer); hsImportPollTimer = null; }\n  if (!hsTeams.length || !hsSeasons.length) {\n    el.innerHTML = `\n      <div class=\"empty empty-hero\">\n        <div class=\"empty-icon\"><svg viewBox=\"0 0 24 24\" width=\"34\" height=\"34\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M12 2v20M2 12h20\"\u002F><\u002Fsvg><\u002Fdiv>\n        <h3>Add a team and a season first<\u002Fh3>\n        <p>GameChanger import runs per team, per season.<\u002Fp>\n        <div style=\"display:flex;gap:8px;margin-top:16px\">\n          <button class=\"btn btn-outline\" onclick=\"switchHsTab('teams')\">Go to Teams<\u002Fbutton>\n          <button class=\"btn btn-outline\" onclick=\"switchHsTab('seasons')\">Go to Seasons<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    return;\n  }\n  if (!hsImportTeamId || !hsTeams.some(t => t.id === hsImportTeamId)) hsImportTeamId = hsTeams[0].id;\n  if (!hsImportSeasonId || !hsSeasons.some(s => s.id === hsImportSeasonId)) {\n    const current = hsSeasons.find(s => s.is_current);\n    hsImportSeasonId = current ? current.id : hsSeasons[0].id;\n  }\n  const team = hsTeams.find(t => t.id === hsImportTeamId);\n  const readOnly = isHsReadOnly();\n\n  el.innerHTML = `\n    <div class=\"actions\">\n      <div class=\"opt-group\" style=\"min-width:220px\">\n        <label for=\"hsImportTeamSelect\">Team<\u002Flabel>\n        <select class=\"opt-select\" id=\"hsImportTeamSelect\" onchange=\"onHsImportTeamChange()\">\n          ${hsTeams.map(t => `<option value=\"${t.id}\" ${t.id === hsImportTeamId ? 'selected' : ''}>${escHtml(t.name)}<\u002Foption>`).join('')}\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"opt-group\" style=\"min-width:220px\">\n        <label for=\"hsImportSeasonSelect\">Season<\u002Flabel>\n        <select class=\"opt-select\" id=\"hsImportSeasonSelect\" onchange=\"onHsImportSeasonChange()\">\n          ${hsSeasons.map(s => `<option value=\"${s.id}\" ${s.id === hsImportSeasonId ? 'selected' : ''}>${escHtml(s.name)}<\u002Foption>`).join('')}\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"hsGcSourceWrap\"><\u002Fdiv>\n    <div id=\"hsImportRunsWrap\"><p class=\"log-empty\" style=\"color:var(--muted)\">Loading...<\u002Fp><\u002Fdiv>\n    <div id=\"hsImportStatsWrap\"><\u002Fdiv>\n  `;\n  renderHsGcSourceStatus(team, readOnly);\n  loadHsImportRuns();\n  loadHsStats();\n}\n\nfunction onHsImportTeamChange() {\n  hsImportTeamId = document.getElementById('hsImportTeamSelect').value;\n  renderHsImportPane();\n}\nfunction onHsImportSeasonChange() {\n  hsImportSeasonId = document.getElementById('hsImportSeasonSelect').value;\n  renderHsImportPane();\n}\n\nfunction renderHsGcSourceStatus(team, readOnly) {\n  const wrap = document.getElementById('hsGcSourceWrap');\n  if (!wrap) return;\n  if (team && team.gc_team_url) {\n    wrap.innerHTML = `\n      <div class=\"team-summary\" style=\"margin:8px 0\">\n        <span>GameChanger source connected<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span style=\"color:var(--muted)\">${escHtml(team.gc_team_url)}<\u002Fspan>\n        ${readOnly ? '' : `<button class=\"btn btn-outline\" style=\"margin-left:12px\" onclick=\"promptHsGcSource()\">Change<\u002Fbutton>`}\n      <\u002Fdiv>`;\n  } else {\n    wrap.innerHTML = `\n      <div style=\"padding:16px 0;color:var(--muted)\">\n        <p style=\"margin:0 0 8px\">No GameChanger source connected for this team yet.<\u002Fp>\n        ${readOnly ? '' : `<button class=\"btn btn-primary\" onclick=\"promptHsGcSource()\">Connect GameChanger Team<\u002Fbutton>`}\n      <\u002Fdiv>`;\n  }\n}\n\nasync function promptHsGcSource() {\n  const url = window.prompt('Paste this team\u2019s GameChanger schedule URL (e.g. https:\u002F\u002Fweb.gc.com\u002Fteams\u002F<org>\u002F<team>):');\n  if (!url) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fgc-source`, {\n      method: 'PATCH', body: JSON.stringify({ gcTeamUrl: url }),\n    });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not connect that GameChanger team.'); return; }\n    const idx = hsTeams.findIndex(t => t.id === hsImportTeamId);\n    if (idx >= 0) hsTeams[idx] = { ...hsTeams[idx], ...data.team };\n    renderHsGcSourceStatus(hsTeams[idx], isHsReadOnly());\n    await loadHsImportRuns();\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\nasync function loadHsImportRuns() {\n  const wrap = document.getElementById('hsImportRunsWrap');\n  if (!wrap || !hsImportTeamId || !hsImportSeasonId) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fimport-runs`);\n    const data = await res.json();\n    if (!res.ok) { wrap.innerHTML = `<p class=\"log-empty\">${escHtml(data.error || 'Could not load import history.')}<\u002Fp>`; return; }\n    hsImportRuns = data.importRuns || [];\n    renderHsImportRunsList(data.collectionEnabled);\n  } catch (err) {\n    wrap.innerHTML = '<p class=\"log-empty\">Network error loading import history.<\u002Fp>';\n  }\n}\n\nconst HS_IMPORT_STATUS_LABELS = {\n  pending: 'Pending', running: 'Collecting\u2026', succeeded: 'Ready to review', failed: 'Failed', partial: 'Partially completed',\n};\n\nfunction renderHsImportRunsList(collectionEnabled) {\n  const wrap = document.getElementById('hsImportRunsWrap');\n  if (!wrap) return;\n  const team = hsTeams.find(t => t.id === hsImportTeamId);\n  const readOnly = isHsReadOnly();\n  const canStart = team && team.gc_team_url && !readOnly;\n\n  let banner = '';\n  if (collectionEnabled === false) {\n    banner = `<div class=\"empty\" style=\"padding:10px 0;color:var(--muted)\">Automated GameChanger collection is currently disabled by an operator. Existing published statistics remain available below.<\u002Fdiv>`;\n  }\n\n  const startButton = readOnly\n    ? ''\n    : `<button class=\"btn btn-primary\" ${canStart ? '' : 'disabled'} onclick=\"startHsImport()\">Start Import<\u002Fbutton>`;\n\n  const rows = hsImportRuns.map(run => `\n    <div class=\"roster-row\" data-run-id=\"${run.id}\">\n      <div class=\"roster-name\">${new Date(run.created_at).toLocaleString()}<\u002Fdiv>\n      <div style=\"color:var(--muted)\">${escHtml(HS_IMPORT_STATUS_LABELS[run.status] || run.status)}${run.games_succeeded != null ? ` \u00b7 ${run.games_succeeded} game(s)` : ''}<\u002Fdiv>\n      <div class=\"roster-actions\">\n        <button class=\"btn btn-outline\" onclick=\"viewHsImportRun('${run.id}')\">Review<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n\n  wrap.innerHTML = `\n    ${banner}\n    <div class=\"team-summary\" style=\"margin:8px 0\">${startButton}<\u002Fdiv>\n    <div id=\"hsImportDetailWrap\"><\u002Fdiv>\n    <div class=\"roster-list\">${rows || '<p class=\"log-empty\" style=\"color:var(--muted)\">No imports yet for this team and season.<\u002Fp>'}<\u002Fdiv>\n  `;\n}\n\nasync function startHsImport() {\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fimport-runs`, { method: 'POST', body: JSON.stringify({}) });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not start the import.'); return; }\n    await loadHsImportRuns();\n    viewHsImportRun(data.importRun.id);\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\nasync function viewHsImportRun(runId) {\n  if (hsImportPollTimer) { clearInterval(hsImportPollTimer); hsImportPollTimer = null; }\n  await refreshHsImportRunDetail(runId);\n  hsImportPollTimer = setInterval(() => {\n    if (!hsImportCurrentRun || hsImportCurrentRun.importRun.status === 'running') refreshHsImportRunDetail(runId);\n    else { clearInterval(hsImportPollTimer); hsImportPollTimer = null; }\n  }, 4000);\n}\n\nasync function refreshHsImportRunDetail(runId) {\n  const detailWrap = document.getElementById('hsImportDetailWrap');\n  if (!detailWrap) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fimport-runs\u002F${runId}`);\n    const data = await res.json();\n    if (!res.ok) { detailWrap.innerHTML = `<p class=\"log-empty\">${escHtml(data.error || 'Could not load this import.')}<\u002Fp>`; return; }\n    hsImportCurrentRun = data;\n    renderHsImportRunDetail(data);\n  } catch (err) {\n    detailWrap.innerHTML = '<p class=\"log-empty\">Network error loading import status.<\u002Fp>';\n  }\n}\n\nfunction renderHsImportRunDetail(data) {\n  const detailWrap = document.getElementById('hsImportDetailWrap');\n  if (!detailWrap) return;\n  const run = data.importRun;\n  const readOnly = isHsReadOnly();\n  const statusLabel = HS_IMPORT_STATUS_LABELS[run.status] || run.status;\n\n  const reviewRows = [\n    `Games found: ${run.games_discovered ?? 0}`,\n    `Imported: ${run.games_succeeded ?? 0}`,\n    `Failed: ${run.games_failed ?? 0}`,\n    `Matched players: ${data.reconciliation.matched.length}`,\n    `Unmatched players: ${data.reconciliation.unmatched.length}`,\n    `Ambiguous players: ${data.reconciliation.ambiguous.length}`,\n  ];\n\n  const attentionList = [...data.reconciliation.unmatched.map(p => `${p.name} (no roster match)`), ...data.reconciliation.ambiguous.map(p => `${p.name} (multiple possible matches)`)];\n\n  let actions = '';\n  if (!readOnly) {\n    if (run.status === 'running') {\n      actions = `<button class=\"btn btn-outline\" onclick=\"cancelHsImport('${run.id}')\">Cancel<\u002Fbutton>`;\n    } else if (run.status === 'failed' || run.status === 'partial') {\n      actions = `<button class=\"btn btn-outline\" onclick=\"retryHsImport('${run.id}')\">Retry<\u002Fbutton>`;\n    }\n    if (data.publishable) {\n      actions += ` <button class=\"btn btn-primary\" onclick=\"publishHsImport('${run.id}')\">Publish<\u002Fbutton>`;\n    }\n  }\n\n  detailWrap.innerHTML = `\n    <div class=\"team-panel\" style=\"margin:8px 0\">\n      <div class=\"team-title\" style=\"font-size:14px\">Import status: ${escHtml(statusLabel)}<\u002Fdiv>\n      <div class=\"team-summary\">${reviewRows.map(r => `<span>${escHtml(r)}<\u002Fspan>`).join('<span class=\"dot-sep\">\u00b7<\u002Fspan>')}<\u002Fdiv>\n      ${attentionList.length ? `<div style=\"margin-top:8px;color:var(--muted)\">Needs attention: ${attentionList.map(escHtml).join(', ')} \u2014 resolve on the Roster tab, then re-import.<\u002Fdiv>` : ''}\n      ${!data.publishable && run.status === 'succeeded' ? `<div style=\"margin-top:8px;color:var(--muted)\">Not yet publishable: box-score coverage is incomplete or a validation mismatch is unresolved.<\u002Fdiv>` : ''}\n      <div style=\"margin-top:12px\">${actions}<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\nasync function cancelHsImport(runId) {\n  if (!window.confirm('Cancel this import? Games already collected will be kept.')) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fimport-runs\u002F${runId}\u002Fcancel`, { method: 'POST' });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not cancel this import.'); return; }\n    await refreshHsImportRunDetail(runId);\n    await loadHsImportRuns();\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\nasync function retryHsImport(runId) {\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fimport-runs\u002F${runId}\u002Fretry`, { method: 'POST' });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not retry this import.'); return; }\n    await loadHsImportRuns();\n    viewHsImportRun(data.importRun.id);\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\nasync function publishHsImport(runId) {\n  if (!window.confirm('Publish these statistics? This replaces any previously published totals for this team and season.')) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fimport-runs\u002F${runId}\u002Fpublish`, { method: 'POST' });\n    const data = await res.json();\n    if (!res.ok) { alert(data.error || 'Could not publish these statistics.'); return; }\n    alert('Published.');\n    await refreshHsImportRunDetail(runId);\n    await loadHsStats();\n  } catch (err) {\n    alert('Network error. Please try again.');\n  }\n}\n\nasync function loadHsStats() {\n  const wrap = document.getElementById('hsImportStatsWrap');\n  if (!wrap || !hsImportTeamId || !hsImportSeasonId) return;\n  try {\n    const res = await apiFetch(`\u002Fapi\u002Fhigh-school\u002Fteams\u002F${hsImportTeamId}\u002Fseasons\u002F${hsImportSeasonId}\u002Fstats`);\n    const data = await res.json();\n    if (!res.ok) { wrap.innerHTML = ''; return; }\n    hsImportStats = data;\n    renderHsStats(data);\n  } catch (err) {\n    \u002F\u002F Non-fatal -- the import history above is still usable without stats.\n  }\n}\n\nfunction renderHsStats(data) {\n  const wrap = document.getElementById('hsImportStatsWrap');\n  if (!wrap) return;\n  if (!data.verifiedTotals) {\n    wrap.innerHTML = '';\n    return;\n  }\n  const t = data.verifiedTotals;\n  wrap.innerHTML = `\n    <div class=\"team-panel\" style=\"margin-top:16px\">\n      <div class=\"team-title\" style=\"font-size:14px\">Published Season Statistics<\u002Fdiv>\n      <div class=\"team-summary\">\n        <span>${t.games} game(s)<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span>Confidence: ${escHtml(t.confidence)}<\u002Fspan>\n        <span class=\"dot-sep\">\u00b7<\u002Fspan>\n        <span style=\"color:var(--muted)\">Updated ${new Date(t.updated_at).toLocaleString()}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"roster-list\" style=\"margin-top:8px\">\n        ${data.playerAdvancedStats.map(p => `<div class=\"roster-row\"><div class=\"roster-name\">Player<\u002Fdiv><div style=\"color:var(--muted)\">K%: ${p.k_pct ?? '\u2014'} \u00b7 BB%: ${p.bb_pct ?? '\u2014'}<\u002Fdiv><\u002Fdiv>`).join('')}\n        ${data.pitcherAdvancedStats.map(p => `<div class=\"roster-row\"><div class=\"roster-name\">Pitcher<\u002Fdiv><div style=\"color:var(--muted)\">S%: ${p.s_pct ?? '\u2014'}<\u002Fdiv><\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\n\u002F\u002F \u2500\u2500 Admin panel access \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u002F\u002F Never decided by comparing user.email client-side \u2014 the button's visibility\n\u002F\u002F only reflects what the server (GET \u002Fapi\u002Fadmin\u002Fstatus, backed by the\n\u002F\u002F platform_admins table) actually confirmed for this authenticated user.\n\u002F\u002F \u002Fadmin and every \u002Fapi\u002Fadmin\u002F* route independently re-verify this too.\nasync function refreshAdminButton() {\n  const btn = document.getElementById('adminPanelBtn');\n  if (!btn) return;\n  try {\n    const session = getSession();\n    if (!session?.accessToken) { btn.style.display = 'none'; return; }\n    const res = await fetch('\u002Fapi\u002Fadmin\u002Fstatus', {\n      headers: { Authorization: 'Bearer ' + session.accessToken },\n    });\n    if (!res.ok) { btn.style.display = 'none'; return; }\n    const data = await res.json();\n    btn.style.display = data?.isAdmin ? '' : 'none';\n  } catch (e) {\n    btn.style.display = 'none';\n  }\n}\n\n\u002F\u002F \u2500\u2500 Support-view session (admin browsing this dashboard scoped to a customer org) \u2500\u2500\nconst SUPPORT_SESSION_KEY = 'jobuSupportSession';\n\nfunction getSupportSession() {\n  try {\n    const raw = sessionStorage.getItem(SUPPORT_SESSION_KEY);\n    return raw ? JSON.parse(raw) : null;\n  } catch (e) { return null; }\n}\n\nfunction renderSupportSessionBanner() {\n  const banner = document.getElementById('supportSessionBanner');\n  const text = document.getElementById('supportSessionText');\n  const support = getSupportSession();\n  if (!banner || !text) return;\n  if (!support) { banner.style.display = 'none'; return; }\n  const expires = support.expiresAt ? new Date(support.expiresAt) : null;\n  if (expires && expires.getTime() < Date.now()) {\n    sessionStorage.removeItem(SUPPORT_SESSION_KEY);\n    banner.style.display = 'none';\n    return;\n  }\n  text.textContent = 'Viewing Jobu Scout as ' + (support.orgName || 'customer') +\n    ' \u2014 Read Only' + (expires ? (' (expires ' + expires.toLocaleTimeString() + ')') : '');\n  banner.style.display = 'flex';\n}\n\nasync function endSupportSessionView() {\n  const support = getSupportSession();\n  if (!support) return;\n  try {\n    const session = getSession();\n    await fetch('\u002Fapi\u002Fadmin\u002Fsupport-sessions\u002F' + support.sessionId + '\u002Fend', {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application\u002Fjson',\n        Authorization: 'Bearer ' + (session?.accessToken || ''),\n      },\n    });\n  } catch (e) {}\n  sessionStorage.removeItem(SUPPORT_SESSION_KEY);\n  window.location.href = '\u002Fadmin';\n}\n\n\u002F\u002F Auto-attach the active support session's token to same-origin API calls so\n\u002F\u002F every existing fetch() call site in this file transparently browses the
